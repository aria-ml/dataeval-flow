[project]
name = "dataeval-flow-service"
version = "0.1.0"
description = "Local execution service for DataEval Flow pipelines"
requires-python = ">=3.11,<3.15"
dependencies = ["dataeval-flow>=0.2.3.dev733", "fastapi>=0.116", "uvicorn>=0.35"]

[project.scripts]
dataeval-flow-service = "dataeval_flow_service._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataeval_flow_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D1"]
ignore = ["ANN401"]
per-file-ignores = { "tests/*" = ["ANN", "D", "B008"] }

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
