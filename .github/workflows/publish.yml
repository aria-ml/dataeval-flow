# Publish to PyPI using Trusted Publisher: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
name: Upload Python Package

on:
  push:
    tags: ['v*']

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/p/dataeval-flow
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Extract the section for this version from CHANGELOG.md. An awk
          # `start,end` range is wrong here: the heading matches the end pattern
          # too, so the range would close on the line it opened and yield nothing.
          CHANGELOG=$(awk -v ver="## ${VERSION}" '
            $0 == ver { inside = 1; next }
            inside && /^## v[0-9]/ { exit }
            inside { print }
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${VERSION}"
          fi

          {
            echo 'NOTES<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.NOTES }}
          draft: false
          # `release.py prerelease` cuts vX.Y.Z-rcN / -aN; only those carry a hyphen,
          # so a candidate is never published as the latest stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
