# Data Cleaning — Advisory Workflow
# Mirrors the configuration in data_cleaning.py
# All paths are relative to the data root (docs/source/notebooks/)
#
# You can execute this workflow with `dataeval-flow --config data_cleaning.yaml`
#
# yaml-language-server: $schema=../../../config/params.schema.json

datasets:
  - name: skysealand_base
    format: coco
    path: data/skysealand_datamaite_base

views:
  # Shuffle before limiting: SkySeaLand is stored grouped by collection site, so a bare
  # Limit would sample one site rather than the dataset.
  - name: sample300
    operations:
      - type: Shuffle
        params:
          seed: 0
      - type: Limit
        params:
          size: 300

sources:
  - name: skysealand_src
    dataset: skysealand_base
    view: sample300

extractors:
  - name: bovw_ext
    model: bovw
    vocab_size: 512
    batch_size: 32

workflows:
  - name: skysealand_advisory_clean
    type: data-cleaning
    mode: advisory
    # Outlier detection
    outlier_method: adaptive
    outlier_threshold: 3.5
    outlier_flags: [dimension, pixel, visual]
    outlier_cluster_threshold: 3.5
    outlier_cluster_algorithm: hdbscan
    outlier_n_clusters: 4
    # Duplicate detection — hash-based plus cluster-based
    duplicate_cluster_sensitivity: 0.5
    duplicate_cluster_algorithm: hdbscan
    duplicate_n_clusters: 4
    # Relaxed thresholds: four collection sites with different sensors and altitudes
    health_thresholds:
      exact_duplicates: 0.0
      near_duplicates: 5.0
      image_outliers: 5.0
      target_outliers: 10.0
      classwise_outliers: 12.0
      class_label_imbalance: 5.0

tasks:
  - name: skysealand_clean
    workflow: skysealand_advisory_clean
    sources: skysealand_src
    extractor: bovw_ext
