# Quality
# Mirrors the configuration in data_cleaning.py
# All paths are relative to the data root (docs/source/notebooks/)
#
# You can execute this workflow with `dataeval-flow --config data_cleaning.yaml`.
# With `--output ./output`, the skysealand_export task also writes the cleaned dataset
# under output/datasets/skysealand_export.dataset/.
#
# yaml-language-server: $schema=../../../config/params.schema.json

datasets:
  - name: skysealand_base
    format: coco
    path: data/skysealand_datamaite_base

views:
  # Shuffle before limiting: SkySeaLand is stored grouped by collection site, so a bare
  # Limit would sample one site rather than the dataset.
  - name: sample300
    operations:
      - type: Shuffle
        params:
          seed: 0
      - type: Limit
        params:
          size: 300

sources:
  - name: skysealand_src
    dataset: skysealand_base
    view: sample300

extractors:
  - name: bovw_ext
    model: bovw
    vocab_size: 512
    batch_size: 32

workflows:
  - name: skysealand_cleaning
    type: quality
    # Outlier detection
    outliers:
      outlier_threshold: [adaptive, 3.5]
      flags: [dimension, pixel, visual]
      cluster_threshold: 3.5
      cluster_algorithm: hdbscan
      n_clusters: 4
    # Duplicate detection — hash-based plus cluster-based
    duplicates:
      cluster_sensitivity: 0.5
      cluster_algorithm: hdbscan
      n_clusters: 4
    # Relaxed thresholds: four collection sites with different sensors and altitudes
    checks:
      image-duplicates: {exact: 0.0, near: 5.0}
      image-outliers: {warning: 5.0}
      target-outliers: {warning: 10.0}
      class-outliers: {warning: 12.0}

  # quality as a step: `cleaning.clean` is the dataset without what it flagged
  - name: clean_export
    inputs: [data]
    steps:
      - {name: cleaning, workflow: skysealand_cleaning, input: data}
      - {name: dataset, transform: export, input: cleaning.clean, format: coco}

tasks:
  - name: skysealand_clean
    workflow: skysealand_cleaning
    sources: skysealand_src
    extractor: bovw_ext

  - name: skysealand_export
    workflow: clean_export
    sources: skysealand_src
    extractor: bovw_ext
