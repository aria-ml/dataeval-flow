# JATIC Compliant GitLab CI/CD Pipeline
# Reference: docs/design/JATIC project software requirements.md

# Auto-cancel stale pipelines when new commits are pushed to MRs
# https://gitlab.jatic.net/help/ci/yaml/index.md#workflowauto_cancelon_new_commit
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - lint
  - security
  - test
  - publish
  - release

# GitLab Security Templates [DSOR-1 to DSOR-5]
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PYTHON_VERSION: "3.11"
  DOCKER_TLS_CERTDIR: "/certs"
  FORCE_COLOR: "1"

  # Long-lived maintenance branches (release/v0.2, ...), cut from a release tag so
  # a supported line can take patches without pulling in everything on main. See
  # BRANCHING.md. The container chain runs on these so an image can be validated
  # before the tag is pushed; the docs/Pages publish deliberately does not, since
  # an older line must not overwrite the published site.
  RELEASE_BRANCH_PATTERN: '/^release\/v.*/'

  # Harbor Registry Configuration
  # HARBOR_TOKEN must be set as a CI/CD Variable in GitLab
  HARBOR_URL: "harbor.jatic.net"

  # Target Image Path
  # Used for tagging and pushing to Harbor
  CI_APPLICATION_REPOSITORY: "${HARBOR_URL}/aria/dataeval-flow"
  # Separate cache repo for buildx registry cache (mode=max)
  CI_CACHE_REPOSITORY: "${HARBOR_URL}/aria/cache"
  # CS-2-H-2 names Trivy v0.62.0+ as an approved scanner. Pinned rather than
  # floating so a published image's report names a scanner version that was
  # chosen, not whatever happened to be current the day it built.
  TRIVY_VERSION: "0.74.0"

# Shared variant list — edit once, used by all matrix jobs
.variants: &variants
  - VARIANT: [cpu, cu126, cu130]

# -----------------------------------------------------------------------------
# Shared Templates
# -----------------------------------------------------------------------------

# Base template for all uv/nox jobs
.nox:
  image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim
  variables:
    GIT_DEPTH: "0"  # full history so hatch-vcs / poetry-dynamic-versioning can resolve tags
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    # `uv sync` installs the project, which runs hatch-vcs and needs git.
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - git fetch --tags
  after_script:
    - uv cache prune --ci

# PUBLISH_VERIFICATION is a standalone workflow: a web-triggered pipeline that
# only regenerates and republishes meta repo artifacts. Every other job opts out
# of it via this anchor so the trigger doesn't rebuild containers or rerun the
# test matrix. Anchor (not a rule template) so it can be prepended to jobs that
# already declare their own inline `rules:`.
.skip_publish_verification: &skip_publish_verification
  if: $PUBLISH_VERIFICATION
  when: never

.skip_nightly_docs: &skip_nightly_docs
  if: $NIGHTLY_DOCS == "true" || $DOCS_CLEAN == "true"
  when: never

# Shared rule sets
.rules_main_mr:
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules_mr_only:
  rules:
    - *skip_publish_verification
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules_main_only:
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($NIGHTLY_DOCS == "true" || $DOCS_CLEAN == "true")
      variables:
        DOCS_ARG: "-- clean"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        DOCS_ARG: ""

# Run only when dependency-defining files change (or on main). Used to gate
# the install-validation jobs so they don't run on docs/code-only MRs.
.rules_main_mr_deps:
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - pyproject.toml
          - uv.lock
          - poetry.lock
          - environment.yml
          - requirements.txt

# -----------------------------------------------------------------------------
# Lint Stage
# -----------------------------------------------------------------------------

lint:
  extends: [.nox, .rules_main_mr]
  stage: lint
  script:
    - uvx --with nox-uv nox -s lint

# Type Check [TR-7-H-1, TR-7-H-2]
# Type check should be an explicit, visible job in the pipeline, not hidden in lint
type-check:
  extends: [.nox, .rules_main_mr]
  stage: lint
  script:
    - uvx --with nox-uv nox -s type

# Schema Validation - Ensure params.schema.json is up to date
schema:
  extends: [.nox, .rules_main_mr]
  stage: lint
  script:
    - uvx --with nox-uv nox -s schema

# Markdown lint [DR-3.3-H-3]
markdownlint:
  extends: [.rules_main_mr]
  stage: lint
  needs: []
  image:
    name: davidanson/markdownlint-cli2
    entrypoint: ['']
  script: |
    FAIL=0
    markdownlint-cli2 README.md || FAIL=1
    markdownlint-cli2 CONTRIBUTING.md || FAIL=1
    markdownlint-cli2 BRANCHING.md || FAIL=1
    markdownlint-cli2 ROADMAP.md || FAIL=1
    markdownlint-cli2 CODE_OF_CONDUCT.md || FAIL=1
    markdownlint-cli2 CHANGELOG.md || FAIL=1
    markdownlint-cli2 SECURITY.md || FAIL=1
    markdownlint-cli2 'docs/**/*.md' '#node_modules' || FAIL=1
    exit $FAIL

# Markdown link check [DR-3.3-H-4]
# Allow failure: link checking is sensitive to transient network issues and
# anti-scraping measures on some sites. Warnings should be reviewed but not block merges.
#
# `markdown-link-check` takes FILES, not directories — passing `./docs/source`
# silently checked nothing (and the resulting error was swallowed by
# allow_failure). Enumerate the files with `find` so docs/source is really
# covered, and accumulate the exit status so one bad file does not mask the rest.
linkchecker:
  extends: [.rules_main_mr]
  stage: lint
  needs: []
  image:
    name: ghcr.io/tcort/markdown-link-check:stable
    entrypoint: ['/bin/sh', '-c']
  script: |
    FAIL=0
    markdown-link-check --config docs/.markdown-link-check.json \
      BRANCHING.md CHANGELOG.md CODE_OF_CONDUCT.md CONTRIBUTING.md \
      README.md ROADMAP.md SECURITY.md docs/CACHE_MANAGEMENT.md || FAIL=1
    # -print0/-0 so paths with spaces survive; -r keeps xargs from running on an empty set.
    find docs/source -name '*.md' -not -path '*/.jupyter_cache/*' -print0 \
      | xargs -0 -r -n1 markdown-link-check --config docs/.markdown-link-check.json || FAIL=1
    exit $FAIL
  allow_failure: true

# -----------------------------------------------------------------------------
# Test Stage [TR-1-H-4: Python 3.10 - 3.14]
# -----------------------------------------------------------------------------

test:
  extends: [.nox, .rules_main_mr]
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - uvx --with nox-uv nox -s test
  artifacts:
    # Directory form (not `output/*`) so the dotted coverage data files
    # (output/.coverage.3.11) survive into the `coverage` job.
    # The per-job cobertura report and the coverage: regex live on that job
    # instead, so the MR widget shows one combined number, not a matrix average.
    paths:
      - output/
    reports:
      junit: output/junit.*.xml
    expire_in: 1 week

# Requirements verification suite (FR/NFR compliance) — runs separately from
# unit tests, with its own JUnit report and no coverage gate.
verify:
  extends: [.nox, .rules_main_mr]
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  # TC-19.1 (NFR-6) re-reads the coverage report to attest the 90% threshold.
  # Without the `test` artifacts there is no report to read, so the check
  # skipped on every run and the generated VCRM recorded NFR-6 as a coverage
  # failure against a product measured at 95.86%. Pulling the artifacts makes
  # the attestation real; the cost is that verify starts after test rather
  # than alongside it.
  needs:
    - job: test
      artifacts: true
  script:
    - uvx --with nox-uv nox -s verify
  artifacts:
    paths:
      - output/verification_report.json
      # Rendered test cases + VCRM. Not pushed anywhere from here — downloadable
      # on the MR so meta repo changes are reviewable before a release publishes them.
      - output/metarepo/
    reports:
      junit: output/verify.xml
    expire_in: 1 week

# Minimum-dependencies + no-optional-extras smoke test
# [TR-1-H-4] verify supported Python versions & dep min/max
# [TR-2-H-3] test without optional deps
# [TR-2-H-5] test against documented dep versions
# [TR-8-H-1] features usable independently
#
# Pins Python to the minimum supported version (3.10) and resolves every
# direct dependency to its lowest declared version (--resolution=lowest-direct).
# Only the `cpu` extra is installed so torch/torchvision are available; `onnx`,
# `opencv`, and `app` are deliberately omitted, and tests/app is skipped because
# its conftest imports textual unconditionally.
deps:
  extends: [.nox, .rules_main_mr]
  stage: test
  variables:
    PYTHON_VERSION: "3.10"
  script:
    - uvx --with nox-uv nox -s deps

# -----------------------------------------------------------------------------
# Install Validation [SR-3-H-2..5, SR-5-H-1, SR-5-H-2]
# Verifies the project installs cleanly via every documented toolchain.
# Runs only when dependency-defining files change.
# -----------------------------------------------------------------------------

# Validate uv.lock + poetry.lock are both up-to-date with pyproject.toml
install:lock:
  extends: [.nox, .rules_main_mr_deps]
  stage: test
  script:
    - uvx --with nox-uv nox -s check

# Validate `pip install .[cpu]` from a source checkout.
# `git` + full history are required so hatch-vcs can derive __version__ from
# tags when the hatchling build hook runs inside pip.
install:pip:
  extends: [.rules_main_mr_deps]
  stage: test
  image: python:${PYTHON_VERSION}-slim
  variables:
    PYTHON_VERSION: "3.11"
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - git fetch --tags
  script:
    - python -m venv /tmp/venv-pip
    - /tmp/venv-pip/bin/pip install --upgrade pip
    - /tmp/venv-pip/bin/pip install ".[cpu]" --extra-index-url https://download.pytorch.org/whl/cpu
    - /tmp/venv-pip/bin/python -c "import dataeval_flow; print('dataeval_flow', dataeval_flow.__version__)"
    - /tmp/venv-pip/bin/dataeval-flow --help

# Validate `poetry install` from a source checkout (uses committed poetry.lock).
install:poetry:
  extends: [.rules_main_mr_deps]
  stage: test
  image: python:${PYTHON_VERSION}-slim
  variables:
    PYTHON_VERSION: "3.11"
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
    POETRY_NO_INTERACTION: "1"
  script:
    - pip install --quiet "poetry>=2.2.0"
    - poetry install --extras cpu
    - poetry run python -c "import dataeval_flow; print('dataeval_flow', dataeval_flow.__version__)"
    - poetry run dataeval-flow --help

# Validate `conda env create -f environment.yml` (uses committed environment.yml).
# `git` is required so hatch-vcs can derive __version__ during `pip install -e`.
# The micromamba image runs as a non-root user (mambauser) and does not include
# git; install it from conda-forge (unprivileged-friendly) instead of apt.
install:conda:
  extends: [.rules_main_mr_deps]
  stage: test
  image: mambaorg/micromamba:2-ubuntu24.04
  variables:
    PYTHON_VERSION: "3.11"
  before_script:
    - eval "$(micromamba shell hook --shell bash)"
    - micromamba create -f environment.yml -n dataeval-flow python=$PYTHON_VERSION
    - micromamba activate dataeval-flow
    # Install git into the active env so it's on PATH for `git fetch` and for
    # the hatchling build subprocess invoked by `pip install -e` (which
    # inherits the active env's PATH).
    - micromamba install -y -c conda-forge git
    # Workspace is owned by the GitLab runner UID, not mambauser → mark safe
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --tags
    # Install the project itself (conda manages base deps, but the package isn't on conda-forge)
    # Plus the cpu extra so torch is available for the smoke test
    - pip install --quiet -e ".[cpu]"
    - micromamba list
  script:
    - python -c "import dataeval_flow; print('dataeval_flow', dataeval_flow.__version__)"
    - dataeval-flow --help

# -----------------------------------------------------------------------------
# Coverage aggregation
# Merges the per-interpreter coverage data files produced by the test matrix
# (output/.coverage.3.10 … .3.14) into one report. The 90% gate is enforced
# twice: per matrix job by --cov-fail-under, and here on the union via
# [tool.coverage.report] fail_under.
#
# htmlcov/ is what the Pages jobs publish (MR preview + main /coverage site).
# -----------------------------------------------------------------------------

coverage:
  extends: [.rules_main_mr]
  stage: publish
  image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim
  needs:
    - job: test
      artifacts: true
  before_script:
    - uv pip install coverage --system
  script:
    - coverage combine ./output
    # Reports before the gate. Every coverage subcommand honours
    # [tool.coverage.report] fail_under and exits 2 when it isn't met, so
    # gating first would skip report generation exactly when it's most useful.
    # --fail-under=0 keeps these steps purely about writing files.
    # Explicit -o/-d: pyproject points both at output/, which is already
    # occupied by the per-matrix reports downloaded above.
    - coverage xml --skip-empty --fail-under=0 -o coverage.xml
    - coverage html --skip-empty --fail-under=0 -d htmlcov
    # The 90% gate on the union of all matrix runs.
    - coverage report -m --skip-empty --precision=2
  coverage: '/(?i)total.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'
  artifacts:
    # always: a failed gate still publishes the report showing what's uncovered.
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week

# -----------------------------------------------------------------------------
# Documentation — runs in parallel with container jobs
# -----------------------------------------------------------------------------

# Docs preview - Build docs on MRs for review
docs:preview:
  extends: [.nox, .rules_mr_only]
  stage: publish
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
    - key: docs-notebook-cache
      paths:
        - docs/source/notebooks/cache/
  script:
    - uvx --with nox-uv nox -s docs
  artifacts:
    when: always
    paths:
      - output/docs
    expose_as: "Documentation Preview"
    expire_in: 1 week

# GitLab Pages - Publish Sphinx documentation
pages:
  extends: [.nox, .rules_main_only]
  stage: publish
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
    - key: docs-notebook-cache
      paths:
        - docs/source/notebooks/cache/
  script:
    - uvx --with nox-uv nox -s docs $DOCS_ARG
    # Push the freshly-built jupyter-cache to the docs-artifacts/main orphan branch
    # so ReadTheDocs (and future CI builds) can fetch it. Requires the group-level
    # DATAEVAL_BUILD_PAT CI/CD variable. See docs/CACHE_MANAGEMENT.md.
    - bash docs/push-docs-cache.sh
    - mv output/docs public
  artifacts:
    # Upload on failure too — `nox -s docs` writes notebook error tracebacks to
    # output/docs/reports/**/*.err.log; on failure the `mv` above never runs, so
    # we include output/docs alongside public to surface those logs.
    when: always
    paths:
      - public
      - output/docs

# One Pages deployment per merge request, published under a path prefix
# (parallel deployments) rather than through the Pages artifacts proxy, which
# GitLab 19 rejects with a 403. Serves a landing page linking to whichever of
# the docs and coverage builds actually ran — both needs are optional, so a
# skipped or filtered-out upstream job degrades the site instead of failing it.
pages preview:
  extends: [.rules_mr_only]
  stage: release
  image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim
  needs:
    - job: docs:preview
      artifacts: true
      optional: true
    - job: coverage
      artifacts: true
      optional: true
  script:
    - bash .gitlab/scripts/build_preview_site.sh
  pages:
    publish: public
    path_prefix: 'mr-$CI_MERGE_REQUEST_IID'
    expire_in: 1 week
  artifacts:
    paths:
      - public/
  environment:
    name: 'preview/$CI_MERGE_REQUEST_IID'
    # Inside a Pages job CI_PAGES_URL already includes the path prefix;
    # appending it here would duplicate the mr-<iid> segment.
    url: '$CI_PAGES_URL'
    auto_stop_in: '1 week'

# Coverage report for the default branch, published as its own parallel
# deployment at <pages url>/coverage so it refreshes independently of the root
# docs site. `pages.publish` deploys straight from htmlcov/, so this job never
# competes with the `pages` job for public/.
pages coverage:
  extends: [.rules_main_only]
  stage: release
  image: alpine:latest
  needs:
    - job: coverage
      artifacts: true
  script:
    - echo "Publishing coverage report to $CI_PAGES_URL"
  pages:
    publish: htmlcov
    path_prefix: coverage
    expire_in: never
  artifacts:
    paths:
      - htmlcov/

# -----------------------------------------------------------------------------
# Container — runs in parallel with documentation jobs
# -----------------------------------------------------------------------------

# Two images are ever built, and a third tag points at one of them:
#
#   :main-<variant>      the newest build of the default branch
#   :<version>-<variant> a tagged release, immutable
#   :latest-<variant>    a retag of the highest stable release
#
# `latest` is a pointer, not a build -- `imagetools create` repoints it at a
# digest that is already published, scanned and signed, so it costs no storage
# and inherits every guarantee the release carries. It follows releases rather
# than the branch because that is what users assume it means.
#
# Nothing else reaches the registry. The previous design also pushed a
# version-stamped tag from every default-branch and release-branch commit
# (:0.2.4.dev7-g429a78e-cpu and so on); 145 of those accumulated in the old
# aria/dataeval repository, filled the Harbor project's 500 GiB quota and
# started failing pushes outright. A :latest overwritten in place costs one
# tag per variant however long the branch runs.
.rules_container_publish: &rules_container_publish
  - *skip_publish_verification
  - *skip_nightly_docs
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG =~ /^v\d+/

# Release branches build but never publish — see validate:docker.
.rules_container_validate: &rules_container_validate
  - *skip_publish_verification
  - *skip_nightly_docs
  - if: $CI_COMMIT_TAG
    when: never
  - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN

.container-setup:
  stage: publish
  image: docker:25.0.5-git
  variables:
    COSIGN_PASSWORD: ""
  rules: *rules_container_publish
  before_script:
    # `docker:25.0.5-git` is Alpine — no bash by default. docker/resolve-version.sh
    # uses bash-only features (`[[ =~ ]]`, `BASH_REMATCH`), so install bash for
    # every job that extends this template.
    - apk add --no-cache bash
    - echo ${HARBOR_TOKEN} | docker login ${HARBOR_URL} --username 'robot$aria+aria-bot' --password-stdin
  after_script:
    - docker logout ${HARBOR_URL} || true

# Resolve PEP 440 + OCI-safe versions ONCE for the whole pipeline.
# The version is derived from git tags (hatch-vcs source of truth) and is
# identical across variants — only the `-${VARIANT}` tag suffix differs — so
# every downstream container job consumes this dotenv instead of re-running
# resolve-version.sh (which would otherwise execute 15× across the matrix).
resolve:version:
  stage: publish
  image: alpine:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"  # full history so `git describe --tags` resolves a real version
  before_script:
    - apk add --no-cache bash git
  script:
    - git fetch --tags
    - eval "$(./docker/resolve-version.sh)"
    # The tag the image is published under. A release pipeline publishes the
    # version verbatim and never overwrites it; the only other pipeline that
    # publishes is the default branch, which overwrites :latest in place.
    # DATAEVAL_FLOW_VERSION is unaffected — it is baked into the wheel and the
    # OCI label, so a branch image still reports its true version.
    # The branch build is named after the branch it came from, so the tag and
    # its source stay 1:1 without anyone maintaining a second copy of the name.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        DATAEVAL_FLOW_PUBLISH_TAG="${DATAEVAL_FLOW_IMAGE_TAG}"
      else
        DATAEVAL_FLOW_PUBLISH_TAG="${CI_DEFAULT_BRANCH}"
      fi
    - echo "DATAEVAL_FLOW_VERSION=${DATAEVAL_FLOW_VERSION}" > version.env
    - echo "DATAEVAL_FLOW_IMAGE_TAG=${DATAEVAL_FLOW_IMAGE_TAG}" >> version.env
    - echo "DATAEVAL_FLOW_PUBLISH_TAG=${DATAEVAL_FLOW_PUBLISH_TAG}" >> version.env
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - *skip_publish_verification
    - *skip_nightly_docs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN
    - if: $CI_COMMIT_TAG =~ /^v\d+/

# Shared push template with cosign signing. Version vars (DATAEVAL_FLOW_VERSION,
# DATAEVAL_FLOW_IMAGE_TAG) are inherited from resolve:version's dotenv, so jobs
# that extend this must list resolve:version in `needs`.
.push-setup:
  extends: .container-setup
  before_script:
    - !reference [.container-setup, before_script]
    # `jq` is used downstream by release:sbom to extract the CycloneDX predicate
    # from the cosign attestation envelope; harmless to install everywhere.
    - apk add --no-cache cosign jq curl
    # Trivy from its release tarball rather than apk: Alpine's package lags, and
    # CS-2-H-2 sets a version floor the image's own report has to be able to name.
    - >-
      wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      | tar -xz -C /usr/local/bin trivy
    - trivy --version
    # syft generates the CycloneDX SBOM. Installed here rather than mid-job so a
    # missing tool fails before anything is built.
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft --version
    # Set up buildx builder for registry cache support (docker-container driver required for type=registry)
    - docker buildx create --use --name ci-builder || true

push:docker:
  extends: .push-setup
  needs:
    - job: resolve:version
      artifacts: true
  parallel:
    matrix: *variants
  script:
    # DATAEVAL_FLOW_VERSION / DATAEVAL_FLOW_PUBLISH_TAG inherited from resolve:version
    - PUBLISH_TAG="${DATAEVAL_FLOW_PUBLISH_TAG}-${VARIANT}"
    - echo "Building dataeval-flow ${DATAEVAL_FLOW_VERSION} → ${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}"

    # Run test stage — fails the job if tests/linting don't pass.
    #
    # Two --cache-from refs, one per product. DataEval-Flow and DataEval build
    # the same base (ubuntu:24.04, the same Python and uv pins) and diverge
    # only once their own dependencies are installed. BuildKit keys cache
    # entries on the content of each step, so the shared prefix hits whichever
    # product warmed it first and the product-specific tail only ever hits its
    # own ref. --cache-to writes this product's ref alone, so neither can
    # clobber the other's.
    - >-
      docker buildx build --target test
      --build-arg DATAEVAL_FLOW_VERSION="${DATAEVAL_FLOW_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      --cache-to type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT},mode=max,image-manifest=true
      -f docker/Dockerfile.${VARIANT} .

    # Build `prod` to a local tarball rather than pushing it. The image has to
    # exist before it can be scanned, and it must not exist *in the registry*
    # before the scan has passed -- once the published tag is written there is
    # no taking it back. `type=docker,dest=` avoids importing multiple GiB into
    # the daemon just to hand it to trivy. The image is tagged even though it is
    # not pushed: the tag rides along inside the tarball, so the report records
    # `Metadata.RepoTags` naming the image it describes instead of describing an
    # anonymous tarball nobody can trace back to a release.
    - >-
      docker buildx build --target prod
      --build-arg DATAEVAL_FLOW_VERSION="${DATAEVAL_FLOW_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      -f docker/Dockerfile.${VARIANT}
      -t ${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}
      --output type=docker,dest=prod-${VARIANT}.tar .

    # Vulnerability scan report, written into the build context so the `scanned`
    # stage can copy it into the published image [CS-2-H-3]. JSON is the
    # machine-readable record; the table is what a human opens.
    - mkdir -p docker/security
    - >-
      trivy image --input prod-${VARIANT}.tar --scanners vuln
      --format json --output docker/security/vulnerability-scan.json
    - >-
      trivy image --input prod-${VARIANT}.tar --scanners vuln
      --format table --output docker/security/vulnerability-scan.txt

    # The publishing gate [CS-2-H-2]: exit 1 on any HIGH or CRITICAL finding,
    # before the image reaches the registry. container_scanning re-scans the
    # pushed image afterwards so findings land in GitLab's Vulnerability Report
    # with its dismissal workflow, but that runs too late to stop a push -- this
    # is what actually withholds a dirty image.
    - trivy image --input prod-${VARIANT}.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --quiet

    # SBOM, generated from the same tarball that was scanned and copied into the
    # image beside the report [CS-2-H-4]. Generating it here rather than from the
    # pushed image means one syft run instead of two, and the package list is
    # identical either way: the only thing `scanned` adds to `prod` is the report
    # layer, which installs nothing.
    - syft scan docker-archive:prod-${VARIANT}.tar -o cyclonedx-json=docker/security/sbom.cdx.json
    - cp docker/security/sbom.cdx.json sbom-${VARIANT}.json
    - chmod 0644 docker/security/vulnerability-scan.* docker/security/sbom.cdx.json
    - rm -f prod-${VARIANT}.tar

    # Publish `scanned` -- `prod` plus the report layer. Rebuilt from the local
    # cache the previous build just populated, so this adds one layer, not one
    # build. On the default branch this overwrites :latest-${VARIANT} in place;
    # on a tag it writes :${VERSION}-${VARIANT}, never rewritten.
    - >-
      docker buildx build --target scanned
      --build-arg DATAEVAL_FLOW_VERSION="${DATAEVAL_FLOW_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      -f docker/Dockerfile.${VARIANT}
      -t ${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}
      --push .

    # Sign with cosign (imagetools inspect fetches digest from registry — buildx --push doesn't load locally)
    - printf '%s' "$COSIGN_PRIVATE_KEY_B64" | base64 -d > cosign.key
    - chmod 600 cosign.key
    - DIGEST=$(docker buildx imagetools inspect "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
    - cosign sign --key cosign.key --yes "${CI_APPLICATION_REPOSITORY}@${DIGEST}"

    # Attach the SBOM built above to the registry as a CycloneDX cosign
    # attestation [CS-2-H-4]. The same file is kept as a CI artifact, and
    # release:sbom republishes it on tags with permanent retention.
    - cosign attest --key cosign.key --type cyclonedx --predicate sbom-${VARIANT}.json --yes "${CI_APPLICATION_REPOSITORY}@${DIGEST}"
    - rm -f cosign.key
  artifacts:
    paths:
      - sbom-*.json
    expire_in: 30 days

# Release-branch build check. Builds through the `test` target — which runs
# `nox -s docker_smoke` inside the image — and stops there. Nothing is tagged
# and nothing is pushed, so a release branch costs zero registry storage while
# still proving its own Dockerfiles build, import and run before a tag is cut
# from it. It reads both cache refs but writes neither: a build that is never
# published should not be able to poison the cache a published one uses.
validate:docker:
  extends: .push-setup
  rules: *rules_container_validate
  needs:
    - job: resolve:version
      artifacts: true
  parallel:
    matrix: *variants
  script:
    - echo "Validating dataeval-flow ${DATAEVAL_FLOW_VERSION} (${VARIANT}) — no publish"
    - >-
      docker buildx build --target test
      --build-arg DATAEVAL_FLOW_VERSION="${DATAEVAL_FLOW_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      -f docker/Dockerfile.${VARIANT} .

# Verify cosign signatures + SBOM attestation on pushed images
verify:docker:
  extends: .container-setup
  needs:
    - job: push:docker
    - job: resolve:version
      artifacts: true
  parallel:
    matrix: *variants
  before_script:
    - !reference [.container-setup, before_script]
    - apk add --no-cache cosign
    # DATAEVAL_FLOW_IMAGE_TAG inherited from resolve:version
    - export PUBLISH_TAG="${DATAEVAL_FLOW_PUBLISH_TAG}-${VARIANT}"
  script:
    - docker pull "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}"
    - cosign verify --key docker/cosign.pub "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}"
    # Verify the CycloneDX SBOM attestation [CS-2-H-4]
    - cosign verify-attestation --key docker/cosign.pub --type cyclonedx "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" > /dev/null

    # Smoke test: verify the container actually boots
    - docker run --rm "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" --help

    # The published image must carry its own scan report [CS-2-H-3] and SBOM
    # [CS-2-H-4]. Checked against the running artifact rather than the
    # Dockerfile, because a COPY that silently produced an empty directory
    # still looks correct in source, and an empty JSON file still parses.
    # --entrypoint is overridden because the image entrypoint is the CLI.
    - |
      docker run --rm --entrypoint python "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" -c "
      import json
      base = '/usr/share/dataeval-flow/security/'
      scan = json.load(open(base + 'vulnerability-scan.json'))
      tags = (scan.get('Metadata') or {}).get('RepoTags') or []
      print('scan report: trivy', scan['Trivy']['Version'], '| repoTags', tags)
      assert scan.get('SchemaVersion'), 'scan report has no SchemaVersion'
      assert tags, 'scan report does not name the image it describes'
      sbom = json.load(open(base + 'sbom.cdx.json'))
      comps = sbom.get('components') or []
      print('sbom:', sbom.get('bomFormat'), sbom.get('specVersion'), '|', len(comps), 'components')
      assert sbom.get('bomFormat') == 'CycloneDX', 'in-image SBOM is not CycloneDX'
      assert len(comps) > 50, f'in-image SBOM lists only {len(comps)} components'
      "

# Container vulnerability scan [DSOR-3-H-1, DSOR-3-H-2]
# Uses the GitLab-managed Container-Scanning template (included above) rather
# than a hand-rolled trivy job. Findings flow into the GitLab Vulnerability
# Report; suppressions are managed through that UI (each dismissal must carry
# CVE, justification, and re-evaluation date per SECURITY.md / DSOR-1-H-3).
#
# Overrides on the template:
#   - parallel:matrix per variant so we scan cpu/cu126/cu130 in one stage.
#   - CS_REGISTRY_USER / CS_REGISTRY_PASSWORD point the analyzer at Harbor.
#   - allow_failure: false promotes the scan to a gate (template default is
#     true). HIGH/CRITICAL findings fail the pipeline so dirty images
#     never get a floating tag (:edge-${VARIANT} or :${VARIANT}).
container_scanning:
  stage: publish
  needs:
    - job: push:docker
    - job: resolve:version
      artifacts: true
  # The Container-Scanning template hard-sets `dependencies: []`, which blocks
  # ALL artifact downloads — including resolve:version's dotenv — regardless of
  # `needs: artifacts: true`. Override it so DATAEVAL_FLOW_IMAGE_TAG is actually
  # fetched; without this the image tag resolves empty (`dataeval-flow:-cpu`).
  dependencies: ["resolve:version"]
  parallel:
    matrix: *variants
  variables:
    # Pin the analyzer to the floating v8 major so Trivy and its advisory DB
    # track the latest release instead of whatever the instance template
    # defaults to (which lagged a Trivy minor and emitted deprecation warnings).
    CS_ANALYZER_IMAGE: "$CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning:8"
    CS_SEVERITY_THRESHOLD: HIGH
    CS_REGISTRY_PASSWORD: $HARBOR_TOKEN
    # Check out the repo (template default is no clone) and point auto-remediation
    # at the per-variant Dockerfile so it stops warning that it can't find one.
    GIT_STRATEGY: fetch
    CS_DOCKERFILE_PATH: "docker/Dockerfile.${VARIANT}"
  before_script:
    # DATAEVAL_FLOW_PUBLISH_TAG comes from resolve:version's dotenv. dotenv vars
    # are injected into the job environment at runtime but are NOT expanded
    # inside the `variables:` keyword — declaring CS_IMAGE there yields an empty
    # tag (`dataeval-flow:-cpu`) and the scan aborts with image-not-found. Assemble it
    # here, where the dotenv var is present (same as push:docker does in script).
    - export CS_IMAGE="${CI_APPLICATION_REPOSITORY}:${DATAEVAL_FLOW_PUBLISH_TAG}-${VARIANT}"
    # Exported here rather than declared under `variables:`, for the same reason
    # the docker login spells the name inline: GitLab expands variable values, so
    # the `$aria` in `robot$aria+aria-bot` resolves to nothing and the analyzer
    # would authenticate as `robot+aria-bot`. These single quotes are the
    # shell's, so the `$` survives.
    - export CS_REGISTRY_USER='robot$aria+aria-bot'
    - echo "Scanning ${CS_IMAGE} as ${CS_REGISTRY_USER}"
  allow_failure: false
  rules: *rules_container_publish

# -----------------------------------------------------------------------------
# Security Stage [DSOR-1 to DSOR-5]
# -----------------------------------------------------------------------------

# NOTE: Security template jobs use `extends:` internally — do not override with
# `extends:` here or the template's analyzer inheritance chain will break.

# SAST - Static Application Security Testing [DSOR-1-H-1, DSOR-1-H-2]
semgrep-sast:
  stage: security
  variables:
    SAST_EXCLUDED_ANALYZERS: "eslint,gosec,kubesec,nodejs-scan,phpcs-security-audit,pmd-apex,security-code-scan,sobelow,spotbugs"
    SAST_EXCLUDED_PATHS: "config, docker, docs, output, tests"
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Dependency Scanning [DSOR-2-H-1, DSOR-2-H-2]
gemnasium-python-dependency_scanning:
  stage: security
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Secret Detection [DSOR-4-H-1, DSOR-4-H-2]
secret_detection:
  stage: security
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# SBOM Export [DSOR-5-H-1]
sbom:
  extends: .rules_main_mr
  stage: security
  # Override entrypoint so GitLab can use shell instead of running syft immediately
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - unset DOCKER_AUTH_CONFIG
    - /usr/local/bin/syft dir:. -o cyclonedx-json=sbom.json
  artifacts:
    paths:
      - sbom.json
    expire_in: 1 week

# -----------------------------------------------------------------------------
# Release Stage
# -----------------------------------------------------------------------------

# Point :latest-${VARIANT} at this release, if it is the newest one.
#
# A server-side retag via `imagetools create` — no pull, no rebuild, no new
# storage. The digest is already cosign-signed and carries its own scan report
# and SBOM attestation, so every guarantee follows the pointer.
#
# Gated on the scan: `needs` includes container_scanning, so a release that
# fails its scan can never take the pointer users pull by default.
promote:latest:
  extends: .push-setup
  stage: release
  needs: [push:docker, verify:docker, container_scanning, "resolve:version"]
  parallel:
    matrix: *variants
  variables:
    # Full tag history: promote-latest.sh ranks this release against every
    # other one to decide whether it may hold the pointer.
    GIT_DEPTH: "0"
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  script:
    - git fetch --tags --quiet
    - PROMOTE=$(git tag -l 'v*' | ./docker/promote-latest.sh)
    - |
      if [ -z "$PROMOTE" ]; then
        echo "${CI_COMMIT_TAG} is not the highest stable release; :latest-${VARIANT} left where it is."
        exit 0
      fi
    - echo "Promoting ${DATAEVAL_FLOW_PUBLISH_TAG}-${VARIANT} → latest-${VARIANT}"
    - >-
      docker buildx imagetools create
      -t ${CI_APPLICATION_REPOSITORY}:latest-${VARIANT}
      ${CI_APPLICATION_REPOSITORY}:${DATAEVAL_FLOW_PUBLISH_TAG}-${VARIANT}

# Per-version SBOM release artifact [CS-2-H-4]
# Downloads the CycloneDX cosign attestation written by push:docker (digest-
# addressed, so it is found by digest rather than by tag) and
# republishes it as a versioned release artifact with permanent retention.
# Tag-only — main pipelines already retain the 30-day artifact from push:docker.
release:sbom:
  extends: .push-setup
  stage: release
  needs: [push:docker, verify:docker, container_scanning, "resolve:version"]
  parallel:
    matrix: *variants
  rules:
    - *skip_publish_verification
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  script:
    # DATAEVAL_FLOW_VERSION / DATAEVAL_FLOW_IMAGE_TAG inherited from resolve:version
    - PUBLISH_TAG="${DATAEVAL_FLOW_PUBLISH_TAG}-${VARIANT}"
    - DIGEST=$(docker buildx imagetools inspect "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
    - cosign download attestation --predicate-type https://cyclonedx.org/bom "${CI_APPLICATION_REPOSITORY}@${DIGEST}"
        | jq -r '.payload' | base64 -d | jq '.predicate' > sbom-${DATAEVAL_FLOW_VERSION}-${VARIANT}.json
  artifacts:
    paths:
      - sbom-*.json
    expire_in: never

# -----------------------------------------------------------------------------
# Verification Artifacts [TR-6, DR-3.3]
# Publish the generated test cases + VCRM to the JATIC meta repo.
# -----------------------------------------------------------------------------

# Reruns the verification suite, regenerates output/metarepo/ from the fresh
# report, and commits it to the meta repo project under the directory declared
# in verification/registry.yaml (project 409, DataEval-Flow/).
#
# Triggers:
#   - tag pipelines (v*) — every release republishes the VCRM
#   - a web pipeline with PUBLISH_VERIFICATION set — republish on demand without
#     rebuilding anything; every other job opts out via .skip_publish_verification
#
# That directory also holds hand-maintained requirement docs (the FR-*.md files
# the VCRM links to). push_verification.py only creates/updates the files it
# generates and never deletes, so the manual content already there is safe.
# Set VERIFICATION_PUSH_ARGS on the trigger to change that:
#   --dry-run   print the commit plan and exit without writing
#   --prune     also delete stale test-case-*.md files dropped from registry.yaml
#
# Requires the group-level DATAEVAL_BUILD_PAT variable (same token as the docs
# cache push) with api scope on the meta repo.
publish:verification:
  extends: [.nox]
  stage: release
  needs: []
  rules:
    - if: $PUBLISH_VERIFICATION
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  variables:
    VERIFICATION_PUSH_ARGS: ""
  before_script:
    - !reference [.nox, before_script]
    - uv pip install --system requests pyyaml
  script:
    # TC-19.1 (NFR-6) attests the 90% coverage threshold by reading the coverage
    # report. A tag pipeline runs no `test` job -- only the publish and release
    # stages -- so there is nothing to inherit the report from, and the check
    # skipped on every release, publishing a VCRM that could not evidence NFR-6.
    # Measuring here rather than inheriting also means the number attested is the
    # release's own. One interpreter (the global PYTHON_VERSION), not the matrix.
    - uvx --with nox-uv nox -s test
    - uvx --with nox-uv nox -s verify
    - python3 .gitlab/scripts/push_verification.py $VERIFICATION_PUSH_ARGS
  artifacts:
    # always: keep the generated artifacts even if the push is rejected, so the
    # commit can be inspected or replayed.
    when: always
    paths:
      - output/metarepo/
    expire_in: 1 week
