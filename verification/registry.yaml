requirements:
- id: FR-1
  name: Installation & Optional Extras
  description: A user shall be able to install DataEval Flow and run the `dataeval-flow` command, and each optional extra
    shall add its capability without conflicting with the others.
  criteria:
  - '`pip install dataeval-flow` installs the package and puts the `dataeval-flow` console script on `PATH`; `python -m dataeval_flow`
    runs the same command and reports the same version, including in the container, where the script is not on the command
    line.'
  - The package declares ten optional extras (`cpu`, `cu126`, `cu130`, `onnx`, `onnx-cu126`, `onnx-cu130`, `opencv`, `app`,
    `service`, `ontology`), each adding the packages the documentation names; the three PyTorch extras are declared mutually
    exclusive, and so are the three ONNX extras.
  - The `cpu` extra installs without dependency conflicts under pip and conda, the lock file resolves for every extra, and
    with the lowest supported dependency versions the unit tests that need no optional extra pass.
  - 'A command that needs an extra that is not installed exits with code 1 and names the extra to install: `serve` for `service`,
    `app` for `app`, and reading an ontology file for `ontology`.'
- id: FR-2
  name: Configuration Loading
  description: DataEval Flow shall load a pipeline configuration from a YAML or JSON file, or from a folder of them, validate
    it into a typed `PipelineConfig`, and resolve the paths it holds against a data root.
  criteria:
  - '`load_config(path)` reads a YAML or JSON file into a validated `PipelineConfig`, and raises `FileNotFoundError` for a
    file that does not exist.'
  - '`load_config(folder)` merges the folder''s pipeline files in name order (mappings merge, lists extend, a later scalar
    replaces an earlier one), skips files that are not pipeline configurations, and names the file when one holds a misspelled
    section.'
  - An invalid configuration raises `pydantic.ValidationError` locating the offending field; a misspelled top-level key names
    the section it resembles, and a name used twice in one section is refused.
  - '`PipelineConfig.model_json_schema()` describes the configuration, with one branch for each installed workflow, evaluator
    and extractor, and the checked-in `config/params.schema.json` matches it for the built-in types.'
  - Relative dataset paths resolve against the data root (the one given, else `DATAEVAL_DATA`, else the working directory),
    a dataset not found there is looked up in the root's `data` folder, and a path in a configuration must be relative and
    stay under the root.
  - A configuration written back with `model_dump_json()` loads again as an equal `PipelineConfig`.
- id: FR-3
  name: Dataset Loading
  description: DataEval Flow shall give each task a MAITE-compatible dataset, read from image-folder, Hugging Face, COCO or
    YOLO files, from a tutorial dataset, from an object the user built, or from the merge of other sources.
  criteria:
  - Each `datasets:` entry is validated as the format its `format` key names (`image_folder`, `huggingface`, `coco`, `yolo`
    or `demo`); a setting of another format, an unknown format, and a path outside the data root are refused, and every config
    writes back to an equal config.
  - '`load_dataset()` reads image-folder (labelled by sub-folder or not), Hugging Face (classification and detection), COCO
    and YOLO data and returns an object that satisfies `dataeval.protocols.AnnotatedDataset`; a location that yields no items,
    a missing image folder and an unsupported format are refused with a message that says what to check.'
  - A `DatasetProtocolConfig` hands the pipeline the dataset object a user built, unchanged; a torchvision dataset is adapted
    to MAITE (CHW float images, one-hot labels, boxes as corners).
  - A `demo` dataset is built from a fixed table of tutorial datasets, and any other name is refused before anything is imported.
  - '`value_range`, `channel_groups` and `provenance` describe a dataset: a stats policy measures each channel group as `<group>_<statistic>`
    columns, an invalid group is refused, and `provenance` is recorded in each result''s `resolved_config` without changing
    the dataset''s cache identity.'
  - A source with `merge:` concatenates its operand sources in order, each read through its own view; it re-keys each datum's
    id as `<position>:<id>`, refuses operands that number classes differently, a merge that contains itself and nesting deeper
    than eight levels, and applies its own view after the merge.
  - '`load_source()` loads a configured source as a run reads it, and refuses a view that would draw different items on each
    load.'
- id: FR-4
  name: Feature Extractor Configuration
  description: DataEval Flow shall build each supported feature extractor from a validated `extractors:` entry and use it
    to produce one embedding for each image.
  criteria:
  - The Flatten, Torch, ONNX, bag-of-visual-words and uncertainty extractors are each configured by an entry whose `model`
    names the extractor; an entry validates its own settings, refuses the settings of another extractor and an unknown `model`,
    takes its `model` as its name when it has none, and writes back to an equal entry.
  - The extractor configs are exported from `dataeval_flow.config.extractors`, and `list_extractors()` and `get_extractor()`
    list and find the installed extractors.
  - 'An extractor built from its config returns one embedding row for each image it is given: Flatten, a Torch model''s named
    layer, an ONNX model''s named output (with the configured input size), and bag-of-visual-words.'
  - A task embeds with the extractor it names, in batches of the entry's `batch_size`, after the entry's preprocessor; an
    ONNX model is found in the data root's `models` folder, and a missing batch size or model file fails the task with a message.
  - The uncertainty extractor reads an ONNX classifier's predictions, so a drift evaluator detects a change in the model's
    uncertainty, and a task whose evaluator needs one row for each item is refused when the configuration loads.
  - An extractor from an installed plug-in package is listed, validated and run like a built-in one; a plug-in that fails
    to load is left out with the reason, and a plug-in cannot take a built-in's name.
- id: FR-5
  name: Preprocessing & Dataset Views
  description: DataEval Flow shall apply configured preprocessing steps to the images an extractor embeds, and configured
    view operations to the datasets a source reads, in the order written and with the same result for the same configuration.
  criteria:
  - A `PreprocessorConfig` holds an ordered list of `{step, params}` transforms, an extractor names it with `preprocessor`,
    and the steps are applied in the order listed to each image.
  - A step names a `torchvision.transforms.v2` transform or a registered one; a parameter that cannot be built and an unknown
    transform are refused with the choices, and the same steps give the same output and the same identity string the embedding
    cache keys on.
  - '`ToRGB` is a registered transform that gives every image three channels; a transform from an installed plug-in package
    runs as a step with its parameters as written, cannot take a torchvision or built-in name, and raises its load failure
    when a step names it.'
  - 'A `ViewConfig` stacks `ViewOperation` entries (a `type` from `dataeval.data` and its `params`) that apply in the order
    listed: `Limit` reduces the dataset to the size asked for, and a filter before a limit selects differently from a filter
    after it.'
  - '`indices` takes a `{start, stop, step}` range as well as a list, list parameters are accepted where DataEval needs a
    tuple, and an operation DataEval does not have is refused.'
  - The view a source names is applied to the dataset its task reads, and the result records it.
  - A view with a seeded `Shuffle`, or a pipeline with a `seed`, reads the same items on every run.
- id: FR-6
  name: Workflow Orchestration
  description: DataEval Flow shall discover the installed workflows and evaluators, check each configured task against what
    its workflow or evaluator consumes when the configuration loads, and run the selected tasks in order, recording a task
    that fails without stopping the others.
  criteria:
  - '`list_workflows()` returns the nine built-in workflows (`audit`, `bias`, `prioritization`, `quality`, `scope`, `shift`,
    `splits`, `taxonomy`, `triage`) and `list_evaluators()` the 26 built-in evaluators, by name and description; `get_workflow()`
    and `get_evaluator()` return the class or raise `ValueError` listing the installed names; the `workflows` and `evaluators`
    commands list the same.'
  - Each `workflows:` and `evaluators:` entry is validated with the config class its `type` names, and each workflow and evaluator
    declares its inputs and its result class.
  - A task names a workflow with `workflow:` or an evaluator with `evaluator:` (exactly one), and a pipeline of both kinds
    writes back to an equal pipeline.
  - When the configuration loads, a task is refused if it names a workflow or evaluator that is not defined, names the wrong
    number of sources, lacks an extractor its workflow needs, or names one it does not use; `run_task` and `run` make the
    same checks on a task or data that load did not see.
  - '`run_tasks()` runs the enabled tasks in configuration order and returns a `Result` for each, keyed by task name, with
    the metadata envelope; a workflow returns a `ChainResult` and an evaluator its own result class.'
  - A task selection by name runs the named tasks in the order given, once each, and runs a disabled task when it is named;
    `run_task()` runs one task, including one the configuration does not hold.
  - '`on_result` is called with each task''s name and result as the task finishes and before the next starts, so what finished
    is kept when a later task cannot be set up.'
  - A workflow or evaluator that raises gives a failed result (`success` false, the error in `errors`, `output` refusing to
    be read) and the remaining tasks still run; a pipeline that names a source or extractor it does not define raises `ValueError`
    naming the ones it does.
  - '`run(config, data)` runs one workflow or evaluator on datasets already in memory and returns the config''s result class.'
  - Workflows and evaluators from an installed plug-in package are listed, validated and run like built-in ones; a plug-in
    that fails to load, takes a built-in's name, shares a name with another plug-in, or is not a valid workflow is left out
    with the reason.
- id: FR-7
  name: Dataset Quality
  description: DataEval Flow shall find outliers, duplicates, class-balance problems and unreadable metadata in a single dataset
    with the `quality`, `bias` and `triage` presets, and shall produce the dataset without its flagged images and duplicates.
  criteria:
  - '`quality` finds image outliers (and, on object-detection data, box outliers) and exact and near duplicate images, and
    reports them as the findings Image Outliers, Target Outliers, Class Outliers and Image Duplicates.'
  - Each `quality` finding warns when the share it measures passes its threshold under `checks:`; a threshold set to `null`
    leaves the finding informational.
  - '`quality` hands on `clean`, the dataset without every flagged image or box and without all but the first image of each
    duplicate group, and records how many items it removed and which analysis named them. On detection data it removes boxes,
    not images.'
  - '`quality` refuses, when the configuration loads, an entry without outlier settings, an unknown or removed setting, and
    cluster-based outlier detection without an extractor.'
  - '`bias` judges class balance, shortcut risk (mutual information between a metadata factor and the class), factor association
    (Cramér''s V) and under-represented class-factor combinations from labels and metadata alone, with no extractor, and names
    the factors responsible.'
  - '`bias` warns where a threshold under `checks:` is passed: the ratio of the largest class to the smallest, a declared
    class with no labels (unless `empty` is false), shortcut risk, factor association and the number of gaps. `factor-gaps:
    false` leaves out the gap analysis and its check.'
  - On data with no metadata factors, `bias` still judges class balance and reports its factor findings as not assessed.
  - '`triage` reports metadata factors that cannot be read (a column that mixes numbers and text, marker values in a numeric
    column) and continuous factors and vocabularies whose bins or levels nobody pinned, locates the values that fail, and
    suggests a `metadata:` policy that repairs them.'
  - '`triage` checks its suggestion by reading the metadata again (unless `verify: false`) and recommends a policy that also
    pins the cuts and levels read from the data, with a caution that a policy read from one sample can mislead.'
  - A `metadata:` policy built from triage's suggestion or recommendation, named by the next run, makes the factors readable.
    Data with no metadata gives no findings.
- id: FR-8
  name: Data Scope
  description: 'DataEval Flow shall assess how fully a dataset covers its intended scope with the `scope` and `taxonomy` presets:
    embedding-space coverage and completeness, class counts against expected shares, and labels against a declared ontology.'
  criteria:
  - 'With an extractor, `scope` reports Class Coverage (uncovered items, and per class the dispersion and near-duplicate share),
    Dimensional Completeness and Class Shortfall; `completeness: false` leaves out completeness, and `coverage: {method: naive}`
    adds an Uncovered Items check.'
  - Without an extractor, `scope` reports its embedding findings as not assessed, and still judges Class Shortfall from the
    labels.
  - Class Shortfall lists each class short of an even spread, or of the share `representation.expected` gives it, with its
    count, target and deficit, and says whether to acquire (none collected) or augment.
  - Class Coverage warns on a class whose images barely vary (`clustered`), and the thresholds under `checks:` decide whether
    Dimensional Completeness warns.
  - On object-detection data, `scope` crops each detection (`wrap` with `padding` and `min_size`), counts the detections it
    drops, and measures coverage on the crops.
  - '`scope` refuses `ontology:` and points to `taxonomy`.'
  - '`taxonomy` judges a dataset''s labels against a declared ontology (an inline mapping, an RDF file under the data root,
    or an `ontologies:` entry with `concepts:` and synonyms): Leaf Coverage with a worklist of leaves to collect, Label Conformance,
    Label Mergeability and Ontology Structure.'
  - A class name the ontology does not contain is a Label Conformance warning and makes the alignment partial; thresholds
    under `checks:` and the `expected` shares change the verdicts.
  - '`taxonomy` records the label space digest of its alignment, and a source conformed with the alignment''s `Relabel` stanza
    carries the same digest and conforms.'
  - '`taxonomy` requires an ontology, and an ontology that cannot be read fails the task with a message naming it.'
- id: FR-9
  name: Distribution Shift
  description: DataEval Flow shall test whether incoming data has drifted from a reference and which of its images are out
    of distribution with the `shift` preset, using drift detectors, out-of-distribution detectors and a model-uncertainty
    extractor.
  criteria:
  - '`shift` takes the first source as the reference and tests every other source against it with every detector in `detectors:`,
    giving one finding per detector and test source; with no `detectors:` it runs `drift-univariate` and `ood-kneighbors`.'
  - A test source drawn like the reference is not reported as drifted, and one with a clear difference is, by the univariate,
    MMD and K-neighbors drift detectors; the domain classifier tells the clearly different source apart with an AUROC of 1.0.
  - 'A drift detector with `chunking` gives a verdict per chunk, and its check warns when more than `chunk_percent` of the
    chunks drift or more than `consecutive_chunks` in a row do; `warn_on_drift: false` reports drift without a warning.'
  - '`classwise` also runs a drift detector once per class (or named group of classes), leaves out classes with fewer than
    `min_items` items and says why, and rolls the verdicts into one finding; it refuses an out-of-distribution or unknown
    detector.'
  - An out-of-distribution detector gives every test image an `instance_score` and an `is_ood` flag, and its check reports
    the share flagged; the distance metric decides what counts as different.
  - With two or more out-of-distribution detectors, `shift` reports which images all of them flagged and which only one did;
    `factor-predictors` ranks the metadata factors and image statistics by how well they separate the flagged images, and
    `factor-deviation` says how far each agreed image sits from the reference on each factor. Both can be left out.
  - The `uncertainty` extractor turns an ONNX classifier's predictions into a normalized-entropy column, so a drift detector
    tests whether the model is less sure of incoming data; a detector may name its own extractor, `classwise` may key by the
    class the model predicts, and an evaluator that needs one embedding per item refuses the extractor.
- id: FR-10
  name: Splitting & Prioritization
  description: DataEval Flow shall partition a dataset into train, validation and test sets or k folds, judge how well each
    part keeps the class proportions of the whole, and rank pools of unlabeled data against a reference for labeling, with
    the `splits` and `prioritization` presets.
  criteria:
  - '`splits` divides a dataset into disjoint `train`, `val` and `test` parts that together hold every item; the same settings
    give the same split, and `test_frac`, `val_frac` and `stratify` change it.'
  - '`splits` judges each part''s class shares against the whole in percentage points, warns past the thresholds under `checks:`,
    and shows a stratified split deviating less than an unstratified one.'
  - With `folds` of 2 or more it makes that many train and validation sets and one shared test set, and judges each fold.
  - '`split_on` keeps every value of a metadata factor, such as a scene, in one part; `rebalance` rebalances the class counts
    of each train set.'
  - '`splits` refuses, when the configuration loads, a split that holds nothing out, `val_frac` with `folds`, and fewer than
    one fold; too few items to stratify fails the split step.'
  - A custom workflow reads a `splits` step's parts as `<step>.train`, `<step>.val` and `<step>.test`.
  - '`prioritization` ranks each pool against the first source (the reference) by embedding distance: `hard_first` puts the
    items least like the reference first, `easy_first` the reverse, and each pool is ranked on its own.'
  - '`selected` keeps each pool''s items in ranked order, all of them or the top `n`, or the top `fraction` rounded up; `n`
    and `fraction` together are refused.'
  - Other ranking methods and policies run, and an unsupported method, policy or order is refused when the configuration loads;
    a task needs a reference, a pool and an extractor.
  - Run after a `quality` step in a custom workflow, `prioritization` ranks only the cleaned data.
- id: FR-11
  name: Task Matrices
  description: DataEval Flow shall run a task once per combination of the values listed under its `matrix:` and return one
    result that compares the runs, replacing the `parameter-sweep` workflow.
  criteria:
  - '`matrix:` on a task runs its workflow or evaluator once per value in a list, per value of a `{from, to, step}` range,
    per combination of the keys of one grid (the last key changing fastest), or per run of several grids, in order, and returns
    one `MatrixResult` of `MatrixRun`s whose results are what each run would return alone.'
  - A key can vary a setting at any depth (including hyphenated check names and list items picked by name), an entry's checks
    and thresholds, or the task's `sources` and `extractor`; a matrix also works on an evaluator task.
  - A matrix that cannot run (a value the setting refuses, two runs with the same settings, a bare value, an unknown setting
    or source, a key that varies identity, overlapping keys) is refused when the configuration loads, naming the cause.
  - A matrix in a YAML file is read by `load_config`, with ranges.
  - The report opens with a table of every run's findings and its health; the JSON holds each run's number, label, values
    and result under `runs`.
  - 'A run that fails is kept: the matrix fails and lists the error, the runs after it still run, and so do later tasks.'
  - Every run reads one draw of each source, and an `export` step writes each run under its own `run-<n>` directory.
  - '`type: parameter-sweep` fails the configuration load as an unknown workflow.'
- id: FR-12
  name: Reporting & Export
  description: DataEval Flow shall give every task's result a text report, a JSON or YAML export and health values a script
    can gate on, and shall write a run's results from the command line as JSON, text, HTML, JUnit and Markdown files.
  criteria:
  - '`report()` returns a multi-line text report with a banner, the run''s provenance, a summary with a health line, the evidence
    for each finding, a table of steps and the configuration; `report(detailed=False)` returns the shorter summary form.'
  - '`report(width=N)` draws the report `N` characters wide (80 by default), and a width below 40 raises `ValueError`. On
    the command line, `result: width`, `--report-width` and `DATAEVAL_REPORT_WIDTH` set it, the flag over the variable over
    the config, and a width below 40 is refused before any task runs.'
  - '`export(path, fmt)` writes JSON or YAML and returns the path (a directory receives `results.<ext>`), and `export()` returns
    the serialized string. `to_dict()` holds `kind` and `metadata`, then `health`, `steps` and `findings` for a workflow or
    `output` for an evaluator, and is strict JSON.'
  - '`health`, `warning_count` and `findings` are available on a workflow result: `health` gives a status of `ok`, `warning`
    or `failed`, the number of warnings and findings, and the names of the failed steps.'
  - A workflow with a failed step still reports: its report and its `health` say `failed` and name the step and its error.
  - 'The `dataeval-flow` command writes a run''s results to `<output>/results/` in the formats `result: formats` lists (`json`,
    `text`, `html`, `junit`, `markdown`; the first three by default), with the extensions `.json`, `.txt`, `.html`, `.xml`
    and `.md`, named by `result: name`, and with `per_task: true` as one set of files per task.'
  - '`result: detail` (`full` or `summary`) sets how much the text and HTML files hold, and the JSON always holds everything.
    The console prints the summary, or the full report with `-v`.'
  - A failed workflow's partial result is written to the JSON, text and HTML files, the JUnit and Markdown files name the
    failed task, and the tasks after it still run.
  - '`result: max_rows` limits the rows a table of items lists and says where the rest is, `result: preview_rows` limits the
    rows the text report shows and counts the rest, `-1` removes either limit, and the JSON keeps every row.'
  - '`result: max_images`, `--report-images` and `DATAEVAL_REPORT_IMAGES` set how many thumbnails of the items a report names
    the result keeps and the HTML report shows. The HTML report is one self-contained page that loads nothing from a URL.'
  - 'A `result:` value the command cannot honour, such as an unknown format, a width below 40, `max_rows: 0` or an unknown
    key, fails the config load.'
  - '`result: fail_on` sets what makes the exit code non-zero: `failure` (the default) a failed task or export, `warning`
    also a finding past its health threshold (exit 3), and `never` neither. The results are written whichever applies.'
  - '`result: require` and `--require` make the command exit 4 when a task''s verdict is worse than the level they name. The
    exit holds under `fail_on: never`, outranks the warning gate, and a run in which no task gives a verdict is refused.'
- id: FR-13
  name: Result Metadata Envelope
  description: DataEval Flow shall attach a metadata envelope to every result that records the tool, library versions, device,
    configuration, datasets, label space and timing of the run, and shall keep it on a result that failed (IR-3-S-12).
  criteria:
  - '`metadata` carries the envelope `version`, a UTC `timestamp` that falls within the run, `tool` (`dataeval-flow`), `tool_version`
    (`dataeval_flow.__version__`) and a positive `execution_time_s`.'
  - '`metadata.device` names the device the run computed on, and `metadata.library_versions` records the installed version
    of DataEval, NumPy, Pillow and the other libraries the run''s numbers depend on.'
  - '`metadata.dataset_id` (comma-joined for several sources), `source_descriptions`, `model_id` and `label_source` name the
    datasets, views, extractor and origin of the labels the run read.'
  - '`metadata.resolved_config` holds the configuration the run used: its sources with their datasets, the workflow or evaluator
    entry, the extractor and the seed.'
  - A source whose view relabels its classes is recorded in `metadata.label_space` with its class mapping, target vocabulary
    and digest, and `label_space_digest` names the vocabulary; a run that relabelled nothing records none.
  - '`metadata.metadata_binning` and `encoding_digest` record how metadata factors were encoded, and `diagnostics` lists the
    library diagnostics raised during the run.'
  - '`to_dict()` and `export()` write the whole envelope under `metadata`, and `kind` says whether the result is a workflow''s
    or an evaluator''s.'
  - 'A result that failed, because a step failed or because the task was refused before it ran, keeps the envelope and lists
    its errors: `success` is false, `output` raises `RuntimeError`, `to_dict()` holds `errors`, and a failed workflow''s health
    status is `failed`.'
  origin: IR-3-S-12
  origin_link: https://jatic.pages.jatic.net/internal-docs/standards/product/software/interoperability/#ir-3-model-and-data-interoperability
- id: FR-14
  name: Caching
  description: DataEval Flow shall cache embeddings, cluster results, metadata and image statistics under a key built from
    the dataset, view and settings that produced them, so that a repeated run reuses earlier work without mixing up datasets
    or views.
  criteria:
  - With a cache directory (`cache_dir`, `--cache` or `DATAEVAL_CACHE`, the flag over the variable) Flow creates the directory
    on first use and stores embeddings (`.npy`), cluster results (`.npz`), metadata (`.dem` and `.json`) and statistics (`.parquet`
    and `.json`) under `v<version>/<dataset>/sel_<view>/`, each file written whole.
  - An unchanged re-run reads the stored entries, writes nothing and returns the same output.
  - An entry is keyed by the dataset's content, the view, the extractor's settings and, for metadata, the encoding policy.
    Changing any of them makes a new entry and leaves the old ones as they were, and the entries of different datasets or
    views are never served to each other.
  - 'Statistics accumulate: a run that needs more statistics adds the missing ones to the stored entry and keeps those already
    there.'
  - A key that was never stored is a miss, which returns `None` and stores nothing. An entry that cannot be read is recomputed
    with a warning and replaced, and does not fail the run.
  - Without a cache directory the cache is in memory, so nothing is written to disk and a later run in the same process reuses
    what an earlier one computed.
  - A dataset name that would leave the cache directory is refused, and entries written under another cache version are ignored
    and not deleted.
- id: FR-15
  name: Command-Line Interface
  description: DataEval Flow shall run pipelines headlessly from the command line, configured by flags or `DATAEVAL_*` environment
    variables, report the outcome in its exit code, and answer `--version`, `--help` and discovery subcommands.
  criteria:
  - '`python -m dataeval_flow` and `dataeval-flow` run the headless pipeline with `--config`, `--data`, `--output`, `--cache`,
    `--task`, `--max-processes`, `--fail-on-warning`, `--require`, `--log-format`, `--report-width`, `--report-images` and
    `-v`, and `--version` prints the installed version.'
  - Each operational option has a `DATAEVAL_*` variable (`CONFIG`, `DATA`, `OUTPUT`, `CACHE`, `LOG_FORMAT`, `REPORT_WIDTH`,
    `REPORT_IMAGES`, `FAIL_ON_WARNING`, `REQUIRE` and `MAX_PROCESSES`, and `TASKS` and `VERBOSITY` beside them), `--help`
    names the first ten, and a flag takes precedence over its variable.
  - A relative config path resolves against the data root. With no config the data root is searched for one, and with no data
    root the current directory is used.
  - A malformed variable exits 1, names the variable, prints no traceback, and stops before anything runs.
  - '`--task` runs only the tasks it names, in the order given, a task named twice once, and a task the config disables if
    it is named. `DATAEVAL_TASKS` lists them, and an unknown name exits 1 and lists the tasks that exist.'
  - '`--log-format` sets the console format to `structured` (an ISO-8601 UTC timestamp and the level, the default) or `plain`,
    and the log file keeps its own format. The console prints the summary, `-v` the full report, `-vv` INFO messages and `-vvv`
    DEBUG messages.'
  - 'The exit code is 0 when every task succeeded (warnings included), 1 for a failed task or export, an unreadable config
    or data root, or a malformed variable, 2 for a mistyped command line, 3 for a warning under `--fail-on-warning` or `fail_on:
    warning`, and 4 for a verdict worse than `--require`. When more than one applies, 1 comes first, then 4, then 3.'
  - '`workflows`, `evaluators`, `steps`, `encoding`, `config`, `app`, `verify` and `serve` each answer `--help` with exit
    code 0. `workflows`, `evaluators` and `steps` list what is installed as a table or JSON, print the settings schema of
    a named entry, and exit 1 for an unknown name.'
- id: FR-16
  name: Container Execution
  description: DataEval Flow shall run the headless pipeline from CPU and CUDA container images against bind-mounted data,
    cache, and output directories, and shall run the analysis service from the same images (IR-2, CS-1, CS-2).
  criteria:
  - The CPU, `cu126`, and `cu130` Dockerfiles are generated from one template and one variants file (rendering the template
    again gives the committed files), install the extras the variants file lists, and end as a non-root user; the CPU image
    is built for `linux/amd64`.
  - Mounting data at `/dataeval`, output at `/output`, and optionally a cache at `/cache` is enough to run; an output directory
    that is not mounted, or a data mount that is empty, is reported with exit code 1, and an unmounted cache falls back to
    in-memory.
  - The container honors the `DATAEVAL_*` environment variables (for example `DATAEVAL_DATA`, `DATAEVAL_TASKS`, `DATAEVAL_LOG_FORMAT`,
    `DATAEVAL_MAX_PROCESSES`), and a command-line argument takes precedence over its variable.
  - '`--help` or a run with no data prints a usage banner that covers mounts, environment variables, options, commands, and
    secret handling. The options, variables, and commands that the banner and the container reference page list exist in the
    command line and the code.'
  - The image build declares no variable with a secret-like name, and the usage banner states that no secrets are needed.
  - A CUDA image started without GPU access exits with code 1 and a message that names `--gpus all` and the `cpu` variant.
  - Run with `serve`, the container listens on port 8001, answers `/healthz`, `/readyz`, and `/livez` with 200 while the service
    takes work, and describes its API at `/openapi.json`.
- id: FR-17
  name: MAITE Interoperability
  description: DataEval Flow shall interoperate with MAITE through declared entry points and MAITE-protocol datasets (IR-1).
  criteria:
  - The package declares MAITE entry points for image classification and object detection `Dataset` components and for two
    tasks, `run_tasks` and `load_dataset`; each resolves to an importable target, and the task entry points are Flow's public
    functions.
  - Datasets that Flow loads (HuggingFace-layout image classification, ImageFolder, COCO, YOLO) satisfy the MAITE image classification
    or object detection `Dataset` protocol at run time, and a MAITE dataset can be passed to a Flow evaluator.
  notes_title: Known Limitation (informative; not acceptance criteria)
  notes:
  - The advertised dataset components are `datamaite` classes. Static verification of them against the MAITE protocols with
    `pyright` and MAITE's `statically_verify_exposed_component_entrypoints` reports errors (the `metadata` property and `__getitem__`
    signatures), so conformance is shown at run time only.
- id: FR-18
  name: Pre-Training Audit
  description: DataEval Flow shall audit one or more dataset splits before training and give a verdict on whether the data
    is ready to train on, a record of what was audited, and findings under five questions.
  criteria:
  - The `audit` workflow type reads a train split and any number of evaluation splits, and gives a verdict of `not-ready`,
    `ready-with-caveats` or `ready`. It is `not-ready` when a blocking check warned and no acceptance covers that warning,
    `ready-with-caveats` when any other check warned, an accepted check warned, or a check was not assessed, and `ready` when
    no check warned and every check was assessed.
  - A check that cannot run is listed as not assessed with its reason, such as a missing extractor, no metadata factors or
    no evaluation split. A blocking check that could not run is a caveat and does not block. A task that fails has no verdict.
  - The report gives the verdict, then a record of what was audited, then the findings under five questions (is the data clean,
    are the labels sound, does the data cover what the model must handle, could the model learn a shortcut, are the splits
    fit to evaluate on), then the next steps.
  - The record gives each split's items, labels, classes, metadata factors and the SHA-256 digests of its content and metadata,
    the settings every check was judged by, and the blocking checks. Every split's metadata factors are encoded like train's.
  - '`blocking:` names the checks whose unaccepted warning makes the verdict not ready; the default is `leakage` and `untrained-classes`.
    A name that is not a check the chain runs is refused when the config loads.'
  - '`accepted:` gives a reason for a warning, by check type, by check step, or by `step[split]` for one evaluation split.
    An accepted warning cannot make the audit not ready, but it leaves the audit ready with caveats and stays in the findings
    and in the health count. A key that names no check or check step, a blank reason, and a `[split]` on a step that runs
    once are refused when the config loads, and a `[split]` the task does not have is refused before any step runs.'
  - '`audit` runs as a step of a custom workflow on splits a chain made, and gives the task the same verdict, record and questions,
    naming its steps `audit/...`. A workflow runs one audit step, which may not be optional. When that step never starts,
    the task has no verdict and says why in `no_verdict`.'
  - '`--require LEVEL`, `result: require:` or `DATAEVAL_REQUIRE` makes the command exit 4 when a task''s verdict is worse
    than LEVEL (`ready-with-caveats`, `ready-with-accepted-risks` or `ready`), with the flag taking precedence. A task that
    gives no verdict is not judged, and a run in which no task gives one is refused with exit 1 before any task starts. A
    failed task exits 1 before the verdict is read, and exit 4 takes precedence over exit 3.'
- id: FR-19
  name: Custom Workflows
  description: DataEval Flow shall run a custom workflow, a chain of steps in a `workflows:` entry that reads datasets and
    the results of earlier steps, and shall list the steps a chain can use.
  criteria:
  - A `workflows:` entry with `inputs:` and `steps:` and no `type:` is a custom workflow. A task binds its `sources:` to the
    inputs in order, and the last input may be a list that binds every remaining source, keyed by source name.
  - The steps run in the order written. Each reads inputs and earlier steps by address (`name`, `name.output`, `name[key]`).
    The result is a `ChainResult` with a record of every step (kind, type, status, inputs, output), the findings of its checks,
    a health status, and the lineage of every Dataset the chain made.
  - '`dataeval-flow steps` and `list_steps()` list every evaluator, transform, combine, check and workflow type with its ports,
    description and the JSON Schema of its settings. `steps NAME` prints one step, `KIND:NAME` names a step that two kinds
    share, and `--json` prints the whole catalog.'
  - The transforms `view`, `merge`, `split`, `kfold`, `select`, `wrap`, `conform`, `remove`, `collect` and `export` make Datasets
    from Datasets. `conform` refuses a loss of classes beyond `allow:`, `remove` applies only plans computed on its own input,
    and `export` writes the Dataset with a provenance record under the output directory, or is skipped when the run has none.
  - A check step judges an evaluator's or a combine's output against thresholds written beside it, and makes findings that
    are `ok`, `info` or `warning`. Evaluators alone judge nothing. A threshold of `null` judges nothing and the finding is
    `info`. `groups:` puts the findings of named check types under headings in the report. A chain's health is `warning` where
    a finding warns.
  - A workflow type runs as a step with its whole chain, its checks' findings count toward the chain's health, and only its
    declared outputs, such as `cleaning.clean`, can be read.
  - '`by: class` runs an evaluator step or a check once per class, or once per named group of classes, and keeps the runs
    in one output; a check with `by:` rolls the findings of its keys into one.'
  - 'A step that reads one Dataset and is handed a list runs once per element. `pairs: true` runs a step once per unordered
    pair of a list, and `empty:` on a list input lets a task bind no source for it, with every check over it reporting the
    reason as not assessed.'
  - 'A failed step fails the task and skips every step that reads it, with the reason. Steps that do not depend on it still
    run and stay in the result. `optional: true` records a failure as a skip, and the task does not fail. A task with a failed
    step exits 1 on the command line.'
  - The config load refuses a step that names an evaluator the config does not define, an address that is no input or earlier
    step, a key outside a list, a setting its step does not take, a plan computed on another Dataset, and a task whose sources
    do not fit the inputs, before any data is read.
  - '`CustomWorkflowConfig` builds a workflow in Python, `dataeval_flow.run` runs it on datasets in memory, and `to_yaml()`
    and `save()` write it into a config file, keeping the file''s other keys and workflows, so that it loads and runs beside
    the rest of a pipeline.'
- id: FR-20
  name: Evaluators
  description: DataEval Flow shall run each of its standalone evaluators on its own, as a task or through `run()`, and return
    DataEval's output with no health status.
  criteria:
  - '`dataeval-flow evaluators` and `list_evaluators()` list every evaluator type with its description, what it consumes and
    how many sources it takes, and `dataeval-flow evaluators TYPE` prints the JSON Schema of its parameters. An unknown type
    is reported with the installed ones.'
  - Every evaluator type runs as a task that names it under `evaluator:`, and through `run(config, data)`. Both return the
    result class of the evaluator's config, holding DataEval's own output and its JSON form.
  - 'An evaluator''s result has `kind: evaluator`, no health and no findings, and an envelope that names the evaluator, DataEval''s
    version and the settings the run resolved. `--fail-on-warning` never fails a run because of an evaluator.'
  - The output's attributes that `data()` leaves out and a reader needs are written under `extras` (`output_extras`); an evaluator
    that names none writes no `extras`.
  - Parameter names are DataEval's own. An unknown parameter, or a value DataEval refuses, fails the config load.
  - A task names exactly one of `workflow:` and `evaluator:`, an `evaluators:` entry that exists, the number of sources its
    evaluator takes, and an extractor where the evaluator needs embeddings; the config load refuses anything else.
  - An evaluator that fails to run gives a failed result that records the error, and the pipeline's other tasks still run.
    A `duplicates` run on a source with no items gives a result with no rows, not an error.
- id: FR-21
  name: Analysis Service
  description: DataEval Flow shall provide `dataeval-flow serve`, an HTTP service that queues pipelines, runs them one at
    a time, keeps their files and history, and serves the results and the data they read.
  criteria:
  - '`dataeval-flow serve` takes the data root, output directory, cache directory, host and port as options or as `DATAEVAL_*`
    environment variables, with the option winning. It refuses to start without an output directory or with a data root that
    does not exist, and exits 3 when another service already runs the queue of the same output directory.'
  - '`/healthz` and `/readyz` answer 200 with `{"status": "ok"}` while the service takes and runs work, and 503 with the reasons
    `queue-stopped` or `store-unavailable` when it does not. `/livez` answers 503 only when the queue has stopped.'
  - '`/openapi.json` describes every route. `/v1/capabilities` gives the versions, the number of runs that execute at once,
    the features, the page limit and the step catalog, and `/v1/schema` gives the JSON Schema of a pipeline.'
  - '`POST /v1/validate` and `POST /v1/runs` refuse a request that would fail before any task ran, such as an unknown task,
    a pipeline with every task disabled, results without `json`, or an unreachable `require`. The refusal is a 422 whose `detail`
    entries carry `type`, `loc` and `msg`, with `loc` giving the field. A refused request queues nothing.'
  - '`POST /v1/runs` queues a snapshot of the pipeline and answers 202 with the run record. The run executes the batch command
    on that snapshot and keeps its snapshot, logs, result files and manifests under `<output>/runs/<id>/`; `GET /v1/runs/{id}/artifacts`
    lists them and serves each by path, and no path outside the directory.'
  - Runs execute one at a time, oldest first. An exit code of 0, 3 or 4 makes a run `succeeded`; any other exit code, a killing
    signal, or a command that cannot start makes it `failed` with a reason. No `DATAEVAL_*` variable of the service reaches
    a run.
  - '`GET /v1/runs/{id}/results` returns each finished task''s result as soon as the task finishes, merges per-task result
    files into one object, and answers 409 until a task has finished. `GET /v1/runs/{id}/logs` returns the last 64 KiB of
    the run''s console output. An unknown run is a 404 on every run route.'
  - A queued run can be cancelled without starting, and a running run is stopped, killed if it ignores the stop signal, so
    the next queued run starts. Cancelling a finished run is a 409.
  - '`GET /v1/runs` lists every run newest first, and a restarted service reads the same history. Stopping the service marks
    the running run `interrupted` and keeps the queued runs, which run when the service starts again. A finished record never
    changes.'
  - '`GET /v1/runs/{id}/items/{source}` and `.../items/{source}/{index}` serve the items a run read, with their boxes, labels
    and metadata, only while they hash as the run''s manifest recorded them; otherwise they report `input_changed`, `input_unavailable`
    or `evidence_unavailable`. `.../image` serves the image as a PNG, or one box cropped from it, or a shrunk copy, and answers
    409 for an item that is not verified.'
  - '`POST /v1/runs/{id}/selections` selects the exact rows of a profile field or a table that match a predicate. The same
    request gives the same selection id, before and after a restart. The members come in pages that hold each member once,
    a selection that becomes a source a later pipeline can load, and a selection the run cannot answer is a 422 whose `loc`
    names the field of the request.'
- id: FR-22
  name: Dataset Integrity & Export
  description: DataEval Flow shall pin a dataset by content digests and manifests, check data against them, and export a source
    as a dataset on disk with a record of where it came from.
  criteria:
  - '`dataset_digest` returns a content digest and a metadata digest (SHA-256), the item count and the digest scheme. The
    digests do not depend on item order. Editing, adding or removing an item changes them: the content digest covers images,
    labels and class names but never metadata, and the metadata digest covers each item''s metadata bound to its content.
    A detection target''s scores do not count, and a value with no stable form is refused with a `TypeError`.'
  - '`dataset_manifest` keeps each item''s position, `id` and hashes beside the digest. `DatasetManifest.save` and `load`
    round-trip it as JSON and refuse a manifest of another scheme. `compare` returns a `ManifestDiff` that names the changed,
    missing and added items by `id`, by index when ids are absent or repeated, and whether the class names differ.'
  - The `content-digest` evaluator gives the same digests as `dataset_digest`, in the result and in the text report. Each
    `content-digest` task of a run with an output directory writes a manifest to `results/manifests/<task>/content-digest.json`
    that names its source.
  - '`dataeval-flow verify <manifest> --config <pipeline> --source <name>` exits 0 when the source holds the items the manifest
    records. Otherwise it exits 1 and names the changed, missing and added items and whether the class names differ. An unreadable
    manifest or an undefined source exits 1 with an error and no traceback.'
  - An `exports:` entry writes a source as a COCO, YOLO, Hugging Face (`huggingface_vision`) or VisDrone dataset to `<output>/datasets/<name>/`,
    also in a pipeline with no tasks, and writes nothing when the run has no output directory. The name must be one directory
    segment, and the format and mode must be among those the schema lists.
  - Every export writes a `provenance.json` that records the tool and version, the time, the source, and for each operand
    its dataset and that dataset's `provenance:` facts. It records the content and metadata digests and item count of the
    written dataset as read back, which equal what a reader loading it computes. A VisDrone export, which Flow cannot read
    back, records no digest and says why.
  - An occupied destination is refused by default and left unchanged. `mode` set to `replace` clears it and records one write,
    and `mode` set to `append` writes into it and records both writes. A failed export is reported and the run exits non-zero,
    but the run's other exports are still written.
  - '`provenance:` on a `datasets:` entry takes names mapped to text, numbers or booleans and refuses nested values. A YAML
    date is kept as ISO 8601 text. A result records the facts as written in its resolved configuration, and they are no part
    of the dataset''s cache key.'
- id: NFR-1
  name: Platform Compatibility
  description: DataEval Flow shall behave consistently on every supported Python version, installer, and hardware configuration.
  criteria:
  - 'Python 3.11, 3.12, 3.13, and 3.14 (`requires-python >=3.11,<3.15`) are supported: the installed metadata, trove classifiers,
    CI test and verify matrices, conda environment, and container Python agree, and the unit and verification suites pass
    on every version in CI.'
  - DataEval Flow installs with pip and into a conda environment from `environment.yml`, and its lock file resolves for uv.
  - With CUDA absent or hidden, pipelines run on the CPU and the result records `cpu` as the device; a request for a GPU that
    PyTorch cannot see is refused with a message.
- id: NFR-2
  name: Packaging & Distribution
  description: DataEval Flow shall be published as a Python package that follows PEP 517, 518, and 561.
  criteria:
  - The package builds with `hatchling` (PEP 517, 518), takes its version from the repository tags, and includes only `src/dataeval_flow`
    in the wheel and the source distribution; an installed copy holds no `tests/` or `verification/` files.
  - The `py.typed` marker is installed with the package (PEP 561).
  - '`__version__` is a valid PEP 440 version that matches the installed metadata, and `Name`, `Requires-Python`, `License`
    (MIT), and the project URLs are set in the metadata.'
  - The wheel installs under pip and uv without errors, and a tagged release appears on PyPI.
- id: NFR-3
  name: Type Safety
  description: DataEval Flow shall ship complete type information and typed interfaces for its public API.
  criteria:
  - '`pyright` passes with zero errors on `src/` and `tests/`.'
  - The `py.typed` marker ships with the package.
  - '`dataeval_flow.__all__` and the `__all__` of every public module list each name once and every listed name imports; the
    extension-point base classes are exported where the documentation says.'
  - '`run` returns the result class that belongs to the configuration it was given, and the MAITE dataset protocol that datasets
    are accepted by is `runtime_checkable`.'
- id: NFR-4
  name: Configuration, Reproducibility & Logging
  description: DataEval Flow shall produce the same outputs for the same configuration and seed, and shall log through the
    standard `logging` framework.
  criteria:
  - '`PipelineConfig.seed` is applied to every stochastic component through DataEval''s seed configuration, once per task,
    so a task''s result does not depend on which tasks ran before it; `deterministic` forces PyTorch deterministic algorithms.'
  - The same configuration and seed give identical results, apart from the fields that record when and how long a run took
    and the diagnostics DataEval warns about once per process. A different configuration or a different seed gives different
    results.
  - The seed is recorded in the result envelope; an unseeded run records none.
  - Module loggers are standard `logging.Logger` objects named `dataeval_flow.*`, importing the package attaches no root handler,
    and the headless CLI installs a stream handler and writes `result.log` beside the results.
  - Console records carry an ISO-8601 UTC timestamp and level, selectable with `--log-format` or `DATAEVAL_LOG_FORMAT`, and
    the option takes precedence over the variable (IR-2.2-S-1, IR-2.2-S-2).
- id: NFR-5
  name: Performance & Scale
  description: DataEval Flow shall read datasets lazily, keep its memory use predictable, reuse cached work, and track the
    time of reference pipelines for regressions.
  criteria:
  - 'Peak memory grows with the size of the stored statistics, not with the size of the images, because datasets are read
    lazily: about 8 KB per 32x32 image for the `quality` preset in reference measurements, and for 224x224 images less than
    the size of the raw pixels.'
  - A repeat run with a warm cache reuses cached artifacts instead of recomputing them, and is typically much faster (about
    17 times on 1,000 images in reference measurements).
  - The number of worker processes is configurable through `PipelineConfig.max_processes`, `--max-processes`, and `DATAEVAL_MAX_PROCESSES`,
    and the command-line option takes precedence. It is applied through DataEval's `set_max_processes` once per task, is recorded
    in `resolved_config`, and is respected inside the container. When none is set, DataEval's default of a single process
    stands.
  - 'Raising the process count may shorten or lengthen a run, depending on image size and the workload: in reference measurements
    `quality` ran faster with more processes on both 32x32 and 224x224 images, and the figures are recorded with the test
    evidence.'
  - The effect depends on the workload, image size, CPU architecture, and platform. The measurements were taken on CPU on
    one development machine, so DataEval Flow makes no performance promise for other environments and does not recommend a
    process count; users should measure their own pipeline.
  - Two reference pipelines (the `quality` preset, and `quality` with cluster-based outlier detection, on a 10,000-image 32x32
    dataset) are timed on the pipeline runner, and a run that takes longer than its budget (60 s and 90 s, about eight times
    the development-machine measurement) fails verification. The budget guards against regressions and is not a performance
    guarantee.
  notes:
  - Measured with `dataeval-flow` 0.3 (main, 0.2.3.dev763 before tagging) and `dataeval` 1.1.1.dev148 on synthetic ImageFolder
    datasets of noise images, 10 classes, with the `flatten` extractor. The v0.2 workloads `data-cleaning` and `data-analysis`
    no longer exist; `quality` replaces data-cleaning, and these figures are not comparable with the earlier release's.
  - 'Cold run at 10,000 images of 32x32: `quality` 7.7 s (9.3 s at the default single process in the process-count run), `quality`
    with cluster-based outlier detection 10.6 s. Peak memory growth for `quality` between 2,000 and 8,000 images: 8.0 KB per
    image (17.8 MB at 2,000 images, 65.9 MB at 8,000); at 600 images of 224x224, 50.9 MB against 88 MB of raw pixels. Warm
    cache at 1,000 images: 0.9 s cold, 0.05 s warm.'
  - 'Process count, 10,000 images at 32x32 (`quality` / `quality` with clusters): 1 process 9.3 s / 9.6 s, 2 processes 5.9
    s / 8.4 s, 4 processes 5.9 s / 8.8 s, 8 processes 6.4 s / 8.6 s. 200 images at 224x224, `quality`: 1 process 1.5 s, 4
    processes 0.65 s.'
  - 'Memory observation: the cluster-based workload embeds every image with the `flatten` extractor, so its embedding size
    is the pixel count. At 600 images of 224x224 its peak growth was about 10.9 GB, so `flatten` embeddings with cluster-based
    detection are not suited to large images; use a feature extractor.'
  - 'Test environment: Windows 11 host running WSL2 (kernel 6.18.40.1-microsoft-standard-WSL2, Ubuntu 24.04), AMD Ryzen 9
    9950X3D (x86_64, 16 cores, 32 threads), 62 GB of memory visible to WSL2, CPU only (no GPU used). Python 3.14.2, PyTorch
    2.14.1 (CPU). Other development workloads were running on the machine during the measurements.'
  - 'Limitations: a small number of synthetic workloads on one machine, a single run per cell, so run-to-run variance is unknown
    (repeat runs differed by up to about 20%), and no measurements on other hardware, operating systems, containers, or CI
    runners. No CI-runner baseline exists yet for the v0.3 workloads, so the time budgets are set conservatively and should
    be tightened once the pipeline runner has recorded them. Treat the figures as illustrative, not as expected performance.'
- id: NFR-6
  name: Robustness
  description: DataEval Flow shall report bad input and failing tasks clearly, and fail in a way a calling script can detect.
  criteria:
  - A missing config, a missing data directory, a data root with no config, or an invalid config produces a clear error that
    names the problem and a non-zero exit code; a malformed `DATAEVAL_*` variable is reported by name.
  - A failing task is recorded in its result with its failed step and error, the remaining tasks still run, and the run exits
    with code 1.
  - An unknown workflow, evaluator, step, or task name is reported with the installed or defined names, and an unsupported
    command-line option exits with code 2 and names the option.
- id: NFR-7
  name: Container Security & Provenance
  description: DataEval Flow shall publish container images that are scanned, signed, and shipped with a software bill of
    materials (CS-2, CS-3, DSOR-5).
  criteria:
  - The pipeline builds and scans each image before it is pushed under its published tag, and fails when it finds HIGH or
    CRITICAL vulnerabilities (CS-2-H-2). The full scan report is recorded with the image.
  - Each image is signed with `cosign` and verifies against the public key at `docker/cosign.pub`; the private key is never
    copied into an image.
  - Each image contains its Trivy scan reports and CycloneDX SBOM under `/usr/share/dataeval-flow/security/`, and the SBOM
    is attached to the registry as an attestation and republished with each release.
test_cases:
- id: 1-1
  req: FR-1
  name: Install and Extras
  type: Core Functionality
  business: A user can install DataEval Flow, run it from the command line, and add optional extras without conflicts.
  conditions:
  - A clean virtual environment with `pip install dataeval-flow`
  - A second environment with the optional extras installed
  steps:
  - do: Import `dataeval_flow`, read `__version__`, and import every public module.
    expect: The package imports, `__version__` is set, and every public module imports with the base install.
    tests:
    - f1_pip::test_import_dataeval_flow
    - f1_pip::test_version_is_set
    - f1_pip::test_every_public_module_imports_without_optional_extras_being_needed
  - do: Run `dataeval-flow --version` and `python -m dataeval_flow --version`.
    expect: The console script is declared in the package metadata, and both entry points run and report the installed version.
    tests:
    - f1_pip::test_console_script_is_declared_and_runs
    - f1_pip::test_python_dash_m_runs_and_reports_the_same_version
  - do: Read the extras declared in `pyproject.toml` and in the installed metadata, the packages each adds, and the conflicts
      declared for uv.
    expect: The ten documented extras are declared and no others; each adds its packages; the PyTorch extras exclude each
      other, as do the ONNX extras; the CUDA ONNX extras drop their runtime when both are requested; and the container variants
      install only declared extras.
    tests:
    - f1_extras::test_the_declared_extras_are_exactly_the_documented_ones
    - f1_extras::test_each_extra_adds_its_packages
    - f1_extras::test_the_cuda_and_cpu_torch_extras_exclude_each_other_and_so_do_the_onnx_extras
    - f1_extras::test_the_cuda_onnx_extras_drop_their_runtime_when_both_are_requested
    - f1_extras::test_the_container_variants_install_only_declared_extras
  - do: In the extras environment, import each optional module.
    expect: Each optional module imports when its extra is installed.
    tests:
    - f1_opt::test_optional_module_importable_if_installed
  - do: Run `serve`, run `app`, and read an ontology file with the packages of the `service`, `app`, and `ontology` extras
      made unavailable; then read the ontology file with the extra installed.
    expect: '`serve` and `app` exit with code 1 and name the extra to install, the ontology reader names `dataeval[ontology]`,
      and with the extra installed the file loads.'
    tests:
    - f1_opt::test_serve_without_the_service_extra_exits_one_and_names_the_extra
    - f1_opt::test_app_without_the_app_extra_exits_one_and_names_the_extra
    - f1_opt::test_reading_an_ontology_file_without_the_ontology_extra_names_the_extra
    - f1_opt::test_reading_an_ontology_file_works_with_the_ontology_extra
  - do: Review the `install:pip`, `install:conda`, `install:lock`, and `deps` CI jobs.
    expect: The `cpu` extra installs under pip and conda, the lock file resolves, and with the lowest supported dependency
      versions the unit tests that need no optional extra pass.
    tests:
    - 'CI: install:pip'
    - 'CI: install:conda'
    - 'CI: install:lock'
    - 'CI: deps'
- id: 2-1
  req: FR-2
  name: Configuration Loading
  type: Core Functionality
  business: A pipeline configuration loads from a YAML file, a JSON file or a folder of files, a bad configuration is rejected
    with a message that points to the mistake, and paths resolve against the data root.
  conditions:
  - DataEval Flow installed
  - Sample YAML and JSON configurations, a folder of configuration files, and invalid configurations
  steps:
  - do: Load a YAML file and a JSON file with `load_config`, once by `Path` and once by string.
    expect: Each gives a `PipelineConfig` holding what the file held; the two formats of one configuration load equal, and
      an empty file gives an empty pipeline.
    tests:
    - f2_file::test_load_yaml_single_file
    - f2_file::test_load_json_single_file
    - f2_file::test_yaml_and_json_of_one_config_load_equal
    - f2_file::test_the_path_may_be_a_string
    - f2_file::test_an_empty_file_is_an_empty_pipeline
  - do: Load a path that does not exist.
    expect: '`FileNotFoundError` names the file.'
    tests:
    - f2_file::test_a_missing_file_raises_file_not_found
  - do: Dump a loaded configuration with `model_dump_json()` and validate the dump.
    expect: The result equals the configuration that was dumped, workflow settings included.
    tests:
    - f2_file::test_a_config_survives_a_dump_and_reload
  - do: Load a folder holding a JSON and a YAML file that set the same scalar, mapping and list.
    expect: The mappings merge, the lists extend, the later file's scalar wins, and files merge in name order.
    tests:
    - f2_folder::test_load_config_folder_merges_files
    - f2_folder::test_files_merge_in_name_order
  - do: Load a folder whose task names a workflow that another file defines.
    expect: The files are validated once merged, so the configuration loads.
    tests:
    - f2_folder::test_a_config_split_across_files_validates_once_merged
  - do: Load a folder that also holds a Compose file, a broken YAML file and a Markdown file; then one that holds none that
      is a pipeline file.
    expect: The other files are skipped; a folder with no pipeline file raises `FileNotFoundError`.
    tests:
    - f2_folder::test_files_that_are_not_pipeline_configs_are_skipped
    - f2_folder::test_a_folder_without_a_pipeline_file_raises_file_not_found
  - do: Load a folder in which one file has a misspelled section name.
    expect: The error names the file and the section it resembles.
    tests:
    - f2_folder::test_a_misspelled_section_in_one_file_names_the_file
  - do: Load configurations with a wrong type, an unknown setting in a dataset, and a bad setting in the second workflow entry.
    expect: 'A `ValidationError` locates each mistake: the section, the entry''s index and the field.'
    tests:
    - f2_invalid::test_invalid_config_raises_validation_error
    - f2_invalid::test_the_error_points_to_the_offending_field
    - f2_invalid::test_an_error_in_a_workflow_entry_is_located_by_its_index
  - do: Load a configuration with a misspelled top-level key, an uninstalled workflow type, and a name used twice in one section.
    expect: The first names the section it resembles, the second lists the installed workflow types, and the third is refused
      as a duplicate.
    tests:
    - f2_invalid::test_a_misspelled_top_level_key_names_the_section_it_resembles
    - f2_invalid::test_a_workflow_type_that_is_not_installed_lists_the_installed_ones
    - f2_invalid::test_a_name_used_twice_in_one_section_is_refused
  - do: Read `PipelineConfig.model_json_schema()`.
    expect: It is the schema of `PipelineConfig`, with every section as a property and a branch for each built-in workflow,
      evaluator and extractor.
    tests:
    - f2_schema::test_the_schema_describes_pipeline_config
    - f2_schema::test_the_schema_has_a_branch_per_built_in_workflow_evaluator_and_extractor
  - do: Install a plug-in package and read the schema again; compare `config/params.schema.json` with the schema of the built-in
      types.
    expect: The plug-in's workflow and extractor have branches; the checked-in schema is current.
    tests:
    - f2_schema::test_an_installed_plugin_has_a_branch_in_the_schema
    - f2_schema::test_the_checked_in_schema_matches_the_built_in_types
  - do: Load a source whose dataset has a relative path, giving a data root, and then a different root.
    expect: The dataset is found under the root given, and not found under the other.
    tests:
    - f2_root::test_relative_dataset_paths_resolve_against_data_root
  - do: Put the dataset in the root's `data` folder, and resolve with and without `DATAEVAL_DATA`.
    expect: The `data` folder is searched when the path is not found directly; the root is the argument, else `DATAEVAL_DATA`,
      else the working directory.
    tests:
    - f2_root::test_a_dataset_under_the_data_folder_of_the_root_is_found
    - f2_root::test_the_data_root_defaults_to_the_environment_then_the_working_directory
  - do: Give a dataset or a model an absolute path, or one that climbs out of the root.
    expect: The configuration is refused, naming the `path` or `model_path` field.
    tests:
    - f2_root::test_dataset_paths_must_stay_relative_to_the_data_root
    - f2_root::test_a_config_file_with_an_absolute_dataset_path_is_refused
    - f2_root::test_a_model_path_must_stay_relative_too
- id: 3-1
  req: FR-3
  name: Dataset Formats and Loading
  type: Core Functionality
  business: Datasets in each supported format, and datasets a user built, reach a task as MAITE-compatible datasets, and a
    dataset that cannot be loaded is refused with a message that says what to check.
  conditions:
  - DataEval Flow installed
  - Small image-folder, Hugging Face, COCO and YOLO datasets, a torchvision-style dataset and a user dataset factory
  steps:
  - do: Validate a `datasets:` entry of each format.
    expect: Each entry becomes the config class its `format` names, defaults its `format` to its own, and writes back to an
      equal config.
    tests:
    - f3_cfg::test_the_format_key_selects_the_config_class
    - f3_cfg::test_the_format_defaults_to_the_classs_own
    - f3_cfg::test_a_config_round_trips_through_serialization
  - do: Validate an entry with an unknown format, a setting of another format, no `task` on a Hugging Face entry, no path,
      and a COCO or YOLO file path outside the root.
    expect: Each is refused.
    tests:
    - f3_cfg::test_an_unknown_format_is_refused
    - f3_cfg::test_a_setting_of_another_format_is_refused
    - f3_cfg::test_huggingface_needs_a_task
    - f3_cfg::test_the_dataset_path_is_required
    - f3_cfg::test_a_file_named_inside_a_dataset_must_stay_under_the_data_root
  - do: Load the image-folder dataset with `load_dataset`, with and without `infer_labels`, and with a file that is not an
      image in a class folder.
    expect: The result satisfies `AnnotatedDataset`, with images as CHW arrays and one-hot labels from the sub-folder names,
      or empty targets when labels are not inferred; other files are ignored.
    tests:
    - f3_load::test_load_dataset_image_folder
    - f3_load::test_image_folder_without_infer_labels_has_no_labels
    - f3_load::test_image_folder_ignores_files_that_are_not_images
  - do: Load COCO and YOLO datasets, and a YOLO dataset by split.
    expect: Images and boxes load with the expected length, labels and class names; YOLO boxes are returned as pixel corners;
      a split with no images is refused.
    tests:
    - f3_load::test_load_dataset_coco
    - f3_load::test_load_dataset_yolo
    - f3_load::test_yolo_boxes_are_returned_as_pixel_corners
    - f3_load::test_yolo_split_selects_images
  - do: Load a Hugging Face repository for classification and for detection, the latter by split folder.
    expect: Both satisfy `AnnotatedDataset`; detection boxes are returned as corners; classification is the default task.
    tests:
    - f3_load::test_load_dataset_huggingface_classification
    - f3_load::test_load_dataset_huggingface_detection_reads_a_split_folder
    - f3_load::test_huggingface_defaults_to_the_classification_loader
  - do: Load a COCO location with no annotations, a missing or empty image folder, an unsupported format, and a Hugging Face
      `save_to_disk` dump.
    expect: Each raises with a message that says what to check.
    tests:
    - f3_load::test_a_dataset_that_loads_no_items_is_refused_with_a_hint
    - f3_load::test_an_empty_or_missing_image_folder_is_refused
    - f3_load::test_an_unsupported_format_is_refused
    - f3_load::test_a_saved_arrow_dataset_gets_a_specific_message
  - do: Read a source whose dataset entry is each file format, with a data root; then one that names a dataset the pipeline
      does not define.
    expect: Each loads from the data root and satisfies `AnnotatedDataset`; the undefined name is refused with the datasets
      that are defined.
    tests:
    - f3_fromcfg::test_a_configured_dataset_loads_from_the_data_root
    - f3_fromcfg::test_a_dataset_the_config_names_but_does_not_define_is_refused
  - do: Build a dataset with a user factory and pass it through a `DatasetProtocolConfig`.
    expect: The factory is called once and the pipeline reads the very object it built.
    tests:
    - f3_proto::test_protocol_config_factory_dataset_is_returned
  - do: Run a task over a protocol dataset; set the entry's `format` to `coco`; write one in a YAML file.
    expect: The task runs; only `maite` and `torchvision` are formats of the entry; a file cannot hold the object, so the
      entry is refused.
    tests:
    - f3_proto::test_a_protocol_dataset_runs_in_a_task
    - f3_proto::test_the_format_is_maite_or_torchvision
    - f3_proto::test_a_protocol_dataset_cannot_be_written_in_a_config_file
  - do: Wrap a torchvision classification dataset and a torchvision detection dataset.
    expect: Images are CHW float arrays, labels are one-hot, class names come from `classes`, and XYWH boxes become corner
      boxes.
    tests:
    - f3_tv::test_a_torchvision_classification_dataset_becomes_a_maite_dataset
    - f3_tv::test_a_torchvision_detection_dataset_gets_corner_boxes
  - do: Name a demo dataset that is in the table, one that is not, and one when `maite-datasets` is missing.
    expect: The tutorial dataset is built from the data root without downloading; the other name is refused listing the known
      datasets; the missing package gives an instruction.
    tests:
    - f3_demo::test_the_demo_loader_builds_a_known_dataset_from_the_data_root
    - f3_demo::test_an_unknown_demo_dataset_is_refused_naming_the_known_ones
    - f3_demo::test_the_demo_loader_says_what_to_install_when_maite_datasets_is_missing
- id: 3-2
  req: FR-3
  name: Dataset Descriptions
  type: Core Functionality
  business: Facts about a dataset that Flow cannot measure, and the way its channels are grouped, are declared once on the
    dataset and reach every result.
  conditions:
  - DataEval Flow installed
  - A small image folder, and datasets configured with `value_range`, `channel_groups` and `provenance`
  steps:
  - do: Give each file-backed format a `value_range`, `channel_groups` and `provenance`.
    expect: All three are accepted on every format.
    tests:
    - f3_desc::test_the_description_fields_sit_on_every_file_backed_format
  - do: Declare channel groups with a reserved name, with no bands, with a negative band, and with their own value range.
    expect: Reserved names, empty groups and negative bands are refused; a group may carry its own range, which must have
      low below high.
    tests:
    - f3_desc::test_a_channel_group_may_not_take_a_statistic_or_reserved_name
    - f3_desc::test_a_channel_group_needs_bands_that_exist
    - f3_desc::test_a_channel_group_can_carry_its_own_value_range
  - do: Measure two channel groups with a stats policy and profile the dataset; then name a group the dataset does not declare.
    expect: The profile has `<group>_<statistic>` fields for the statistics each group was asked for, beside the whole image's;
      the undeclared group is refused before the data is read.
    tests:
    - f3_desc::test_channel_groups_measure_their_bands_separately
    - f3_desc::test_a_stats_policy_naming_an_undeclared_group_is_refused_before_the_data_is_read
  - do: Give `provenance` text, numbers and booleans, a date written in YAML, and a nested value.
    expect: Plain values are kept, a date is kept as ISO text, and a nested value is refused.
    tests:
    - f3_desc::test_provenance_takes_names_and_plain_values
    - f3_desc::test_a_yaml_date_in_provenance_is_kept_as_iso_text
    - f3_desc::test_a_nested_provenance_value_is_refused
  - do: Run a task over a dataset with `provenance` and `value_range`, and compare the dataset's cache identity with and without
      `provenance`.
    expect: The result's `resolved_config` records both as written; `provenance` does not change the cache identity.
    tests:
    - f3_desc::test_provenance_and_description_are_recorded_in_the_results_resolved_config
    - f3_desc::test_provenance_does_not_change_the_cached_identity_of_a_dataset
- id: 3-3
  req: FR-3
  name: Merged Sources and load_source
  type: Core Functionality
  business: Several datasets read as one source, and a configured source loaded outside a run, give the items a run would
    read.
  conditions:
  - DataEval Flow installed
  - Two image folders whose classes are numbered differently, and views that conform each to one target
  steps:
  - do: Validate sources that name a dataset, a merge, both, neither, and a merge of one source.
    expect: A source names a dataset or a merge of at least two sources; the others are refused.
    tests:
    - f3_srccfg::test_a_source_names_a_dataset_or_a_merge
    - f3_srccfg::test_a_source_naming_both_is_refused
    - f3_srccfg::test_a_source_naming_neither_is_refused
    - f3_srccfg::test_a_merge_of_one_source_is_refused
  - do: Load a source that merges two operand sources, each conformed by a `Relabel` view.
    expect: The items of the first operand come first, then the second's, under one `index2label`; each datum's id is `<position>:<id>`.
    tests:
    - f3_merge::test_a_merged_source_concatenates_its_operands_in_order
    - f3_merge::test_a_merged_datums_id_names_its_operand_and_its_own_id
  - do: Give the merged source its own view, and merge a merge.
    expect: The source's view applies after the merge; a merge may hold another merge.
    tests:
    - f3_merge::test_the_merged_source_s_own_view_applies_after_the_merge
    - f3_merge::test_a_merge_may_hold_another_merge
  - do: Merge operands whose targets are ordered differently, a merge that contains itself through another, merges nested
      nine deep, and an operand that does not exist.
    expect: 'Each is refused: the first by DataEval, the cycle with its path, the depth with the bound of eight, and the unknown
      operand with the sources that exist.'
    tests:
    - f3_merge::test_operands_that_number_their_classes_differently_are_refused
    - f3_merge::test_a_merge_that_names_itself_through_another_is_refused
    - f3_merge::test_merges_nested_deeper_than_eight_are_refused
    - f3_merge::test_a_merge_naming_an_unknown_source_lists_the_known_ones
  - do: Run a task over a merged source.
    expect: The task runs over all the items, and its result records each operand's dataset and view and the label space each
      was conformed to.
    tests:
    - f3_merge::test_a_task_runs_over_a_merged_source_and_records_what_was_merged
  - do: Load a viewed source with `load_source`, and run a `content-digest` task over it.
    expect: '`load_source` returns the items the run reads, so their digests agree.'
    tests:
    - f3_loadsrc::test_a_viewed_source_loads_the_items_a_run_reads
    - f3_loadsrc::test_a_loaded_source_matches_what_a_content_digest_task_reads
  - do: Load a source that names an unknown source or an unknown view.
    expect: '`ValueError` lists the names that exist.'
    tests:
    - f3_loadsrc::test_a_source_naming_an_unknown_name_lists_the_known_ones
    - f3_loadsrc::test_a_source_naming_an_unknown_view_lists_the_known_ones
  - do: Load a source whose view shuffles without a seed before another operation, and one whose merge operand does.
    expect: Each is refused with the view's name and the advice to give it a `seed:`.
    tests:
    - f3_loadsrc::test_a_view_that_would_draw_different_items_on_each_load_is_refused
    - f3_loadsrc::test_an_operand_view_that_shuffles_unseeded_refuses_the_merged_source
  - do: Load a source with a seeded shuffle twice, and one with an unseeded shuffle as its last operation.
    expect: Both load the same items each time.
    tests:
    - f3_loadsrc::test_a_seeded_shuffle_draws_the_same_items_each_load
    - f3_loadsrc::test_an_unseeded_shuffle_as_the_last_operation_only_reorders
- id: 4-1
  req: FR-4
  name: Extractor Configuration
  type: Core Functionality
  business: Every supported feature extractor can be configured, built and used to produce embeddings.
  conditions:
  - DataEval Flow installed with the `cpu`, `onnx` and `opencv` extras
  - Small ONNX and Torch model files written by the tests
  steps:
  - do: Construct the Flatten, Torch, ONNX, bag-of-visual-words and uncertainty configs.
    expect: Each constructs, with its `model` set, its own settings, and a name taken from its `model`.
    tests:
    - f4_cfg::test_flatten_extractor_config_constructs
    - f4_cfg::test_torch_extractor_config_constructs
    - f4_cfg::test_onnx_extractor_config_constructs
    - f4_cfg::test_bovw_extractor_config_constructs
    - f4_cfg::test_uncertainty_extractor_config_constructs
    - f4_cfg::test_an_entry_is_named_after_its_model_unless_it_is_given_a_name
    - f4_cfg::test_batch_size_and_preprocessor_are_set_on_any_extractor
  - do: Validate an `extractors:` entry of each model, write it back and validate it again.
    expect: Each entry becomes the config class its `model` names and round-trips.
    tests:
    - f4_cfg::test_an_entry_names_its_extractor_by_model
    - f4_cfg::test_a_config_round_trips_through_serialization
  - do: Validate an entry for another extractor's `model`, with another extractor's setting, with no `model`, with an unknown
      `model`, and with a bad value in the second entry.
    expect: 'Each is refused: the unknown model lists the installed extractors and the bad value is located by its entry''s
      index.'
    tests:
    - f4_cfg::test_a_config_refuses_another_extractors_model
    - f4_cfg::test_a_setting_of_another_extractor_is_refused
    - f4_cfg::test_an_entry_without_a_model_is_refused
    - f4_cfg::test_an_unknown_model_lists_the_installed_extractors
    - f4_cfg::test_an_invalid_entry_is_located_by_its_index
  - do: Validate an ONNX entry with one input dimension, a bag-of-visual-words vocabulary at and beyond its bounds, an uncertainty
      entry without its model, metadata and prediction kind, and model paths outside the data root.
    expect: 'Each is refused: the input size must be set together, the vocabulary is 256 to 4096, and paths stay relative
      to the root.'
    tests:
    - f4_cfg::test_onnx_input_size_needs_both_dimensions
    - f4_cfg::test_bovw_vocabulary_size_is_bounded
    - f4_cfg::test_uncertainty_needs_its_model_metadata_and_prediction_kind
    - f4_cfg::test_model_paths_must_stay_under_the_data_root
  - do: Read the names exported by `dataeval_flow.config.extractors`, and call `list_extractors()` and `get_extractor()`.
    expect: Every extractor config is exported; the five built-in extractors are listed by name, and an unknown name raises
      `ValueError` listing the installed ones.
    tests:
    - f4_cfg::test_the_extractor_configs_are_exported_from_the_extractors_package
    - f4_cfg::test_the_built_in_extractors_are_listed_by_name
    - f4_cfg::test_an_unknown_extractor_raises_and_lists_the_installed_ones
  - do: Build the Flatten extractor from its config and run it over 10 images.
    expect: One row of 3 x 8 x 8 values is returned for each image.
    tests:
    - f4_build::test_flatten_extractor_from_config_embeds_every_sample
  - do: Build a Torch extractor on two layers of a saved model, an ONNX extractor on a named output, the same with a resize
      to the model's input size, and a bag-of-visual-words extractor.
    expect: Each returns one row for each image, of the width of the layer or output asked for.
    tests:
    - f4_build::test_torch_extractor_embeds_with_the_named_layer
    - f4_build::test_onnx_extractor_embeds_with_the_named_output
    - f4_build::test_onnx_extractor_resizes_images_to_the_configured_input_size
    - f4_build::test_bovw_extractor_embeds_each_image_as_a_histogram
  - do: Build the uncertainty extractor.
    expect: It refuses to build, saying only drift and OOD evaluators read it.
    tests:
    - f4_build::test_uncertainty_extractor_is_read_through_predictions_not_built
  - do: Run a task with an extractor, with a preprocessor on it, and with a batch size of 8 over 20 images.
    expect: The task embeds with the named extractor and records it; the extractor gets the preprocessed images, in batches
      of 8, 8 and 4.
    tests:
    - f4_pipe::test_a_task_embeds_with_the_extractor_it_names
    - f4_pipe::test_a_preprocessor_runs_on_each_image_before_the_extractor_sees_it
    - f4_pipe::test_batch_size_sets_how_many_images_the_extractor_gets_at_once
  - do: Run a task with an extractor that has no batch size, with an ONNX model in the data root's `models` folder, and with
      an ONNX model that does not exist.
    expect: The first fails the task with the message; the second finds the model; the third fails the task naming the missing
      file.
    tests:
    - f4_pipe::test_an_extractor_with_no_batch_size_fails_the_run_that_needs_embeddings
    - f4_pipe::test_an_onnx_extractor_finds_its_model_in_the_models_folder_of_the_data_root
    - f4_pipe::test_a_missing_model_file_is_reported_when_the_task_runs
  - do: Run a drift evaluator between a reference and a similar source, and between the reference and a brighter one, with
      the uncertainty extractor on an ONNX classifier.
    expect: Drift is found only for the brighter source.
    tests:
    - f4_unc::test_drift_is_detected_in_the_model_s_uncertainty
  - do: Load a configuration whose task runs an evaluator that needs one row for each item with the uncertainty extractor.
    expect: The configuration is refused, naming the task.
    tests:
    - f4_unc::test_an_evaluator_that_needs_one_row_per_item_is_refused_when_the_config_loads
- id: 4-2
  req: FR-4
  name: Plug-in Extractors
  type: Integration
  business: A package can add an extractor that configurations name like a built-in one.
  conditions:
  - DataEval Flow installed
  - An example plug-in extractor served as an installed entry point
  steps:
  - do: Install the plug-in and call `list_extractors()`; validate an entry for it from a YAML file.
    expect: The extractor is listed in name order and the entry becomes its config class, named after its `model`.
    tests:
    - f4_plug::test_an_installed_extractor_is_listed_and_validates_from_yaml
  - do: Build the plug-in extractor and run a task with it.
    expect: It returns one row for each image, and the task records it as its model.
    tests:
    - f4_plug::test_an_installed_extractor_builds_embeddings_like_a_built_in
    - f4_plug::test_a_task_runs_with_an_installed_extractor
  - do: Register a plug-in that cannot be imported, one that takes `flatten`, and one whose config configures another model.
    expect: The first is left out with the reason logged and given when it is looked up; the built-in keeps its name; the
      third is refused.
    tests:
    - f4_plug::test_a_broken_extractor_plugin_is_left_out_and_says_why
    - f4_plug::test_a_plugin_cannot_take_a_built_in_extractors_name
    - f4_plug::test_a_plugin_whose_config_configures_another_model_is_refused
  - do: Compare the `Extractor` base with the `ExtractorConfig` base.
    expect: 'They are separate classes: a plug-in names its config as a type argument.'
    tests:
    - f4_plug::test_the_extractor_base_is_not_a_config
- id: 5-1
  req: FR-5
  name: Preprocessing
  type: Core Functionality
  business: Preprocessing steps apply to each image in the order written, and give the same result each time.
  conditions:
  - DataEval Flow installed with the `cpu` extra
  - Synthetic images, and an example plug-in transform served as an installed entry point
  steps:
  - do: Build a `PreprocessorConfig` with an ordered list of steps, with and without parameters, from Python and from a YAML
      file.
    expect: The config keeps the steps in the order written.
    tests:
    - f5_cfg::test_preprocessor_config_accepts_transforms
    - f5_cfg::test_a_step_without_params_has_an_empty_set
    - f5_cfg::test_steps_keep_the_order_a_config_file_gives_them
  - do: Build a preprocessor with no name or steps, a step with an unknown key, and two preprocessors of one name.
    expect: Each is refused.
    tests:
    - f5_cfg::test_a_preprocessor_needs_a_name_and_steps
    - f5_cfg::test_an_unknown_key_in_a_step_is_refused
    - f5_cfg::test_a_pipeline_defines_each_preprocessor_name_once
  - do: Apply `Resize` and `CenterCrop` in both orders, and `ToDtype` with `Normalize` to a black and a white image.
    expect: The two orders give different shapes; the normalized values are -1 and 1; the output is a numpy array in CHW layout.
    tests:
    - f5_order::test_the_steps_apply_in_the_order_given
    - f5_order::test_a_normalization_after_a_dtype_conversion_scales_the_values
    - f5_order::test_the_result_is_a_numpy_array_in_chw_layout
  - do: Name a `dtype` and an `interpolation` as text, and then an unknown dtype, an unknown interpolation, a non-text dtype,
      a size that is not a size, and a transform that does not exist.
    expect: The names are accepted; each bad parameter and the unknown transform is refused, and the last lists the registered
      transforms and torchvision.
    tests:
    - f5_order::test_dtype_and_interpolation_are_given_by_name
    - f5_order::test_a_step_with_a_parameter_that_cannot_be_built_is_refused
    - f5_order::test_an_unknown_transform_lists_the_registered_ones
  - do: Build the same steps twice and apply them to one image.
    expect: The outputs are equal and the transforms have the same `repr`, which the embedding cache keys on; other parameters
      give another `repr`.
    tests:
    - f5_order::test_the_same_steps_give_the_same_output_and_the_same_identity
  - do: Apply the registered `ToRGB` step to images with 1, 2, 3 and 4 channels, and name a torchvision transform.
    expect: Every image has three channels (grey repeated, alpha dropped); a torchvision name means torchvision's transform.
    tests:
    - f5_reg::test_to_rgb_is_a_registered_transform
    - f5_reg::test_to_rgb_gives_every_image_three_channels
    - f5_reg::test_to_rgb_repeats_grey_and_drops_alpha
    - f5_reg::test_a_torchvision_name_means_torchvisions_transform
  - do: Install a transform plug-in and use it as a step, alone and with torchvision's steps.
    expect: It is listed, and it runs with its parameters as written.
    tests:
    - f5_plug::test_an_installed_transform_runs_as_a_step_with_its_params_as_written
    - f5_plug::test_an_installed_transform_is_listed_and_composes_with_torchvisions
  - do: Name the installed transform in a preprocessor that an extractor uses, in a task.
    expect: The extractor gets each image inverted.
    tests:
    - f5_plug::test_an_extractor_applies_an_installed_transform_from_a_preprocessor_entry
  - do: Register a transform plug-in that cannot be imported, one named `Resize` and one named `ToRGB`.
    expect: The first is left out and its failure is raised when a step names it; the others cannot take a torchvision or
      built-in name.
    tests:
    - f5_plug::test_a_step_naming_a_broken_transform_plugin_raises_the_plugin_s_failure
    - f5_plug::test_a_plugin_cannot_take_a_torchvision_transform_s_name
    - f5_plug::test_a_plugin_cannot_take_a_built_in_transform_s_name
  - do: Name a preprocessor from an extractor in a task, and name one the pipeline does not define.
    expect: The extractor applies the named preprocessor and the result records it; the unknown name raises `ValueError` before
      the task runs.
    tests:
    - f5_pipe::test_an_extractor_names_the_preprocessor_it_applies
    - f5_pipe::test_naming_a_preprocessor_the_pipeline_does_not_define_is_refused_before_the_task_runs
- id: 5-2
  req: FR-5
  name: Dataset Views
  type: Core Functionality
  business: View operations narrow and reshape a source's dataset in the order written, and a seeded view reads the same items
    every time.
  conditions:
  - DataEval Flow installed
  - A small image folder and a small COCO dataset
  steps:
  - do: Build `ViewOperation` entries and stack them in a `ViewConfig`.
    expect: The operations construct and stack in order.
    tests:
    - f5_vcfg::test_view_operation_constructs
    - f5_vcfg::test_view_config_stacks_operations
  - do: Build a view with no name or operations, an operation with an unknown key, and two views of one name.
    expect: Each is refused.
    tests:
    - f5_vcfg::test_a_view_needs_a_name_and_operations
    - f5_vcfg::test_an_operation_with_an_unknown_key_is_refused
    - f5_vcfg::test_a_pipeline_defines_each_view_name_once
  - do: Give `Indices` a `{start, stop, step}` range, and then an incomplete range, an unknown key and a range of two million.
    expect: The range expands to the indices it names; the others are refused.
    tests:
    - f5_vcfg::test_an_index_range_expands_to_the_indices_it_names
    - f5_vcfg::test_an_index_range_that_is_incomplete_or_too_large_is_refused
  - do: Apply a `Limit` operation of 5 and of 500 to a dataset of 12, and read a source with no view.
    expect: The dataset has 5 items, 12 items, and 12 items.
    tests:
    - f5_vops::test_a_limit_operation_reduces_the_dataset_to_the_requested_size
    - f5_vops::test_a_source_without_a_view_reads_the_whole_dataset
  - do: Apply `ClassFilter` and `Limit` in both orders.
    expect: Filtering first gives four items of the class; limiting first leaves none of it.
    tests:
    - f5_vops::test_operations_apply_in_the_order_listed
  - do: Apply `ClassFilter`, `Reverse`, `Indices`, `SelectChannels` and `Relabel`.
    expect: Each selects, orders, slices, narrows or renames as its name says.
    tests:
    - f5_vops::test_class_filter_keeps_only_the_classes_named
    - f5_vops::test_reverse_and_indices_select_by_position
    - f5_vops::test_select_channels_keeps_the_channels_named
    - f5_vops::test_relabel_conforms_the_class_names_to_a_target
  - do: Give `Resize` and `Crop` their sizes as lists, as a YAML file writes them.
    expect: Both run, with the shapes asked for.
    tests:
    - f5_vops::test_resize_and_crop_take_the_lists_a_config_file_writes
  - do: Name an operation DataEval does not have, and apply `Limit` to a detection dataset.
    expect: The unknown operation is refused by name; the detection dataset keeps its boxes.
    tests:
    - f5_vops::test_an_operation_dataeval_does_not_have_is_refused
    - f5_vops::test_an_operation_works_on_detection_datasets_too
  - do: Load a seeded `Shuffle` and `Limit` view twice, and another seed.
    expect: The same seed gives the same items and another seed gives others; the shuffle is a permutation.
    tests:
    - f5_vrep::test_a_seeded_shuffle_view_is_the_same_each_time
    - f5_vrep::test_a_seeded_shuffle_is_a_permutation_of_the_dataset
  - do: Run the same seeded-view configuration twice, and an unseeded shuffle under two pipeline seeds.
    expect: Both runs give the same digest and the same label counts; the pipeline seed fixes the shuffle.
    tests:
    - f5_vrep::test_seeded_shuffle_view_pipeline_is_deterministic
    - f5_vrep::test_the_pipeline_seed_fixes_a_shuffle_that_has_none_of_its_own
  - do: Run a task over a source with a `ClassFilter` view.
    expect: The task reads only the filtered items, and its result records the view.
    tests:
    - f5_vrep::test_the_view_a_task_read_is_recorded_in_its_result
- id: 6-1
  req: FR-6
  name: Workflow and Evaluator Discovery
  type: Core Functionality
  business: A user can see which workflows and evaluators exist, and configurations name them by type.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Call `list_workflows()`.
    expect: The nine workflows are returned by name with a description.
    tests:
    - f6_wf::test_list_workflows_returns_the_nine_workflows_by_name
  - do: Call `get_workflow` with a known name, an unknown name and a retired name.
    expect: The known name gives its class; the others raise `ValueError` listing the installed workflows.
    tests:
    - f6_wf::test_get_workflow_returns_the_class_registered_under_the_name
    - f6_wf::test_get_workflow_unknown_raises
    - f6_wf::test_the_old_workflow_names_are_gone
  - do: Read the inputs and the result class of each workflow.
    expect: Each declares an `InputSpec` with a source count, and a `Result` class.
    tests:
    - f6_wf::test_a_workflow_declares_its_inputs_and_its_result_class
  - do: Call `list_evaluators()`, `get_evaluator()` with a known and an unknown name, and read each evaluator's inputs.
    expect: The 26 evaluators are returned by name; the unknown name raises `ValueError` listing the installed ones; each
      evaluator declares what it consumes and its result class.
    tests:
    - f6_ev::test_list_evaluators_returns_every_evaluator_by_name
    - f6_ev::test_get_evaluator_returns_the_class_registered_under_the_name
    - f6_ev::test_get_evaluator_unknown_raises
    - f6_ev::test_an_evaluator_declares_its_inputs_and_its_result_class
    - f6_ev::test_a_workflow_and_an_evaluator_may_share_a_name
  - do: Validate `workflows:` and `evaluators:` entries by `type`, an entry of the other kind, and entries with no `type`.
    expect: Each entry becomes the config class its type names and is named after it; the wrong kind and a missing type are
      refused.
    tests:
    - f6_ids::test_a_workflow_entry_is_validated_with_the_config_its_type_names
    - f6_ids::test_an_evaluator_entry_is_validated_with_the_config_its_type_names
    - f6_ids::test_an_entry_of_the_wrong_kind_is_refused
    - f6_ids::test_a_workflow_entry_needs_a_type_or_steps
  - do: Run `dataeval-flow workflows --json`, `evaluators --json`, `workflows quality` and `workflows nope`.
    expect: The listings match the library's; the schema of `quality`'s settings is printed; the unknown name is an error
      naming the installed workflows.
    tests:
    - f6_cli::test_workflows_lists_what_the_library_lists
    - f6_cli::test_evaluators_lists_what_the_library_lists_with_their_inputs
    - f6_cli::test_a_workflow_name_prints_the_schema_of_its_settings
    - f6_cli::test_an_unknown_workflow_name_is_an_error
- id: 6-2
  req: FR-6
  name: Tasks and Load-time Checks
  type: Core Functionality
  business: A task that cannot run is found when the configuration loads, before any data is read, with a message that says
    what to change.
  conditions:
  - DataEval Flow installed
  - A pipeline of two sources, an extractor, four workflows and four evaluators
  steps:
  - do: Validate a task that names a workflow, one that names an evaluator, both, and neither.
    expect: A task names exactly one; its `kind` is read from the key used; an empty key counts as absent.
    tests:
    - f6_kinds::test_a_task_naming_a_workflow_is_a_workflow_task
    - f6_kinds::test_a_task_naming_an_evaluator_is_an_evaluator_task
    - f6_kinds::test_a_task_names_exactly_one_of_the_two
    - f6_kinds::test_an_empty_key_counts_as_absent
  - do: Write a task, and a pipeline of workflow and evaluator tasks, back out and in again.
    expect: A task is written under the key it was read from, without a `kind`; the pipeline is equal.
    tests:
    - f6_kinds::test_a_task_is_written_back_under_the_key_it_was_read_from
    - f6_kinds::test_a_pipeline_round_trips_its_workflow_and_evaluator_tasks
  - do: Name sources as one name and as a list, name a source twice, leave `enabled` out, and use a task name twice.
    expect: Sources are read as a list; the repeated source and the repeated task name are refused; a task is enabled unless
      it says otherwise.
    tests:
    - f6_kinds::test_sources_are_one_name_or_a_list_and_always_read_as_a_list
    - f6_kinds::test_a_source_named_twice_is_refused
    - f6_kinds::test_a_task_is_enabled_unless_it_says_otherwise
    - f6_kinds::test_a_task_name_is_used_once
  - do: Split a pipeline over two files, with the task in one and the evaluator in the other.
    expect: The configuration loads once the files are merged.
    tests:
    - f6_kinds::test_a_task_in_a_file_names_a_workflow_that_another_file_defines
  - do: Validate one valid task of each kind.
    expect: Every one loads.
    tests:
    - f6_load::test_a_valid_task_of_each_kind_loads
  - do: Validate tasks that name an undefined workflow, an undefined evaluator, an evaluator as a workflow, and a workflow
      as an evaluator.
    expect: Each is refused naming the task, and the names that are defined.
    tests:
    - f6_load::test_a_task_naming_what_is_not_defined_is_refused
    - f6_load::test_the_error_lists_what_is_defined
  - do: Validate tasks that name too many or too few sources.
    expect: Each is refused, saying how many sources the workflow or evaluator takes and how many the task names.
    tests:
    - f6_load::test_a_task_naming_the_wrong_number_of_sources_is_refused
  - do: Validate tasks that need an extractor and name none, and tasks that name one they do not use.
    expect: The first are refused with the advice to name one with `extractor:`; the others with the advice to remove it.
    tests:
    - f6_load::test_a_task_that_needs_an_extractor_and_names_none_is_refused
    - f6_load::test_a_task_that_uses_no_extractor_but_names_one_is_refused
  - do: Validate a duplicates task in cluster mode with two sources.
    expect: 'It is refused: cluster mode reads one source.'
    tests:
    - f6_load::test_a_setting_that_limits_the_source_count_is_checked_too
  - do: Load a configuration file whose task is refused.
    expect: '`load_config` raises the error; nothing was run.'
    tests:
    - f6_load::test_every_problem_is_found_by_loading_the_file_not_by_running_it
  - do: Run a task that is not in the configuration and names too many sources; call `run()` with too many datasets or without
      the extractor an evaluator needs.
    expect: '`run_task` returns a failed result with the same message; `run` raises `ValidationError` before anything runs.'
    tests:
    - f6_load::test_a_task_run_directly_is_checked_and_fails_with_the_same_message
    - f6_load::test_run_checks_the_data_against_the_config_before_anything_runs
- id: 6-3
  req: FR-6
  name: Running Tasks
  type: Core Functionality
  business: A configured set of tasks runs in order and returns a result for each, even when one of them fails.
  conditions:
  - DataEval Flow installed
  - A pipeline over an image folder with workflow, evaluator and disabled tasks
  - An example plug-in with a workflow and an evaluator that can be told to fail
  steps:
  - do: Call `run_tasks` on a pipeline with a workflow task, two evaluator tasks and a disabled task.
    expect: A result is returned for each enabled task, keyed by task name, in configuration order.
    tests:
    - f6_run::test_run_tasks_returns_one_result_per_enabled_task_keyed_by_name
  - do: Read each result's class, `kind` and `type`, its metadata, and its report.
    expect: The workflow gives a `ChainResult` and each evaluator its own result class; every result carries the tool, its
      version, the dataset and the source descriptions; the report is text.
    tests:
    - f6_run::test_each_result_is_of_the_kind_and_type_its_task_ran
    - f6_run::test_every_result_carries_the_metadata_envelope
    - f6_run::test_a_result_reports_as_text
  - do: Run the pipeline with the wrong data root, and then the right one; run it twice.
    expect: Relative paths are resolved against `data_dir`; the two runs give the same results.
    tests:
    - f6_run::test_relative_paths_in_the_config_resolve_against_data_dir
    - f6_run::test_a_run_of_a_config_is_repeatable
  - do: Select one task, several tasks (one named twice), and a disabled task.
    expect: Only the tasks named run, in the order given and once each; a disabled task runs when named.
    tests:
    - f6_sel::test_naming_one_task_runs_only_it
    - f6_sel::test_naming_several_runs_them_in_the_order_given_once_each
    - f6_sel::test_naming_a_task_runs_it_though_it_is_disabled
  - do: Select a task that does not exist, run a pipeline with no tasks, and one whose tasks are all disabled.
    expect: '`ValueError` is raised: the first lists the tasks that exist.'
    tests:
    - f6_sel::test_an_unknown_task_name_is_refused_naming_the_tasks
    - f6_sel::test_a_pipeline_with_no_tasks_is_refused
    - f6_sel::test_a_pipeline_whose_tasks_are_all_disabled_is_refused
  - do: Call `run_task` with a task name, with a disabled task, with a task the configuration does not hold, and with an unknown
      name.
    expect: It returns the task's result itself rather than a mapping; the unknown name is refused.
    tests:
    - f6_sel::test_run_task_runs_one_task_and_returns_its_result_not_a_mapping
    - f6_sel::test_run_task_runs_a_task_though_it_is_disabled
    - f6_sel::test_run_task_takes_a_task_the_config_does_not_hold
    - f6_sel::test_run_task_with_an_unknown_name_is_refused
  - do: Run five tasks, two of which fail, with an `on_result` callback.
    expect: The callback is called for each task, in order, after it finishes and before the next starts, with the same result
      objects `run_tasks` returns.
    tests:
    - f6_cb::test_on_result_is_called_with_each_task_as_soon_as_it_finishes
    - f6_cb::test_on_result_gets_the_same_objects_run_tasks_returns
  - do: Run a pipeline whose second task names a source that does not exist, with a callback.
    expect: '`run_tasks` raises; the callback already has the first task''s result.'
    tests:
    - f6_cb::test_what_finished_is_kept_when_a_later_task_cannot_be_set_up
  - do: Run a pipeline in which an evaluator task and a workflow task raise.
    expect: Each gives a failed result, the tasks before and after them succeed, and all five results are returned.
    tests:
    - f6_fail::test_a_failing_task_is_recorded_in_its_result_and_the_remaining_tasks_run
    - f6_fail::test_a_failure_in_the_first_task_does_not_stop_the_next
  - do: Read a failed evaluator result and a failed workflow result.
    expect: '`success` is false, `errors` names the error (and the step for a workflow), reading `output` raises, and the
      report shows the failure.'
    tests:
    - f6_fail::test_a_failed_evaluator_result_names_the_error_and_refuses_to_give_output
    - f6_fail::test_a_failed_workflow_result_names_the_step_that_failed
  - do: Read a failed result's metadata, and compare a task run after failures with the same task alone.
    expect: The failed result keeps the envelope; the later task's result is the same as when run alone.
    tests:
    - f6_fail::test_a_failed_result_still_carries_the_envelope
    - f6_fail::test_a_task_after_a_failure_gives_the_result_it_gives_alone
  - do: Run a task that names a source or an extractor the pipeline does not define, and a source whose dataset does not exist.
    expect: '`ValueError` names the ones that are defined; the dataset loader''s error is raised; none is recorded as a failed
      result.'
    tests:
    - f6_cfgerr::test_a_task_naming_a_source_or_extractor_the_pipeline_lacks_raises
    - f6_cfgerr::test_a_source_naming_a_dataset_that_does_not_load_raises_the_loaders_error
  - do: Call `run` with a duplicates config and one dataset, a quality config, and several datasets in a mapping.
    expect: It returns `DuplicatesResult` and `ChainResult`; the sources keep the order of the mapping.
    tests:
    - f6_runfn::test_run_returns_the_result_class_of_the_config
    - f6_runfn::test_run_takes_a_workflow_config_and_returns_its_chain
    - f6_runfn::test_run_names_the_sources_of_a_mapping_in_the_order_given
  - do: Run the same evaluator with `run` and as a task of a pipeline; call `run` with no datasets and with a config that
      raises.
    expect: The two outputs are equal; no datasets are refused; the failure is a failed result of the config's result class.
    tests:
    - f6_runfn::test_run_matches_the_same_task_run_in_a_pipeline
    - f6_runfn::test_run_refuses_no_datasets
    - f6_runfn::test_a_run_that_raised_returns_a_failed_result_of_the_configs_class
- id: 6-4
  req: FR-6
  name: Plug-in Workflows and Evaluators
  type: Integration
  business: A package can add workflows and evaluators that configurations name and tasks run like built-in ones, and a broken
    package cannot break the others.
  conditions:
  - DataEval Flow installed
  - An example plug-in with a workflow, an evaluator, an extractor and a transform, served as entry points
  steps:
  - do: Install the example plug-in and list workflows, evaluators, extractors and transforms.
    expect: Its types are listed beside the built-in ones, and found by `get_workflow` and `get_evaluator`.
    tests:
    - f6_inst::test_every_installed_kind_is_listed_beside_the_built_ins
    - f6_inst::test_get_workflow_and_get_evaluator_find_an_installed_type
  - do: Install the plug-in as package metadata (a `.dist-info` folder on the path), without patching anything.
    expect: The registries find it through `importlib.metadata`, and the example workflow runs.
    tests:
    - f6_inst::test_an_installed_type_is_found_through_real_package_metadata
  - do: Validate entries of the plug-in's types from a YAML file, with a bad value, with an unknown key, and write them back.
    expect: The entries become the plug-in's config classes; bad values are refused; a dump keeps the plug-in's own settings.
    tests:
    - f6_inst::test_an_installed_type_validates_from_a_config_file
    - f6_inst::test_an_installed_types_own_settings_are_validated_and_kept_in_a_dump
  - do: Run tasks of the plug-in's workflow and evaluator; run the evaluator with `run`.
    expect: They run as built-in types do, with the plug-in's result classes and its warnings.
    tests:
    - f6_inst::test_an_installed_workflow_runs_as_a_task_like_a_built_in
    - f6_inst::test_an_installed_evaluator_runs_as_a_task_and_in_memory
  - do: Name the plug-in's workflow in a task with two sources.
    expect: The task is refused at load, against the inputs the plug-in declares.
    tests:
    - f6_inst::test_a_task_naming_an_installed_type_is_checked_against_its_inputs
  - do: Use a plug-in class that has not been registered as an entry point.
    expect: It is not found, and the error says that a plug-in is found only through an entry point.
    tests:
    - f6_inst::test_a_class_that_is_defined_but_not_registered_is_not_found
  - do: Register a plug-in that cannot be imported.
    expect: It is left out of the listing with the reason logged, the others keep working, and looking it up or naming it
      in a configuration gives the reason.
    tests:
    - f6_ref::test_a_plugin_that_fails_to_load_is_left_out_and_the_rest_keep_working
    - f6_ref::test_a_configuration_naming_a_plugin_that_failed_to_load_says_why
  - do: Register plug-ins that take a built-in workflow's or evaluator's name, and two that claim one name.
    expect: The built-in keeps its name and the clash is logged; neither of two rival plug-ins is registered.
    tests:
    - f6_ref::test_a_plugin_cannot_take_a_built_ins_name
    - f6_ref::test_two_plugins_claiming_one_name_are_both_refused
  - do: Register a plug-in under another name than its own, one that is not a workflow, one whose config configures another
      type, and one whose config declares no inputs.
    expect: Each is refused with the reason.
    tests:
    - f6_ref::test_a_plugin_registered_under_another_name_than_its_own_is_refused
    - f6_ref::test_a_plugin_that_is_not_a_workflow_is_refused
    - f6_ref::test_a_plugin_whose_config_configures_another_type_is_refused
    - f6_ref::test_a_plugin_whose_config_declares_no_inputs_is_refused
- id: 7-1
  req: FR-7
  name: Quality Preset
  type: Core Functionality
  business: A dataset can be checked for outliers and duplicates, and the data without them taken forward.
  conditions:
  - DataEval Flow installed
  - In-memory classification images with one solid-white outlier and one exact duplicate pair, a version with a near duplicate,
    and a detection dataset
  steps:
  - do: Run `quality` on 60 images in which image 7 is solid white and image 5 is a copy of image 0.
    expect: The findings Image Outliers (1 image), Class Outliers and Image Duplicates (2 exact, 0 near, warning) are reported;
      the `outliers` output names item 7 and the `duplicates` output the group [0, 5].
    tests:
    - f7_quality::test_planted_outlier_and_duplicate_are_found_and_reported
  - do: Run it again with image 9 a one-pixel edit of image 3.
    expect: The duplicates finding reads 2 exact and 2 near, and `clean` also drops image 9.
    tests:
    - f7_quality::test_near_duplicates_are_found_and_removed_with_the_exact_ones
  - do: Read the `clean` step's dataset.
    expect: It holds every image but 5 and 7, and its details say 2 items were removed, 1 named by `duplicates` and 1 by `outliers`;
      `run()` returns the same dataset.
    tests:
    - f7_quality::test_clean_removes_flagged_images_and_all_but_the_first_duplicate
    - f7_quality::test_run_returns_the_chain_and_the_cleaned_dataset
  - do: Run `quality` on object-detection data.
    expect: A Target Outliers finding judges the boxes; `clean` keeps every image and removes the flagged boxes, so the box
      count falls by the number of detections it reports removing.
    tests:
    - f7_quality::test_detection_data_is_judged_per_box_and_clean_removes_boxes_not_images
  - do: Set `image-outliers` to a warning of 1.0, and then every threshold to `null`.
    expect: The 1.7% outlier share warns under 1.0 and is information under the default 3.0; with `null` thresholds every
      finding is information, health is ok, and `clean` removes the same images. Settings reach the evaluators and checks
      they name.
    tests:
    - f7_quality::test_a_threshold_set_in_checks_decides_whether_a_finding_warns
    - f7_quality::test_settings_reach_the_evaluators_they_name
  - do: Load an entry with no `outliers` block, with a removed `metadata_exclude` setting, with a `class-imbalance` check,
      and with `cluster_threshold` but no extractor.
    expect: Each is refused when the configuration loads.
    tests:
    - f7_quality::test_outlier_settings_are_required_and_unknown_settings_are_refused
    - f7_quality::test_cluster_outliers_without_an_extractor_are_refused_when_the_config_loads
- id: 7-2
  req: FR-7
  name: Bias Preset
  type: Core Functionality
  business: A dataset's class balance and the relation of its metadata to the class can be judged without embedding a single
    image.
  conditions:
  - DataEval Flow installed, no extractor configured
  - In-memory images in three classes (5:3:2) whose `site` factor follows the class except on every tenth item
  steps:
  - do: Run `bias` on the dataset.
    expect: Class Imbalance (3 classes, 90 items, 2.5:1, information), Shortcut Risk, Factor Parity and Factor Coverage Gaps
      are reported, the last three as warnings.
    tests:
    - f7_bias::test_balance_shortcuts_parity_and_gaps_are_judged_without_an_extractor
  - do: Read which factors the findings name.
    expect: Only `site` is named; `angle` is not. The gaps are class-site combinations that no item has.
    tests:
    - f7_bias::test_only_the_factor_that_follows_the_class_is_named
  - do: 'Run it on a 9:1 two-class dataset, with and without `class-imbalance: {warning: 10.0}`.'
    expect: The 9.0:1 ratio warns by default and does not warn once the limit is 10.0.
    tests:
    - f7_bias::test_class_imbalance_warns_past_its_ratio
  - do: 'Declare a class (`owl`) that has no labels, with and without `empty: false`.'
    expect: It warns by default and not when `empty` is false.
    tests:
    - f7_bias::test_a_declared_class_with_no_labels_warns_unless_empty_is_false
  - do: Raise the `shortcut-risk`, `factor-parity` and `factor-coverage-gaps` thresholds.
    expect: None of the three warns and health is ok.
    tests:
    - f7_bias::test_thresholds_in_checks_decide_whether_a_factor_warns
  - do: Write crossed bands for `class-imbalance` (`info` 3.0 over `warning` 2.0).
    expect: The entry is refused where the bands were written.
    tests:
    - f7_bias::test_crossed_class_imbalance_bands_are_refused_where_they_were_written
  - do: Run it on images with no metadata factors.
    expect: Class Imbalance is judged and the three factor findings read `not assessed`.
    tests:
    - f7_bias::test_a_dataset_with_no_metadata_factors_still_judges_its_class_balance
  - do: 'Set `factor-gaps: false`.'
    expect: The gap analysis and its check are not run and only three findings remain.
    tests:
    - f7_bias::test_factor_gaps_false_leaves_out_the_gap_analysis_and_its_check
- id: 7-3
  req: FR-7
  name: Metadata Triage
  type: Core Functionality
  business: Metadata that cannot be read, or whose bins nobody pinned, is found before it silently weakens an analysis, and
    a policy that fixes it is proposed.
  conditions:
  - DataEval Flow installed
  - In-memory datasets with a weight column mixing numbers and comma-written numerals, a latitude column with `N` and `S`
    markers, a continuous altitude, and a fixed three-valued weather
  steps:
  - do: Run `triage` on the mixed weight column.
    expect: Unreadable factors warns (1 factor, `mixed_types`, 6 text and 54 numeric reads), the chain is `factor-triage`
      then `factor-issues`, and the suggested policy drops the comma.
    tests:
    - f7_triage::test_a_column_mixing_numbers_and_text_is_reported_unreadable_and_a_repair_is_suggested
  - do: 'Read the verification, then run with `verify: false`.'
    expect: 'The suggestion is applied and `weight` is recovered; with `verify: false` there is no Verified finding.'
    tests:
    - f7_triage::test_the_suggested_repair_is_verified_by_reading_the_data_again
    - f7_triage::test_verify_false_skips_the_second_reading
  - do: Run it on a numeric column with `N` and `S` markers.
    expect: The markers are located with their counts; the suggested remap leaves each answer blank and is not applied, for
      the user to decide.
    tests:
    - f7_triage::test_marker_values_in_a_numeric_column_are_located_and_left_for_the_user_to_answer
  - do: Run it on a clean continuous factor with no bins pinned.
    expect: Unpinned continuous bins is information and suggests a bin count; health stays ok.
    tests:
    - f7_triage::test_a_continuous_factor_without_bins_is_reported_with_a_bin_count_suggestion
  - do: Read the recommended policy for a continuous factor and a categorical one.
    expect: It pins four open-ended edges for the continuous factor and the three levels of the categorical one, and the report
      cautions that the policy can be invalid or misleading.
    tests:
    - f7_triage::test_the_recommended_policy_pins_the_cuts_and_levels_read_from_the_data
  - do: Declare the suggested policy under `metadata:` and run `triage` again on the mixed column.
    expect: There is no Unreadable factors finding, health is ok and `weight` is among the factors read.
    tests:
    - f7_triage::test_the_suggested_policy_makes_a_mixed_column_readable
  - do: Declare the recommended policy and run `triage` again on the marker, continuous and categorical data.
    expect: Each run makes no findings and reads its one factor.
    tests:
    - f7_triage::test_a_run_under_the_recommended_policy_has_nothing_left_to_report
  - do: Read the result's metadata binning record.
    expect: It lists `weight` as unusable and its encoding digest equals the result's.
    tests:
    - f7_triage::test_the_result_records_the_encoding_triage_read
  - do: Run it on images with no metadata, and set `max_examples` to 3.
    expect: 'No findings are made; with `max_examples: 3` the report shows 3 of the 54 numeric reads and says `+51 more`,
      with the same severity.'
    tests:
    - f7_triage::test_a_dataset_with_no_metadata_makes_no_findings
    - f7_triage::test_max_examples_limits_the_values_shown_per_factor
  - do: Write a removed `metadata_exclude` setting.
    expect: The entry is refused.
    tests:
    - f7_triage::test_settings_that_were_removed_are_refused
- id: 8-1
  req: FR-8
  name: Scope Preset
  type: Core Functionality
  business: A dataset can be assessed for how completely it spans embedding space and how its classes compare with what was
    meant to be collected.
  conditions:
  - DataEval Flow installed
  - In-memory images in three classes (5:3:2) with a fourth, `owl`, declared and never labelled; a detection dataset with
    two 8-pixel boxes and one 2-pixel box per image
  - The flatten extractor
  steps:
  - do: Run `scope` with an extractor.
    expect: Class Coverage (1 uncovered image), Dimensional Completeness (0.368, a warning under 0.5) and Class Shortfall
      (2 classes short) are reported, and all seven steps run.
    tests:
    - f8_scope::test_embedding_coverage_completeness_and_the_class_worklist_are_judged_with_an_extractor
  - do: Run it with no extractor.
    expect: Class Coverage and Dimensional Completeness read `not assessed`, the coverage and completeness steps are skipped
      with `requires an extractor`, and Class Shortfall is still judged.
    tests:
    - f8_scope::test_without_an_extractor_the_embedding_findings_are_not_assessed_and_the_worklist_still_runs
  - do: Read the worklist rows.
    expect: '`owl` is `acquire` (0 of 22) and `bird` is `augment` (18 of 22).'
    tests:
    - f8_scope::test_the_worklist_names_each_class_short_of_an_even_spread_and_what_to_do_about_it
  - do: Give `bird` an expected share of 0.4 (and a name not in the dataset).
    expect: '`bird` is held to 36, the others keep an even share, the unknown name is ignored and the finding warns.'
    tests:
    - f8_scope::test_expected_shares_replace_the_even_spread_for_the_classes_they_name
  - do: Make every image of one class one picture plus a little noise.
    expect: Class Coverage warns with `1 clustered`, and that class's dispersion is under 0.5.
    tests:
    - f8_scope::test_a_class_whose_images_barely_vary_is_flagged_as_clustered
  - do: 'Lower the Dimensional Completeness thresholds, use naive coverage, and set `completeness: false`.'
    expect: The completeness finding no longer warns; naive coverage adds Uncovered Items; completeness steps and finding
      disappear.
    tests:
    - f8_scope::test_thresholds_in_checks_decide_whether_a_finding_warns
    - f8_scope::test_naive_coverage_adds_the_uncovered_items_check
    - f8_scope::test_completeness_false_leaves_out_the_completeness_steps
  - do: 'Run it on detection data with `min_size: 4`, with no `min_size`, with padding, and on classification data.'
    expect: 30 tiny boxes are dropped and coverage is measured on the 60 crops; with no minimum all 90 boxes are cropped;
      padding of 0.25 widens each 8-pixel crop to 12; classification data passes through unchanged.
    tests:
    - f8_scope::test_detections_are_cropped_and_coverage_is_measured_on_the_crops
    - f8_scope::test_without_a_minimum_size_every_box_is_cropped
    - f8_scope::test_crop_padding_widens_each_crop
    - f8_scope::test_classification_data_passes_through_the_crop_step_unchanged
  - do: Write `ontology:` on a `scope` entry.
    expect: It is refused, and the message names `taxonomy`.
    tests:
    - f8_scope::test_an_ontology_is_refused_and_points_to_the_taxonomy_preset
- id: 8-2
  req: FR-8
  name: Taxonomy Preset
  type: Core Functionality
  business: A dataset's labels can be checked against the label space it is meant to use, and a class nobody collected is
    named.
  conditions:
  - DataEval Flow installed; the `ontology` extra for the RDF file
  - In-memory images labelled cat, dog and bird, and an ontology of animals with the leaves cat, dog, bird and owl
  steps:
  - do: Run `taxonomy` with an inline ontology.
    expect: Leaf Coverage (75.0%, `owl` to acquire), Label Conformance (conforms), Label Mergeability (ok) and Ontology Structure
      (7 concepts, 4 leaves) are reported in that order.
    tests:
    - f8_tax::test_leaf_coverage_conformance_alignment_and_structure_are_judged
  - do: Label one class `doge`, which the ontology lacks.
    expect: Label Conformance warns (1 unmatched), the reconciliation names `doge`, and the alignment is `partial` with `doge`
      unaligned.
    tests:
    - f8_tax::test_a_class_name_the_ontology_does_not_contain_fails_conformance_and_alignment
  - do: Set the leaf-coverage thresholds to `null` and allow one unmatched name.
    expect: Leaf Coverage is information and Label Conformance is ok.
    tests:
    - f8_tax::test_thresholds_in_checks_decide_whether_a_finding_warns
  - do: Give `cat` an expected share of 0.9.
    expect: The worklist holds `cat` to 27 of 30 items.
    tests:
    - f8_tax::test_expected_shares_set_each_named_class_its_own_target
  - do: Set a lowercase `label_pattern` on an ontology with capitalised labels.
    expect: The structure output lists the labels that break it and the finding counts them.
    tests:
    - f8_tax::test_the_label_pattern_reports_concept_labels_that_break_it
  - do: Read the ontology from a Turtle file under the data root.
    expect: The same findings are made; concept identifiers are the file's URIs.
    tests:
    - f8_tax::test_an_ontology_can_be_read_from_an_rdf_file_under_the_data_root
  - do: Name an `ontologies:` entry whose concept `cat` has the synonym `kitty`, on data whose class is `kitty`.
    expect: The class conforms through the synonym and the alignment is lossless.
    tests:
    - f8_tax::test_an_ontologies_entry_with_concepts_and_synonyms_defines_the_label_space
  - do: Conform the source with the alignment's `Relabel` stanza and run `taxonomy` again.
    expect: Both runs carry the same label space digest, the second records the source's remap, and it conforms.
    tests:
    - f8_tax::test_the_alignment_stanza_conforms_the_source_and_the_label_space_digest_joins_the_runs
  - do: Write an entry with no ontology, and one naming a file that does not exist.
    expect: The first is refused when the configuration loads; the second fails the task with a message naming the file.
    tests:
    - f8_tax::test_an_ontology_is_required
    - f8_tax::test_an_ontology_file_that_cannot_be_read_fails_the_task_naming_the_file
- id: 9-1
  req: FR-9
  name: Drift Detection
  type: Core Functionality
  business: A new batch of data can be tested against a reference to see whether it has drifted, as a whole, chunk by chunk
    and class by class.
  conditions:
  - DataEval Flow installed
  - A reference of 60 random images, a source drawn the same way, and a source with a colour cast
  - The flatten extractor and a pipeline seed
  steps:
  - do: Run `shift` with each of `drift-univariate`, `drift-mmd` and `drift-kneighbors`.
    expect: The source like the reference is `no drift` (ok) and the colour-cast source is `drift` (warning); the detector's
      output agrees.
    tests:
    - f9_drift::test_a_source_like_the_reference_is_not_drifted_and_a_colour_cast_source_is
  - do: Run it with `drift-domain-classifier`.
    expect: The colour-cast source is told apart with an AUROC of 1.0.
    tests:
    - f9_drift::test_the_domain_classifier_tells_the_colour_cast_source_apart_perfectly
  - do: Run two named detectors over two test sources.
    expect: There is one finding per detector and test source, in detector order, and the step runs once per test source against
      the reference.
    tests:
    - f9_drift::test_each_detector_judges_every_test_source_against_the_first_source
  - do: Swap the reference and the test source.
    expect: 'The first source is the reference: the plain images are what drifted.'
    tests:
    - f9_drift::test_the_first_source_is_the_reference
  - do: Run `shift` with no `detectors:`, and with one source or no extractor.
    expect: Univariate drift and K-neighbors OOD run with their checks; one source or no extractor is refused.
    tests:
    - f9_drift::test_without_detectors_it_runs_univariate_drift_and_k_neighbors_ood
    - f9_drift::test_a_shift_task_needs_an_extractor_and_two_sources
  - do: 'Set `warn_on_drift: false`.'
    expect: Drift is still reported but the finding is information and health is ok.
    tests:
    - f9_drift::test_warn_on_drift_false_reports_drift_without_warning
  - do: Read a test source of 90 images (the last 30 colour-cast) as 3 chunks, and as chunks of 10.
    expect: Chunks 0 to 29 and 30 to 59 do not drift and 60 to 89 does; the finding says `1/3 chunks drifted` and warns; chunks
      of 10 give 9 chunks and `3/9`.
    tests:
    - f9_chunk::test_each_chunk_has_its_own_verdict
    - f9_chunk::test_chunk_size_sets_the_chunks_by_their_length
  - do: Raise `chunk_percent` to 50, and set `consecutive_chunks`.
    expect: A third of the chunks drifting is information under 50%; two chunks in a row do not warn at the default 2 and
      do at 1.
    tests:
    - f9_chunk::test_chunk_percent_is_the_share_of_drifting_chunks_that_warns
    - f9_chunk::test_consecutive_chunks_warns_on_a_run_of_drifting_chunks
  - do: 'Add `classwise: {mmd: class}`.'
    expect: The detector also runs for cat, dog and bird, and the rolled-up finding reads `3/3 classes warn`.
    tests:
    - f9_class::test_a_detector_also_runs_once_per_class_and_the_verdicts_roll_up
  - do: 'Set `min_items: 30`, then group the classes into `pets` and `wild`.'
    expect: Only `cat` runs and the output says why `dog` and `bird` were left out; the groups give `2/2 groups warn`.
    tests:
    - f9_class::test_a_class_with_too_few_items_is_left_out_and_the_output_says_why
    - f9_class::test_classes_can_be_grouped
  - do: Name an OOD or unknown detector under `classwise`, and two detectors with one name.
    expect: Each is refused when the configuration loads.
    tests:
    - f9_class::test_only_drift_detectors_may_run_by_class
    - f9_class::test_two_detectors_may_not_share_a_name
- id: 9-2
  req: FR-9
  name: Out-of-Distribution Detection
  type: Core Functionality
  business: Individual images that do not belong to the reference's distribution can be flagged, and what sets them apart
    explained.
  conditions:
  - DataEval Flow installed
  - A reference and a test source of 60 images whose last 30 have a colour cast and a higher `exposure`
  - The flatten extractor and a pipeline seed
  steps:
  - do: Run `shift` with `ood-kneighbors` on a source like the reference and a colour-cast source.
    expect: Each test image has an `instance_score` and an `is_ood` flag; every colour-cast image is flagged and few of the
      others.
    tests:
    - f9_ood::test_every_test_image_gets_a_score_and_a_flag
  - do: Read the check's findings.
    expect: '`3/60 images OOD (5.0%)` is information and `60/60 images OOD (100.0%)` is a warning.'
    tests:
    - f9_ood::test_the_check_reports_the_share_of_images_flagged_per_test_source
  - do: Compare dark and bright noise with `distance_metric` cosine and euclidean.
    expect: Cosine flags none of the bright images and euclidean flags all 60.
    tests:
    - f9_ood::test_the_distance_metric_decides_what_counts_as_different
  - do: Run `ood-domain-classifier` on a source whose second half has a colour cast.
    expect: Exactly the second half is flagged.
    tests:
    - f9_ood::test_the_domain_classifier_flags_the_images_it_tells_apart_from_the_reference
  - do: Run `ood-kneighbors` and `ood-domain-classifier` together.
    expect: The union lists the 30 images both flagged and the one image only the first flagged, and OOD Agreement reports
      both.
    tests:
    - f9_agree::test_detectors_are_compared_on_which_images_they_flag
  - do: Run one OOD detector, and one drift detector alone.
    expect: One OOD detector gives no agreement step, and drift detectors alone add none of the OOD steps.
    tests:
    - f9_agree::test_agreement_needs_two_detectors_and_the_union_needs_an_ood_detector
  - do: Read `factor-predictors` and `factor-deviation`.
    expect: Factors are ranked best first; `exposure` and brightness score above 0.9 and the class under 0.5. Every agreed
      image deviates more than 3 standard deviations on `exposure`.
    tests:
    - f9_factors::test_factor_predictors_ranks_the_factors_that_separate_flagged_images_from_the_rest
    - f9_factors::test_factor_deviation_says_how_far_each_agreed_image_sits_from_the_reference_on_each_factor
  - do: 'Set `factor-predictors: false` and `factor-deviation: false`; run on a source with no agreed image.'
    expect: Those steps are not run; without an agreed image the factor-deviation output is empty and gives its reason.
    tests:
    - f9_factors::test_factor_steps_can_be_left_out
    - f9_factors::test_a_test_source_with_no_agreed_image_explains_nothing
- id: 9-3
  req: FR-9
  name: Drift in Model Uncertainty
  type: Integration
  business: Drift can be detected without labels, from whether a deployed model has become less sure of incoming data.
  conditions:
  - DataEval Flow installed with the `onnx` extra
  - A small ONNX classifier and its DataEval metadata file under the data root
  steps:
  - do: Use the `uncertainty` extractor with `drift-univariate` on a reference, a similar source and a brighter source.
    expect: The similar source shows no drift in the model's uncertainty and the bright source does.
    tests:
    - f9_unc::test_a_source_the_model_is_less_sure_of_drifts_in_its_uncertainty
  - do: 'Give one detector `extractor: unc` while the task''s extractor is the flatten extractor.'
    expect: That detector tests uncertainty and the other tests the flattened pixels; both find the drift.
    tests:
    - f9_unc::test_a_detector_may_name_its_own_extractor_beside_the_tasks
  - do: 'Set `classwise: {ks: predicted}`.'
    expect: The detector runs once per class the model predicts and the rolled-up finding reads `1/1 predicted classes warn`
      for the bright source.
    tests:
    - f9_unc::test_by_predicted_runs_a_drift_detector_once_per_class_the_model_predicts
  - do: Give the extractor to an evaluator task that needs one embedding per item.
    expect: 'The pipeline is refused: only drift and OOD evaluators read it.'
    tests:
    - f9_unc::test_an_evaluator_that_needs_one_embedding_per_item_refuses_the_extractor
  - do: Run with a data root that holds no model.
    expect: The task fails with an error naming the model or its metadata file.
    tests:
    - f9_unc::test_the_model_and_its_metadata_are_read_from_the_data_root
- id: 10-1
  req: FR-10
  name: Splits Preset
  type: Core Functionality
  business: A dataset can be split reproducibly for training and evaluation, and each part's class balance checked against
    the whole.
  conditions:
  - DataEval Flow installed
  - 100 in-memory images (50 cat, 30 dog, 20 bird) in ten scenes of ten, every scene holding every class
  steps:
  - do: Run `splits` with the defaults.
    expect: '`train`, `val` and `test` are disjoint, together hold items 0 to 99, and `test` has 20.'
    tests:
    - f10_splits::test_the_parts_are_disjoint_and_together_hold_every_item
  - do: 'Run it twice, then with `test_frac: 0.25` and with `stratify: false`.'
    expect: Two runs give identical splits; 0.25 holds out 25 and each other setting gives a different split.
    tests:
    - f10_splits::test_the_same_settings_give_the_same_split_and_other_settings_give_another
  - do: Compare a stratified and an unstratified split with 25% test and 25% validation.
    expect: Class Stratification reads `max deviation 3.3pp` (information) stratified and `16.7pp` (warning) unstratified.
    tests:
    - f10_splits::test_each_part_s_class_shares_are_judged_against_the_whole
  - do: 'Set `info: 1.0` and `warning: 3.0` under `class-stratification`.'
    expect: The 3.3-point deviation warns.
    tests:
    - f10_splits::test_thresholds_in_checks_decide_whether_a_deviation_warns
  - do: 'Run it with `folds: 4`.'
    expect: There are 4 train and 4 validation sets and one test set of 20; the validation sets tile the non-test items without
      overlap, no train set meets its validation or the test, and each fold has its own stratification finding.
    tests:
    - f10_splits::test_folds_make_that_many_train_and_validation_sets_and_one_shared_test
  - do: 'Run it with `split_on: [scene]`.'
    expect: No scene appears in two parts and every item is placed.
    tests:
    - f10_splits::test_split_on_keeps_each_value_of_a_factor_in_one_part
  - do: 'Run it with `rebalance: interclass`.'
    expect: The train set's class counts (cat 37, dog 22, bird 15) become near even in the rebalanced view.
    tests:
    - f10_splits::test_rebalancing_makes_the_trained_on_part_more_even_than_the_split_one
  - do: Read `parts.train` from a step of a custom workflow.
    expect: The following step receives the train set.
    tests:
    - f10_splits::test_a_custom_workflow_reads_the_parts_as_the_steps_train_val_and_test
  - do: 'Write a split that holds nothing out, `val_frac` with `folds`, and `folds: 0`; run on 6 items with 3 folds.'
    expect: The first three are refused when the configuration loads; the last fails the `split` step with an error about
      stratifying.
    tests:
    - f10_splits::test_a_split_that_holds_nothing_out_is_refused
    - f10_splits::test_val_frac_with_folds_and_no_folds_are_refused
    - f10_splits::test_too_few_items_to_stratify_fail_the_split_step
- id: 10-2
  req: FR-10
  name: Prioritization Preset
  type: Core Functionality
  business: Unlabeled data can be ranked by how much it differs from what is already held, and the most valuable part chosen
    for labeling.
  conditions:
  - DataEval Flow installed
  - A reference of 40 images and a pool of 40 whose first 20 resemble it and whose last 20 have a colour cast
  - The flatten extractor
  steps:
  - do: 'Run `prioritization` with `method: knn`.'
    expect: Every pool item is ranked once; the 20 colour-cast items come first; the chain has two steps and makes no findings.
    tests:
    - f10_prio::test_hard_first_ranks_the_items_least_like_the_reference_first
  - do: 'Set `order: easy_first`.'
    expect: The 20 items that resemble the reference come first.
    tests:
    - f10_prio::test_easy_first_reverses_the_order
  - do: 'Read `selected` with no `select`, with `n: 5`, `n: 100` and `fraction: 0.21`.'
    expect: It holds the whole pool in ranked order, the top 5, the whole pool, and the top 9 (0.21 of 40 rounded up).
    tests:
    - f10_prio::test_selected_keeps_every_item_in_ranked_order_unless_told_otherwise
    - f10_prio::test_select_n_keeps_that_many_of_the_top_items
    - f10_prio::test_select_n_larger_than_the_pool_keeps_the_whole_pool
    - f10_prio::test_select_fraction_keeps_its_share_rounded_up
  - do: Write `select` with both `n` and `fraction`.
    expect: The entry is refused.
    tests:
    - f10_prio::test_n_and_fraction_together_are_refused
  - do: Give the task two pools.
    expect: Each pool is ranked on its own against the one reference and selected separately.
    tests:
    - f10_prio::test_each_pool_is_ranked_on_its_own_against_the_one_reference
  - do: Use the `stratified` and `class_balanced` policies and the k-means and HDBSCAN methods.
    expect: Each ranks the whole pool.
    tests:
    - f10_prio::test_other_methods_and_policies_rank_the_whole_pool
  - do: Write an unsupported policy, method and order; name one source, or no extractor.
    expect: Each is refused when the configuration loads.
    tests:
    - f10_prio::test_an_unsupported_policy_method_or_order_is_refused
    - f10_prio::test_a_task_needs_a_reference_and_a_pool_and_an_extractor
  - do: Run `quality` on the pool in a custom workflow and rank `pool-clean.clean`.
    expect: The planted duplicate and outlier never reach the ranking.
    tests:
    - f10_prio::test_cleaning_each_pool_first_ranks_only_clean_data
- id: 11-1
  req: FR-11
  name: Task Matrix
  type: Core Functionality
  business: A setting can be swept across several values in one task, and the runs compared side by side.
  conditions:
  - DataEval Flow installed
  - A `quality` entry over 60 images with one outlier and one duplicate pair
  steps:
  - do: 'Give a task `matrix: {checks.image-outliers.warning: [0.5, 5.0]}`.'
    expect: It returns one `MatrixResult` of type `quality` with two `MatrixRun`s numbered from 1, labelled by their values;
      the outlier finding warns in run 1 and informs in run 2.
    tests:
    - f11_matrix::test_a_list_runs_the_task_once_per_value_in_order
  - do: Compare a run with the same settings run as a lone task.
    expect: The findings are equal.
    tests:
    - f11_matrix::test_each_run_gives_the_result_its_settings_give_as_a_lone_task
  - do: Write a range, a grid of two keys, and two grids.
    expect: A range counts from `from` up to and including `to` by `step`; a grid crosses its keys with the last changing
      fastest; several grids run in turn and a grid need not set every key.
    tests:
    - f11_matrix::test_a_range_counts_up_by_its_step_and_includes_its_end
    - f11_matrix::test_one_grid_crosses_its_keys_with_the_last_key_changing_fastest
    - f11_matrix::test_several_grids_run_in_turn_and_a_grid_need_not_set_every_key
  - do: Vary the task's `sources` and `extractor`.
    expect: Each run reads the source and the extractor its value names.
    tests:
    - f11_matrix::test_the_tasks_sources_and_extractor_can_be_varied
  - do: Vary `detectors.knn.k` of a `shift` entry, and an evaluator task's `outlier_threshold`.
    expect: The item is reached by its name, and the evaluator's matrix lists the runs without finding columns.
    tests:
    - f11_matrix::test_a_key_reaches_a_list_item_by_its_name
    - f11_matrix::test_an_evaluator_task_has_a_matrix_too
  - do: Read the report and the JSON.
    expect: 'The report opens with the health line and a table with a column per finding; the JSON has `kind: matrix`, the
      keys, and each run''s number, label, values and result.'
    tests:
    - f11_report::test_the_report_opens_with_a_table_of_every_runs_findings
    - f11_report::test_the_json_holds_each_run_under_runs
  - do: Make the second of three runs fail (`n_clusters` of 1000 on 60 images), with a task after it.
    expect: The matrix fails with the error of run 2, runs 1 and 3 still run, the report says `Run 2 failed`, and the next
      task succeeds.
    tests:
    - f11_runs::test_a_failed_run_is_kept_and_fails_the_matrix_but_later_runs_and_tasks_still_run
  - do: Vary a setting over a source whose view shuffles without a seed.
    expect: Every run reads the same 30 items.
    tests:
    - f11_runs::test_every_run_reads_one_draw_of_a_source_whose_view_shuffles
  - do: Add an `export` step to the workflow and run the matrix with an output directory.
    expect: Each run writes under `datasets/<to>/run-<n>`.
    tests:
    - f11_runs::test_an_export_step_writes_each_run_under_its_own_directory
  - do: Write a matrix with an invalid value, duplicate runs, a bare value, an unknown setting, a key for `type`, overlapping
      keys, or an unknown source.
    expect: Each is refused when the configuration loads, and the message names the cause.
    tests:
    - f11_cfg::test_a_matrix_that_cannot_run_is_refused_when_the_config_loads
  - do: Write a matrix with a range in a YAML file and read it with `load_config`.
    expect: Six runs (1, 3 and 5 against two thresholds) run from the file.
    tests:
    - f11_cfg::test_a_matrix_in_a_yaml_file_runs_from_load_config
  - do: 'Write `type: parameter-sweep`.'
    expect: 'The load fails with `Unknown workflow: ''parameter-sweep''`.'
    tests:
    - f11_cfg::test_the_parameter_sweep_workflow_type_no_longer_exists
- id: 12-1
  req: FR-12
  name: Text Report and Export
  type: Core Functionality
  business: Every result can be read as text, exported for tools, and checked by a script.
  conditions:
  - DataEval Flow installed
  - A small synthetic ImageFolder dataset, with one exact-duplicate pair for a result that warns and none for one that does
    not
  steps:
  - do: Run the `quality` workflow and call `report()` and `report(detailed=False)` on a result that warns, on a clean one,
      and on an evaluator's result.
    expect: A multi-line report with a banner, provenance, summary, health line, evidence, steps and configuration is returned.
      The summary form is shorter and leaves out the evidence, the health line counts the warnings, and an evaluator's report
      has no health line.
    tests:
    - f12_text::test_report_is_a_multi_line_text_with_banner_summary_health_and_configuration
    - f12_text::test_summary_report_keeps_the_summary_and_drops_the_evidence
    - f12_text::test_warnings_are_counted_in_the_health_line
    - f12_text::test_clean_run_says_all_checks_passed
    - f12_text::test_evaluator_report_has_its_own_banner_and_judges_no_health
  - do: Call `report(width=60)`, `report(width=120)` and `report(width=39)`.
    expect: The lines are 60 and 120 characters wide (80 by default), and a width of 39 raises `ValueError`.
    tests:
    - f12_text::test_report_width_sets_the_line_length
    - f12_text::test_report_width_below_the_minimum_is_refused
  - do: Export the result to a JSON file, a YAML file, a directory and a string.
    expect: The file is written and its path returned, a directory receives `results.json` or `results.yaml`, and with no
      path the serialized string is returned. The JSON contains no NaN or infinity.
    tests:
    - f12_export::test_export_writes_json_and_returns_the_path
    - f12_export::test_export_writes_yaml
    - f12_export::test_export_to_a_directory_writes_results_file_inside_it
    - f12_export::test_export_without_a_path_returns_the_serialized_string
    - f12_export::test_exported_json_is_strict
  - do: Call `to_dict()` on a workflow's result and on an evaluator's.
    expect: A workflow's holds `kind`, `metadata`, `health`, `steps` and `findings`, and an evaluator's holds `kind`, `metadata`
      and `output` and no `health`.
    tests:
    - f12_export::test_workflow_dict_holds_kind_metadata_health_steps_and_findings
    - f12_export::test_evaluator_dict_holds_kind_metadata_and_output_but_no_health
  - do: Read `health`, `warning_count` and `findings` of a result that warns, a clean one, and one with a failed step.
    expect: The status is `warning`, `ok` or `failed`, the counts agree with the findings and the report, and the failed steps
      are named.
    tests:
    - f12_health::test_health_warning_count_and_findings_agree_with_the_report
    - f12_health::test_clean_health_is_ok
    - f12_health::test_failed_health_names_the_failed_steps
  - do: Report a `quality` run whose `outliers` step raised.
    expect: 'The report says `Health: failed` and names the step and its error, in the summary and the detailed form.'
    tests:
    - f12_text::test_failed_workflow_report_names_the_step_and_the_error
- id: 12-2
  req: FR-12
  name: Result Files from the Command Line
  type: Core Functionality
  business: A run leaves its results in the files a person, a script or a CI job reads, shaped by the `result:` block.
  conditions:
  - DataEval Flow installed
  - A pipeline over a small synthetic ImageFolder dataset with an exact-duplicate pair, and a task that fails
  steps:
  - do: Run the command with no `result:` block and an output directory.
    expect: '`result.json`, `result.txt` and `result.html` are written to `<output>/results/` beside a run log. The JSON is
      keyed by task name, and the text file holds the full report.'
    tests:
    - f12_files::test_default_run_writes_json_text_and_html_keyed_by_task
    - f12_resultcfg::test_defaults_write_json_text_and_html_at_full_detail
  - do: Run with `formats` listing all five formats, and with `formats` listing only `markdown`.
    expect: Each format is written with its own extension, and only the formats listed are written.
    tests:
    - f12_files::test_every_format_writes_a_file_with_its_own_extension
    - f12_files::test_only_the_requested_formats_are_written_and_no_temporary_file_is_left
    - f12_resultcfg::test_a_format_listed_twice_is_written_once
  - do: Read the JUnit file and the Markdown file of a run with a failed task and a task that warns.
    expect: The JUnit file has a test suite per task, an error case for the failed step and a failing case for the warning.
      The Markdown file has a section per task, including the failed one.
    tests:
    - f12_files::test_junit_report_has_a_suite_per_task_and_a_case_per_finding
    - f12_files::test_markdown_summary_names_every_task_including_the_failed_one
  - do: Read the JSON, text and HTML files of the same run.
    expect: The failed task's partial result is in each of them with a failed health status, and the task after it ran.
    tests:
    - f12_files::test_a_failed_workflow_keeps_its_partial_steps_in_json_text_and_html
  - do: 'Run with `name`, `per_task` and `detail: summary` set.'
    expect: Each task has its own named files, the text and HTML files are shorter, and the JSON still holds every step's
      output.
    tests:
    - f12_files::test_named_per_task_files_replace_the_single_run_files
    - f12_files::test_summary_detail_shortens_the_text_and_html_files_but_not_the_json
  - do: Run with and without `-v`, and with no output directory.
    expect: The console prints the summary, or the full report with `-v`, whatever `detail` says. With no output directory
      no file is written.
    tests:
    - f12_files::test_the_console_prints_the_summary_and_v_prints_the_full_report
    - f12_files::test_without_an_output_directory_nothing_is_written
  - do: 'Set the width with `result: width`, `--report-width` and `DATAEVAL_REPORT_WIDTH`, and give a width of 39.'
    expect: The text file and the console take the width, the flag over the variable over the config, and a width of 39 is
      refused before any task runs.
    tests:
    - f12_width::test_result_width_sets_the_text_file_and_the_console
    - f12_width::test_the_flag_overrides_the_config_and_the_environment_overrides_the_config
    - f12_width::test_a_width_below_40_is_refused_before_any_task_runs
  - do: 'Load configs whose `result:` block holds an unknown format, a width of 39, `max_rows: 0`, an unknown key or a name
      that is a path.'
    expect: Each is refused with an error that names the field.
    tests:
    - f12_resultcfg::test_a_value_the_command_cannot_honour_is_refused
    - f12_resultcfg::test_a_bad_result_block_fails_the_config_load
- id: 12-3
  req: FR-12
  name: Table Limits and Thumbnails
  type: Core Functionality
  business: Reports stay readable on large datasets, name the items they are about, and open offline.
  conditions:
  - DataEval Flow installed
  - A synthetic ImageFolder dataset holding six exact-duplicate pairs
  steps:
  - do: Run a `quality` workflow with the default `result:` limits.
    expect: The duplicates table lists all six groups and no note about further rows.
    tests:
    - f12_rows::test_defaults_list_every_row_of_a_short_table
  - do: 'Run it with `max_rows: 3` and `preview_rows: 2`.'
    expect: The text report shows two rows and a line counting the third. A paragraph says that three of six groups are listed
      and where the rest is, the JSON keeps all six, and the HTML page shows the three listed rows with their thumbnails.
    tests:
    - f12_rows::test_preview_rows_cuts_the_text_report_and_counts_the_rest
    - f12_rows::test_max_rows_cuts_the_table_and_a_paragraph_says_where_the_rest_is
    - f12_rows::test_json_keeps_every_row_whatever_the_limits
    - f12_rows::test_html_shows_every_listed_row_whatever_preview_rows_says
  - do: 'Run it with `max_rows: -1` and `preview_rows: -1`.'
    expect: Every row is listed and no note about further rows appears.
    tests:
    - f12_rows::test_minus_one_lists_every_row
  - do: Run it with the default `max_images`, 5, 0 and -1.
    expect: The result keeps a thumbnail of each named item, at most 5, none, or every named item, as an image in the `assets`
      of the JSON and the HTML page. With none, the report still names the items.
    tests:
    - f12_thumbs::test_the_report_names_items_and_their_thumbnails_are_kept_in_the_result
    - f12_thumbs::test_max_images_caps_the_thumbnails
    - f12_thumbs::test_zero_max_images_keeps_none
    - f12_thumbs::test_minus_one_max_images_keeps_a_thumbnail_for_every_named_item
  - do: Run the command with `--no-report-images`, with `DATAEVAL_REPORT_IMAGES=false`, and with `--report-images` against
      that variable.
    expect: The JSON and HTML hold no thumbnails in the first two runs, and the flag turns them back on in the third.
    tests:
    - f12_thumbs::test_no_report_images_flag_and_variable_turn_thumbnails_off
  - do: Open the HTML report and compare its summary and detailed forms.
    expect: It is one page whose thumbnails are inline images, that loads no script, stylesheet or image from a URL, and the
      summary form is shorter.
    tests:
    - f12_thumbs::test_html_is_one_self_contained_page
    - f12_thumbs::test_summary_html_is_shorter_than_detailed_html
- id: 12-4
  req: FR-12
  name: Gating on the Exit Code
  type: Core Functionality
  business: A CI job can fail on a failed task, on health warnings or on a verdict short of a required level, while the results
    are kept.
  conditions:
  - DataEval Flow installed
  - Pipelines over a small synthetic ImageFolder dataset, with and without a planted duplicate, a task that fails, and an
    `audit` task
  steps:
  - do: Run with the default `fail_on` over a dataset that warns, and over a task that fails.
    expect: The warning run exits 0 and says which task warned. The failing run exits 1 and names the task.
    tests:
    - f12_failon::test_default_fails_on_a_failed_task_and_not_on_warnings
  - do: Run with `fail_on warning` over a dataset that warns, over one that does not, and with a failing task as well.
    expect: The warning run exits 3 and still writes its results, the clean run exits 0, and the failed task makes it exit
      1.
    tests:
    - f12_failon::test_warning_exits_3_when_a_task_succeeds_with_a_warning
    - f12_failon::test_warning_exits_0_when_nothing_warns
    - f12_failon::test_a_failed_task_outranks_a_warning
  - do: Run with `fail_on never` and a failing task.
    expect: The run exits 0, names the failure, and writes its results.
    tests:
    - f12_failon::test_never_exits_0_for_a_failed_task_and_still_writes_its_results
  - do: Run an `audit` of one split with `require` set to `ready`, to `ready-with-caveats`, and with `--require` against the
      config.
    expect: A verdict worse than the level exits 4 and names the task and verdict, even under `fail_on never`. One that meets
      the level exits 0, and the flag replaces the config.
    tests:
    - f12_require::test_a_verdict_short_of_the_required_level_exits_4
    - f12_require::test_a_verdict_that_meets_the_level_exits_0_and_the_flag_overrides_the_config
  - do: Run the audit with `require` and `fail_on warning`, and a config that sets `require` and has no task that gives a
      verdict.
    expect: The verdict gate outranks the warning gate, and the run with no verdict is refused with exit 1 before any task
      runs.
    tests:
    - f12_require::test_a_verdict_outranks_a_warning_gate
    - f12_require::test_require_with_no_task_that_gives_a_verdict_is_refused_before_any_task_runs
- id: 13-1
  req: FR-13
  name: Result Metadata Envelope
  type: Integration
  business: Every result carries the metadata that makes it auditable and comparable.
  conditions:
  - DataEval Flow installed
  - A seeded pipeline over a small synthetic ImageFolder dataset, a second dataset, and a view that relabels the classes
  steps:
  - do: Read the envelope's `version`, `tool`, `tool_version`, `timestamp` and `execution_time_s`.
    expect: The tool is `dataeval-flow` and `tool_version` matches the package version. The timestamp is UTC and falls inside
      the run, and the time is positive and no longer than the run.
    tests:
    - f13_env::test_tool_and_versions_identify_what_made_the_result
    - f13_env::test_timestamp_is_utc_and_falls_inside_the_run
    - f13_env::test_execution_time_is_positive_and_no_longer_than_the_run
  - do: Read `device` and `library_versions`.
    expect: The device is `cpu` when the CPU was chosen, and the versions of DataEval, NumPy and Pillow equal the installed
      ones.
    tests:
    - f13_env::test_device_names_where_the_run_computed
    - f13_env::test_library_versions_record_the_installed_libraries
  - do: Read `dataset_id`, `source_descriptions`, `model_id` and `label_source` of a workflow over one source and an evaluator
      over two.
    expect: They name the dataset, the source, the extractor and the label origin, and two sources are comma-joined in task
      order.
    tests:
    - f13_env::test_sources_datasets_and_extractor_are_named
    - f13_eval::test_dataset_id_lists_every_source_in_task_order
    - f13_eval::test_the_envelope_names_the_evaluator_and_the_dataeval_call
  - do: Read `resolved_config`.
    expect: It holds the sources with their dataset settings, the workflow with its settings, the extractor and the seed.
    tests:
    - f13_env::test_resolved_config_holds_the_sources_workflow_extractor_and_seed
  - do: Read `label_space` and `label_space_digest` of a run whose source reads through a view that relabels both classes
      to one, and of a run with no such view.
    expect: The first records the source, class mapping, target and a 12-character digest, which `label_space_digest` repeats.
      The second records none.
    tests:
    - f13_labels::test_a_result_that_conformed_no_labels_records_no_label_space
    - f13_labels::test_a_conformed_source_is_recorded_with_its_remap_target_and_digest
    - f13_labels::test_the_label_space_reaches_the_exported_envelope
  - do: Read `metadata_binning`, `encoding_digest` and `diagnostics` of runs over 32-pixel and 8-pixel images.
    expect: The encoding of the metadata factors and its digest are recorded, and the 8-pixel run records DataEval's warning
      that the images are too small for perceptual hashing.
    tests:
    - f13_env::test_envelope_records_how_metadata_factors_were_encoded
    - f13_env::test_library_diagnostics_are_recorded
  - do: Call `to_dict()` and `export()`, and read `kind`.
    expect: The whole envelope is written under `metadata`, and `kind` is `workflow` or `evaluator`.
    tests:
    - f13_env::test_to_dict_and_export_carry_the_whole_envelope
    - f12_export::test_workflow_dict_holds_kind_metadata_health_steps_and_findings
    - f12_export::test_evaluator_dict_holds_kind_metadata_and_output_but_no_health
- id: 13-2
  req: FR-13
  name: Failed Result Shape
  type: Integration
  business: A result that failed still says what ran, and cannot be mistaken for one that succeeded.
  conditions:
  - DataEval Flow installed
  - A `quality` workflow whose `outliers` step fails, and an evaluator task that is refused before it runs
  steps:
  - do: Run the `quality` workflow whose `outliers` step raises, and read the result.
    expect: '`success` is false and `errors` holds the step''s error. Reading `output` raises `RuntimeError`, the steps that
      ran stay readable, and the steps that needed `outliers` are skipped.'
    tests:
    - f13_failed::test_the_result_is_unsuccessful_and_lists_the_step_error
    - f13_failed::test_its_output_refuses_to_be_read
    - f13_failed::test_the_steps_that_ran_stay_readable_and_the_dependents_are_skipped
  - do: Call `to_dict()` and `export()` on it and read its envelope.
    expect: The dict holds `kind`, `metadata`, a `failed` health status, the steps and the `errors`, and the envelope is filled
      as for a successful run.
    tests:
    - f13_failed::test_the_dict_carries_kind_envelope_health_steps_and_errors
    - f13_failed::test_the_envelope_is_filled_as_for_a_successful_run
  - do: Run an evaluator task that asks for cluster mode over two sources.
    expect: A failed result of the evaluator's class comes back with the reason in `errors`, the envelope filled, a dict of
      `kind`, `metadata` and `errors`, and a report headed `FAILED`.
    tests:
    - f13_refused::test_a_task_refused_before_it_ran_comes_back_as_a_failed_result_of_the_evaluators_class
    - f13_refused::test_it_carries_the_envelope_and_its_dict_holds_kind_metadata_and_errors_only
    - f13_refused::test_its_report_says_it_failed_and_why
  - do: Make a failed result without a run, and make a successful one without an output.
    expect: The failed result has the default envelope and a failed health status, a successful result must carry its output,
      and a failed one must not.
    tests:
    - f13_contract::test_a_failed_result_can_be_made_without_a_run
    - f13_contract::test_a_successful_result_must_carry_an_output_and_a_failed_one_must_not
    - f13_contract::test_a_successful_result_reads_its_output
- id: 14-1
  req: FR-14
  name: Disk and Memory Cache in a Pipeline Run
  type: Core Functionality
  business: Repeated runs reuse cached work without mixing up datasets, views or settings, and a damaged cache never fails
    a run.
  conditions:
  - DataEval Flow installed
  - Two small synthetic ImageFolder datasets, one with an exact-duplicate pair
  - A cache location that does not exist yet
  steps:
  - do: Run a duplicates evaluator with an extractor, and a `quality` workflow, with the cache directory given.
    expect: The directory is created and holds `v1/<dataset>/sel_<view>/` with the embeddings, cluster results, statistics
      and, for `quality`, a metadata archive and sidecar, and no temporary file.
    tests:
    - f14_disk::test_the_directory_is_created_on_first_use_and_holds_versioned_artifacts
    - f14_disk::test_quality_leaves_metadata_and_statistics
  - do: Run the same task again.
    expect: The stored entries are read and logged as cache hits, no embeddings are computed, no file is written, and the
      output is the same, including the duplicate pair.
    tests:
    - f14_disk::test_an_unchanged_rerun_reads_the_cache_and_writes_nothing
  - do: Change the extractor's batch size, replace one image of the dataset, read the dataset through a `Limit` view, read
      the other dataset, and change the metadata policy.
    expect: Each makes a new entry, the earlier entries are untouched, the other dataset gets no duplicate pair from the first
      one's cache, and each metadata policy has its own archive.
    tests:
    - f14_disk::test_a_different_extractor_setting_is_a_different_entry
    - f14_disk::test_changed_dataset_content_is_a_new_entry_and_the_old_one_is_kept
    - f14_disk::test_the_same_dataset_under_another_view_is_kept_apart
    - f14_disk::test_entries_are_isolated_per_source_and_never_served_across
    - f14_disk::test_metadata_is_cached_per_encoding_policy
  - do: Run a `quality` workflow for `pixel` statistics, then one for `pixel` and `dimension`.
    expect: The second adds the dimension statistics to the same entry and keeps the stored ones unchanged.
    tests:
    - f14_disk::test_statistics_accumulate_in_one_entry_across_workflows
  - do: Overwrite a stored embeddings file with bytes that are not an array and run again.
    expect: The run succeeds with the same output, logs a warning, and replaces the file with a readable one.
    tests:
    - f14_disk::test_a_corrupt_entry_is_recomputed_with_a_warning_and_does_not_fail_the_run
  - do: Run with no cache directory, twice in one process.
    expect: Nothing is written to disk, and the second run takes its embeddings from memory.
    tests:
    - f14_mem::test_without_a_directory_nothing_is_written
    - f14_mem::test_a_second_run_in_the_same_process_reuses_what_the_first_computed
  - do: Run the command with `--cache` twice, and with `DATAEVAL_CACHE` against a conflicting flag.
    expect: The first run fills the directory, the second reads it and writes nothing, and the flag takes precedence over
      the variable.
    tests:
    - f14_cli::test_the_flag_fills_the_directory_and_a_second_run_reads_it
    - f14_cli::test_the_environment_variable_names_the_directory_and_the_flag_overrides_it
- id: 14-2
  req: FR-14
  name: Cache Entries and Keys
  type: Core Functionality
  business: The cache returns exactly what was stored under a key, and nothing for any other key.
  conditions:
  - DataEval Flow installed
  - An empty cache directory
  steps:
  - do: Read an embeddings key that was never stored, store an array under it, and read it back through the same instance
      and a new one.
    expect: The first read returns `None` and stores nothing. After the store the same array comes back unchanged, also from
      a new instance over the same directory.
    tests:
    - f14_emb::test_a_saved_array_reads_back_unchanged_and_a_never_saved_key_misses
    - f14_emb::test_a_new_instance_over_the_same_directory_finds_the_entry_on_disk
  - do: Store arrays under keys that differ in the view, the extractor settings or the transforms, and under dataset keys
      that differ.
    expect: Each combination has its own entry, and the dataset directory name is stable for one key and different for another.
    tests:
    - f14_emb::test_the_key_is_the_view_the_extractor_and_the_transforms
    - f14_emb::test_the_dataset_directory_name_is_stable_for_one_content_key_and_differs_for_another
  - do: Store the same key for two datasets.
    expect: The entries are separate, and neither dataset reads the other's.
    tests:
    - f14_emb::test_an_entry_is_isolated_to_its_dataset
  - do: Store a cluster result and read it back with other algorithms and cluster counts.
    expect: The stored arrays come back unchanged for the same key and miss for any other.
    tests:
    - f14_clu::test_a_saved_cluster_result_reads_back_unchanged_and_is_keyed_by_algorithm
  - do: Look at where entries are written, rename the version directory, and give a dataset name containing a path separator.
    expect: Entries are under `v<version>/<dataset>/sel_<view>/`, an older version's entries are ignored and kept, and the
      name is refused.
    tests:
    - f14_emb::test_entries_are_written_under_a_versioned_dataset_directory
    - f14_emb::test_entries_of_another_cache_version_are_ignored_not_deleted
    - f14_emb::test_a_dataset_name_cannot_leave_the_cache_directory
  - do: Use a cache with no directory, and `get_or_create` with and without one.
    expect: A cache with no directory keeps entries in memory only, one instance per dataset is shared until cleared, and
      a directory gives a new instance over the same stored entries.
    tests:
    - f14_dsmem::test_a_cache_without_a_directory_holds_entries_in_memory_and_writes_nothing
    - f14_dsmem::test_get_or_create_shares_one_in_memory_cache_per_dataset_until_cleared
    - f14_dsmem::test_a_disk_backed_get_or_create_returns_a_new_instance_over_the_same_entries
- id: 15-1
  req: FR-15
  name: Entry Points, Help and Discovery
  type: Core Functionality
  business: A user or a script can find out what build is installed, what the command accepts and what it can run.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Run `dataeval-flow --version`, `python -m dataeval_flow --version` and `python -m dataeval_flow --help`.
    expect: The console script exists and the module form works without it. Both print `dataeval-flow <version>` for the installed
      build, and `--help` prints the usage.
    tests:
    - f15_entry::test_console_script_is_on_the_path_and_reports_the_installed_build
    - f15_entry::test_module_form_runs_without_the_console_script
    - f15_help::test_version_prints_the_package_version_and_exits_0
  - do: Run `--help` for the command and for each of `workflows`, `evaluators`, `steps`, `encoding`, `config`, `app`, `verify`
      and `serve`.
    expect: Each exits 0 and prints its usage. The command's help lists every subcommand, option and environment variable,
      and the `serve` help documents its variables and endpoints.
    tests:
    - f15_help::test_top_level_help_lists_every_subcommand_option_and_environment_variable
    - f15_help::test_each_subcommand_answers_help_with_its_usage_and_exit_0
    - f15_help::test_serve_help_documents_its_environment_variables_and_endpoints
    - f15_help::test_verify_and_encoding_help_name_their_arguments
  - do: Run `workflows`, `workflows --json`, `workflows quality` and `workflows nosuch`.
    expect: The nine presets are listed with descriptions, as a table or JSON, and none of the retired workflows. A named
      workflow prints its settings schema, and an unknown name exits 1 and lists the installed ones.
    tests:
    - f15_wf::test_lists_the_nine_presets_with_a_description_each
    - f15_wf::test_json_listing_is_machine_readable
    - f15_wf::test_the_workflows_listing_holds_no_retired_workflow_and_no_evaluator
    - f15_wf::test_a_named_workflow_prints_the_schema_of_its_settings
    - f15_wf::test_an_unknown_workflow_exits_1_and_lists_the_installed_ones
  - do: Run `evaluators`, `evaluators --json`, `evaluators duplicates` and `evaluators nosuch`.
    expect: Every evaluator is listed with what it consumes and how many sources it reads, and no preset. A named evaluator
      prints its parameter schema, and an unknown name exits 1.
    tests:
    - f15_ev::test_lists_every_evaluator_with_what_it_consumes_and_how_many_sources_it_reads
    - f15_ev::test_the_text_listing_shows_what_each_consumes
    - f15_ev::test_a_named_evaluator_prints_its_parameter_schema
    - f15_ev::test_an_unknown_evaluator_exits_1
    - f15_ev::test_the_evaluator_listing_holds_no_preset
  - do: Run `steps`, `steps --json`, `steps remove`, `steps prioritization`, `steps workflow:prioritization` and `steps nosuch`.
    expect: The catalog lists every kind of step with its ports. A named step prints its entry and settings schema, a name
      two kinds share needs `KIND:NAME`, and an unknown name exits 1.
    tests:
    - f15_steps::test_the_json_catalog_lists_every_kind_of_step_with_its_ports
    - f15_steps::test_the_text_catalog_has_a_row_per_step_with_its_ports
    - f15_steps::test_a_named_step_prints_its_entry_and_settings_schema
    - f15_steps::test_a_name_two_kinds_share_needs_kind_name
    - f15_steps::test_an_unknown_step_exits_1
- id: 15-2
  req: FR-15
  name: Headless Run with Flags and Environment Variables
  type: Core Functionality
  business: A pipeline can be run unattended, configured by flags or by environment variables.
  conditions:
  - DataEval Flow installed
  - A config file and a small synthetic ImageFolder dataset
  steps:
  - do: Run the command end to end with `--config`, `--data` and `--output`.
    expect: The exit code is 0, the results are written under the output directory, and the log records the task and its success.
    tests:
    - f15_run::test_flags_run_the_pipeline_and_write_results_and_a_log
    - f15_run::test_the_summary_is_printed_to_the_console_by_default
  - do: Run it again with the same options as `DATAEVAL_DATA`, `DATAEVAL_CONFIG`, `DATAEVAL_OUTPUT` and `DATAEVAL_CACHE`.
    expect: The variables configure the run, and a relative `DATAEVAL_CONFIG` resolves against the data root.
    tests:
    - f15_run::test_environment_variables_alone_configure_data_config_and_output
    - f15_prec::test_variables_apply_when_no_flag_is_given
  - do: Run it with each flag and a conflicting variable.
    expect: The flag wins for config, data, output, cache, `--fail-on-warning`, `--max-processes` and verbosity, and nothing
      reaches the variables' paths.
    tests:
    - f15_prec::test_a_flag_beats_the_variable_for_config_data_output_and_cache
    - f15_prec::test_boolean_and_choice_variables_are_read_and_overridden_by_their_flags
    - f15_prec::test_max_processes_comes_from_the_flag_else_the_variable
    - f15_prec::test_the_verbosity_variable_applies_until_a_flag_replaces_it
  - do: Run it with a relative `--config`, with no `--config`, and with no `--data`.
    expect: A relative config resolves against the data root, a config at the data root is found, and the current directory
      is the default data root.
    tests:
    - f15_prec::test_a_relative_config_path_resolves_against_the_data_root
    - f15_prec::test_without_a_config_the_data_root_is_searched_for_one
    - f15_prec::test_the_current_directory_is_the_default_data_root
  - do: Run it with `--report-width`, `--report-images` and `--no-report-images`, and their variables.
    expect: The width and the thumbnails follow the flag over the variable over the config.
    tests:
    - f12_width::test_the_flag_overrides_the_config_and_the_environment_overrides_the_config
    - f12_thumbs::test_no_report_images_flag_and_variable_turn_thumbnails_off
  - do: Set each variable to a value it cannot take, and set one to blanks.
    expect: A malformed value exits 1, names the variable, prints no traceback and runs nothing. A blank value counts as unset.
    tests:
    - f15_badenv::test_a_malformed_value_exits_1_naming_the_variable_and_prints_no_traceback
    - f15_badenv::test_a_blank_variable_counts_as_unset
- id: 15-3
  req: FR-15
  name: Task Selection, Logging and Verbosity
  type: Core Functionality
  business: A run can be limited to chosen tasks, and its console output set to suit a terminal or a log collector.
  conditions:
  - DataEval Flow installed
  - A config with two enabled tasks and one task that sets `enabled: false`
  steps:
  - do: Run with no `--task`, with `--task second`, with `-t second -t first -t second`, and with the disabled task named.
    expect: The enabled tasks run, then only the one named, then the two in the order given with `second` once, then the disabled
      one.
    tests:
    - f15_task::test_without_task_every_enabled_task_runs_and_a_disabled_one_does_not
    - f15_task::test_task_runs_only_the_named_one
    - f15_task::test_repeating_task_runs_them_in_the_order_given_and_a_name_twice_runs_once
    - f15_task::test_a_named_task_runs_even_when_the_config_disables_it
  - do: Run with `DATAEVAL_TASKS` set, with and without `--task`, and with a task name that does not exist.
    expect: The variable lists the tasks separated by commas and the flag replaces it. An unknown name exits 1, lists the
      tasks that exist, and no task runs.
    tests:
    - f15_task::test_the_variable_lists_tasks_separated_by_commas_and_the_flag_replaces_it
    - f15_task::test_an_unknown_task_name_exits_1_listing_the_tasks_there_are_before_anything_runs
  - do: Run with the default `--log-format`, with `plain`, with `DATAEVAL_LOG_FORMAT`, and with `json`.
    expect: '`structured` prefixes a UTC timestamp and the level, `plain` prints bare messages with a level only from warning
      up, the flag replaces the variable, the log file keeps its timestamped format, and `json` is a usage error.'
    tests:
    - f15_logfmt::test_structured_is_the_default_and_prefixes_a_utc_timestamp_and_the_level
    - f15_logfmt::test_plain_prints_bare_messages_with_a_level_only_from_warning_up
    - f15_logfmt::test_the_variable_selects_the_format_and_the_flag_replaces_it
    - f15_logfmt::test_the_log_file_keeps_its_own_timestamped_format_whatever_the_console_uses
    - f15_logfmt::test_a_format_other_than_the_two_is_a_usage_error
  - do: Run with no `-v`, `-v`, `-vv` and `-vvv`, and with a failing task.
    expect: The console prints the summary, then the full report, then INFO messages, then DEBUG messages, and a failed task
      and its error are always printed.
    tests:
    - f15_verb::test_the_console_prints_the_summary_by_default_the_full_report_with_v_and_logs_with_vv
    - f15_verb::test_a_failed_task_is_always_reported_on_the_console
- id: 15-4
  req: FR-15
  name: Exit Codes
  type: Core Functionality
  business: A script can tell success, a failure, a mistyped command, a data-quality warning and a failed gate apart.
  conditions:
  - DataEval Flow installed
  - Pipelines over a small synthetic ImageFolder dataset, with and without a planted duplicate, a task that fails, and an
    `audit` task
  steps:
  - do: Run a pipeline whose tasks succeed, with and without warnings, and one that defines no tasks.
    expect: Each exits 0, and the warning run says which task warned.
    tests:
    - f15_exit0::test_a_run_whose_tasks_all_succeed_exits_0_even_with_warnings
    - f15_exit0::test_a_config_that_defines_no_tasks_exits_0
  - do: Run with a missing config, a missing data root, an invalid config, a failing task, an unknown task, an unreadable
      variable, and an export that fails.
    expect: Each exits 1 with a message that names the cause and no traceback. The failing task does not stop the others,
      and the failed export leaves the results written.
    tests:
    - f15_exit1::test_a_missing_config_exits_1_with_the_path
    - f15_exit1::test_a_missing_data_root_exits_1_naming_it
    - f15_exit1::test_an_invalid_config_exits_1_naming_the_problem_and_runs_nothing
    - f15_exit1::test_a_failed_task_exits_1_after_the_remaining_tasks_have_run
    - f15_exit1::test_an_unknown_task_and_an_unreadable_variable_exit_1_not_2
    - f15_exit1::test_a_failed_export_exits_1_and_still_writes_the_results
  - do: Run with an unknown option, an invalid choice, a width below 40, a non-integer, a missing value and a missing argument,
      and run the command as a separate process with an unknown option.
    expect: Each exits 2 with the usage and the reason, and runs nothing.
    tests:
    - f15_exit2::test_a_mistyped_command_line_exits_2_with_the_usage_and_runs_nothing
    - f15_exit2::test_the_real_process_exits_2_on_an_unknown_option
  - do: Run with `--fail-on-warning` over a dataset that warns and one that does not, with the variable, with the config's
      `fail_on`, and with `--no-fail-on-warning`.
    expect: A warning exits 3 and the results are written, no warning exits 0, and the flag replaces the variable and the
      config. A separate process exits 3 too.
    tests:
    - f15_exit3::test_fail_on_warning_exits_3_when_a_task_succeeds_with_a_warning
    - f15_exit3::test_without_a_warning_the_flag_leaves_the_exit_code_at_0
    - f15_exit3::test_the_flag_the_variable_and_the_config_each_set_the_gate_and_no_fail_on_warning_lifts_it
    - f15_exit3::test_the_real_process_exits_3
  - do: Run an `audit` of one split with `--require ready`, with `--require ready-with-caveats`, with `DATAEVAL_REQUIRE`,
      and a run with no verdict-giving task.
    expect: A verdict worse than the level exits 4 and names the task and verdict, one that meets it exits 0, the flag replaces
      the variable, and a run with no verdict is refused with exit 1.
    tests:
    - f15_exit4::test_a_verdict_worse_than_require_exits_4_and_names_the_task_and_verdict
    - f15_exit4::test_a_verdict_that_meets_require_exits_0
    - f15_exit4::test_the_variable_sets_require_and_the_flag_replaces_it
    - f15_exit4::test_require_for_a_run_with_no_verdict_is_refused_with_exit_1
  - do: Run with a failing task, a verdict short of `--require` and `--fail-on-warning` together.
    expect: The failed task gives 1, the verdict alone gives 4, and the warning alone gives 3.
    tests:
    - f15_order::test_a_failed_task_outranks_the_verdict_and_the_verdict_outranks_the_warning_gate
- id: 16-1
  req: FR-16
  name: Container Build and Help
  type: Core Functionality
  business: The Dockerfiles come from one template and run as a non-root user, and the help text the container prints matches
    what the command line does.
  conditions:
  - The Dockerfiles, `docker/variants.yaml`, and `docker/entrypoint.sh`
  - The container reference page
  steps:
  - do: Check that the CPU, `cu126`, and `cu130` Dockerfiles exist, start with `FROM`, and end with a non-root `USER`.
    expect: All three Dockerfiles pass the checks and the published stage runs as the `dataeval` user.
    tests:
    - f16_docker::test_there_is_one_variant_for_each_image_the_project_publishes
    - f16_docker::test_dockerfile_exists
    - f16_docker::test_dockerfile_starts_with_from
    - f16_docker::test_dockerfile_has_nonroot_user
    - f16_docker::test_the_published_stage_runs_as_the_non_root_user
  - do: Render `docker/Dockerfile.j2` with `docker/variants.yaml` again, and compare each Dockerfile with its variant's extras
      and base image.
    expect: The rendered files equal the committed ones, each installs the extras its variant lists, and all are built on
      the named base image.
    tests:
    - f16_tmpl::test_dockerfile_says_it_is_generated_from_the_template
    - f16_tmpl::test_rendering_the_template_again_gives_the_committed_dockerfiles
    - f16_tmpl::test_each_variant_installs_the_extras_the_variants_file_lists
    - f16_tmpl::test_each_variant_is_built_on_the_base_image_the_variants_file_names
  - do: Read the image's entry point, default command, exposed port, and variables.
    expect: The entry point script starts `python -m dataeval_flow`, port 8001 is exposed, the data and output roots are preset,
      and no variable has a secret-like name.
    tests:
    - f16_docker::test_the_image_starts_the_entrypoint_script_and_exposes_the_service_port
    - f16_docker::test_the_image_carries_no_secrets
  - do: Compare the entry point's help text and the container reference page with the argument parser and the environment
      variables the code reads.
    expect: The script is valid bash; every command appears in both texts; every option and variable they list exists; each
      operational option has its variable in the help; the help says no secrets are needed and shows the mounts and the service
      command; the documented defaults match the Dockerfile.
    tests:
    - f16_help::test_the_entrypoint_script_is_valid_bash
    - f16_help::test_help_lists_every_command_the_cli_offers
    - f16_help::test_every_option_the_help_lists_exists
    - f16_help::test_every_variable_the_help_lists_is_read_by_the_code
    - f16_help::test_help_names_the_variable_for_each_operational_option
    - f16_help::test_help_says_that_no_secrets_are_needed
    - f16_help::test_help_shows_how_to_mount_data_output_and_cache_and_to_run_the_service
    - f16_ref::test_reference_lists_every_command_the_cli_offers
    - f16_ref::test_every_option_the_reference_lists_exists
    - f16_ref::test_every_variable_the_reference_lists_is_read_by_the_code
    - f16_ref::test_the_documented_defaults_match_the_dockerfile
  - do: Review the `push:docker` and `validate:docker` CI jobs.
    expect: Each variant's image builds, and its `test` stage (an install, CLI and wiring smoke test) passes inside the image
      before anything is published.
    tests:
    - 'CI: push:docker'
    - 'CI: validate:docker'
- id: 16-2
  req: FR-16
  name: Container Run
  type: Integration
  business: The built images run the pipeline against mounted directories as a non-root user and report missing mounts.
  conditions:
  - The built CPU image, and a CUDA image (these tests skip when no image is named by `DATAEVAL_FLOW_TEST_IMAGE` and `DATAEVAL_FLOW_TEST_IMAGE_CUDA`)
  - A host directory with a config and data, and an empty output directory
  steps:
  - do: Run the CPU image with the data and output directories mounted.
    expect: The pipeline runs as a non-root user, writes results to `/output`, and the image is for linux/amd64.
    tests:
    - f16_cpu::test_pipeline_runs_against_mounted_directories_as_non_root
    - f16_cpu::test_image_is_built_for_linux_amd64
  - do: Run the image with no data mounted, and with `--help`.
    expect: A usage banner is printed that covers arguments, variables, mounts, commands, and secrets.
    tests:
    - f16_cpu::test_prints_usage_when_nothing_is_mounted_or_help_is_requested
  - do: Run the image with data but no output mount, and with an empty data mount.
    expect: Each exits with code 1 and names the mount that is missing.
    tests:
    - f16_cpu::test_reports_an_output_directory_that_is_not_mounted
    - f16_cpu::test_reports_a_data_mount_that_is_empty
  - do: Run the image with the cache unmounted, then mounted.
    expect: Unmounted, the run succeeds using an in-memory cache; mounted, the cache is used.
    tests:
    - f16_cpu::test_falls_back_to_in_memory_cache_when_cache_is_not_mounted
  - do: Run the image with `DATAEVAL_DATA`, `DATAEVAL_TASKS`, `DATAEVAL_LOG_FORMAT`, `DATAEVAL_VERBOSITY`, and `DATAEVAL_MAX_PROCESSES`
      set, and once with `--task` against `DATAEVAL_TASKS`.
    expect: The variables take effect (relocated data root, one task, plain log format, process limit recorded), and the option
      beats its variable.
    tests:
    - f16_cpu::test_honors_the_environment_variables_and_a_relocated_data_root
    - f16_cpu::test_a_command_line_option_beats_its_environment_variable
  - do: Run a CUDA image without `--gpus all`.
    expect: It exits with code 1 and a message that names the flag and the `cpu` variant.
    tests:
    - f16_cuda::test_exits_with_one_and_names_the_gpu_flag_and_cpu_variant_without_gpu_access
- id: 16-3
  req: FR-16
  name: Container Service
  type: Integration
  business: The same image runs the analysis service, and an orchestrator can probe it.
  conditions:
  - The built CPU image
  - A data directory and a writable output directory
  steps:
  - do: Start the CPU image with `serve`, publish port 8001, and request `/healthz`, `/readyz`, `/livez`, and `/openapi.json`.
    expect: The three probes answer 200 with `ok`, and the API description lists the `/v1/runs` endpoints.
    tests:
    - f16_serve::test_the_published_port_answers_the_health_endpoints_and_describes_its_api
  - do: Read the container reference page and the Dockerfile for the service port and the probes.
    expect: The page documents the port variable, port 8001, and the three probes, and the Dockerfile exposes 8001 and listens
      beyond loopback.
    tests:
    - f16_ref::test_the_reference_documents_the_service_port_and_the_three_health_endpoints
    - f16_docker::test_the_image_starts_the_entrypoint_script_and_exposes_the_service_port
- id: 17-1
  req: FR-17
  name: MAITE Entry Points and Datasets
  type: Integration
  business: MAITE can discover DataEval Flow through its declared entry points, and the datasets Flow loads follow the MAITE
    protocols.
  conditions:
  - DataEval Flow installed
  - Synthetic ImageFolder, COCO, and YOLO datasets
  steps:
  - do: Read the MAITE entry points declared by the installed package.
    expect: Two dataset components and two tasks are declared, as `pyproject.toml` lists them.
    tests:
    - f17_ep::test_declares_maite_entrypoints
  - do: Import each entry-point target.
    expect: Every target imports.
    tests:
    - f17_ep::test_entrypoint_target_importable
  - do: Compare the task entry points with the public functions, and the dataset entry points with the classes `load_dataset`
      returns.
    expect: The task entries are `run_tasks` and `load_dataset`, and the dataset entries are the classes Flow loads image
      classification and object detection datasets with.
    tests:
    - f17_ep::test_the_task_entry_points_are_the_public_functions
    - f17_ep::test_the_dataset_entry_points_are_the_datamaite_classes_flow_loads_with
  - do: Load HuggingFace-layout, ImageFolder, COCO, and YOLO datasets, and check them against the MAITE protocols at run time.
    expect: Each is an instance of the matching MAITE `Dataset` protocol and yields `(image, target, metadata)` triples with
      the documented shapes.
    tests:
    - f17_ds::test_an_image_classification_dataset_yields_image_label_metadata_triples
    - f17_ds::test_an_image_folder_with_labels_satisfies_the_image_classification_protocol_too
    - f17_ds::test_an_object_detection_dataset_yields_image_boxes_metadata_triples
  - do: Run a Flow evaluator on a loaded MAITE dataset.
    expect: The evaluator returns its result with no errors.
    tests:
    - f17_ds::test_a_maite_dataset_runs_through_a_flow_evaluator
- id: 18-1
  req: FR-18
  name: Audit Verdict
  type: Core Functionality
  business: A team can see, before training, whether the data is ready, and why not.
  conditions:
  - DataEval Flow installed
  - Synthetic train and evaluation splits with planted problems
  steps:
  - do: Audit two splits that hold no duplicate, outlier or shared image, with an extractor.
    expect: The verdict is `ready`, and nothing is blocking, warning or not assessed.
    tests:
    - f18_verdict::test_clean_splits_with_an_extractor_are_ready
  - do: Audit two splits that share one image.
    expect: The verdict is `not-ready`, `leakage` is the blocking check, and the verdict line names it.
    tests:
    - f18_verdict::test_an_image_in_two_splits_makes_the_audit_not_ready
  - do: Audit splits where a check that does not block warns (a duplicate in train alone).
    expect: The verdict is `ready-with-caveats`, with the warning listed and nothing blocking.
    tests:
    - f18_verdict::test_a_warning_from_a_check_that_does_not_block_is_ready_with_caveats
  - do: Audit clean splits without an extractor, and a train split alone.
    expect: Each check that could not run is listed as not assessed with its reason (`requires an extractor`, `no evaluation
      split given`), a blocking check among them does not block, and the verdict is `ready-with-caveats`. Train is still judged.
    tests:
    - f18_verdict::test_a_check_that_could_not_run_is_a_caveat_and_never_a_block
    - f18_verdict::test_a_one_split_audit_cannot_assess_the_evaluation_checks
  - do: Audit with a setting that makes a step fail (a leakage factor the metadata lacks).
    expect: The task fails, has no verdict, and its health is `failed`.
    tests:
    - f18_verdict::test_a_failed_audit_has_no_verdict
- id: 18-2
  req: FR-18
  name: Audit Findings and Record
  type: Core Functionality
  business: A reader can find each finding under the question it answers, and can tell exactly what data was audited.
  conditions:
  - DataEval Flow installed
  - Synthetic splits, two and three of them
  steps:
  - do: Read the report of an audit.
    expect: Findings sit under the five questions in order, each finding under the question its check answers, and every check
      the chain runs belongs to a question.
    tests:
    - f18_find::test_the_findings_are_grouped_under_the_five_questions_in_order
    - f18_find::test_each_finding_sits_under_the_question_its_check_answers
    - f18_find::test_every_check_the_chain_runs_belongs_to_a_question
  - do: Read the order of the report's sections, and its next steps.
    expect: The report gives the verdict, the record, the questions and the next steps in that order, and the next steps name
      what to do about each warning.
    tests:
    - f18_find::test_the_report_reads_verdict_then_record_then_questions_then_next_steps
    - f18_find::test_the_next_steps_say_what_to_do_about_each_warning
  - do: Audit three splits.
    expect: Checks over evaluation splits run once per split, and the two evaluation splits are compared with each other as
      a pair.
    tests:
    - f18_find::test_three_splits_pair_their_evaluation_splits
  - do: Read the record and compute each split's content digest with `dataset_digest`.
    expect: The record lists each split's items, labels, classes and metadata factors, and its content digest equals the one
      computed from the data; the digests come from the `content-digest` steps.
    tests:
    - f18_rec::test_the_record_lists_every_split_with_its_content_and_metadata_digests
    - f18_rec::test_the_digests_in_the_record_come_from_the_content_digest_steps
  - do: Read the criteria in the record, and the encoding of each split's metadata.
    expect: The record lists the settings every check was judged by and the blocking checks, and every split's factors are
      encoded like train's.
    tests:
    - f18_rec::test_the_record_lists_the_criteria_the_checks_were_judged_by
    - f18_rec::test_every_split_is_encoded_like_train
- id: 18-3
  req: FR-18
  name: Blocking and Accepted Warnings
  type: Core Functionality
  business: A team decides which problems stop training and records why it accepts the others.
  conditions:
  - DataEval Flow installed
  - Synthetic splits that leak an image, and three splits with outliers
  steps:
  - do: Read the default `blocking:` and set it to an empty list, and to another check.
    expect: '`leakage` and `untrained-classes` block by default; with none a leaking audit is `ready-with-caveats`; naming
      `image-duplicates` makes its warning block.'
    tests:
    - f18_block::test_leakage_and_untrained_classes_block_by_default
    - f18_block::test_an_empty_blocking_list_leaves_a_leaking_audit_ready_with_caveats
    - f18_block::test_naming_another_check_makes_its_warning_block
  - do: Name a blocking check that could not run, and a check the chain does not run.
    expect: The check that could not run is a caveat and does not block; a name the chain has no check for is refused when
      the config loads.
    tests:
    - f18_block::test_a_blocking_check_that_could_not_run_is_a_caveat_not_a_block
    - f18_block::test_a_blocking_entry_that_names_no_check_of_the_chain_is_refused_at_load
    - f18_block::test_a_check_the_settings_leave_out_cannot_be_named
  - do: Accept the blocking warning with a reason.
    expect: The audit is `ready-with-caveats`, the acceptance is recorded with its reason and state `warned` in the verdict
      and the JSON, and the finding stays and still counts in the health.
    tests:
    - f18_acc::test_an_accepted_blocking_warning_leaves_the_audit_ready_with_caveats
    - f18_acc::test_an_accepted_warning_keeps_its_finding_and_still_counts_in_health
    - f18_acc::test_the_acceptance_is_in_the_json_verdict
  - do: Accept a check that did not warn.
    expect: The acceptance is recorded with the state `did-not-warn`.
    tests:
    - f18_acc::test_an_acceptance_of_a_check_that_did_not_warn_is_recorded_as_such
  - do: Accept by check type, and by one evaluation split of a step.
    expect: A check-type key covers every split; a `step[split]` key covers that split only and leaves the other split's warning.
    tests:
    - f18_acc::test_an_acceptance_keyed_by_a_check_type_covers_every_split
    - f18_acc::test_an_acceptance_keyed_by_one_split_leaves_the_other_split_s_warning
  - do: Write an accepted key that names nothing, a blank reason, a `[split]` on a step that runs once, and a split the task
      does not have.
    expect: The first three are refused when the config loads; the last is refused before any step runs.
    tests:
    - f18_acc::test_an_accepted_key_naming_no_check_or_check_step_is_refused_at_load
    - f18_acc::test_a_blank_reason_is_refused_at_load
    - f18_acc::test_a_split_on_a_step_that_runs_once_is_refused_at_load
    - f18_acc::test_a_split_the_task_does_not_have_is_refused_before_any_step_runs
- id: 18-4
  req: FR-18
  name: Audit as a Step
  type: Integration
  business: A team can audit splits that a chain made, such as the parts of a split, in the same run.
  conditions:
  - DataEval Flow installed
  - A synthetic dataset, split by the `splits` workflow type
  steps:
  - do: Run a custom workflow that splits a dataset, collects the evaluation parts and runs `audit` on them.
    expect: The task has a verdict and the five questions, the audit's steps are named `audit/...`, and the record has a column
      for train and each collected part.
    tests:
    - f18_step::test_split_collect_audit_gives_the_task_a_verdict_and_the_five_questions
    - f18_step::test_the_audit_s_steps_run_under_the_step_s_name
    - f18_step::test_the_record_has_a_column_for_train_and_each_collected_part
    - f18_step::test_a_train_test_split_audits_with_the_test_part_alone
  - do: Compare the encoding of each part, and write an acceptance without the step's prefix.
    expect: Every part is encoded like train, and `image-outliers-train` covers `audit/image-outliers-train`.
    tests:
    - f18_step::test_every_part_is_encoded_like_train
    - f18_step::test_an_acceptance_is_written_without_the_step_s_prefix
  - do: Make the splitting step fail so that the audit step never starts.
    expect: The task has no verdict, and `no_verdict`, the JSON and the report say which step did not run.
    tests:
    - f18_step::test_an_audit_step_that_never_started_gives_no_verdict_and_says_why
  - do: Mark the audit step optional, add a second audit step, and bind a list of folds to train.
    expect: Each is refused when the config loads.
    tests:
    - f18_step::test_an_audit_step_may_not_be_optional
    - f18_step::test_a_workflow_runs_one_audit_step
    - f18_step::test_a_list_of_folds_bound_to_the_single_train_slot_is_refused_at_load
- id: 18-5
  req: FR-18
  name: Gating on the Verdict
  type: Integration
  business: A training job can refuse to start unless the audit allows it.
  conditions:
  - DataEval Flow installed
  - Two small image-folder splits, one pair sharing its images
  steps:
  - do: Run the command with `--require ready-with-caveats` on an audit that is not ready.
    expect: The exit code is 4, in this process and in a separate process, and the result holds the verdict.
    tests:
    - f18_gate::test_a_not_ready_audit_exits_4_under_require
    - f18_gate::test_the_command_process_exits_4_when_the_verdict_is_worse_than_required
  - do: Run the same audits without `--require`, and with a verdict at or above the level.
    expect: Without `--require` the exit code does not read the verdict; at or above the level it is 0.
    tests:
    - f18_gate::test_without_require_the_exit_code_does_not_read_the_verdict
    - f18_gate::test_a_verdict_at_or_above_the_required_level_exits_0
  - do: Require a stricter level than the verdict reaches.
    expect: The exit code is 4 for `ready` and for `ready-with-accepted-risks` when a caveat is not an accepted risk.
    tests:
    - f18_gate::test_a_stricter_level_refuses_the_same_audit
    - f18_risk::test_an_unaccepted_warning_fails_the_middle_gate
  - do: Audit data whose only caveat is an accepted warning, and require each level.
    expect: '`ready-with-caveats` and `ready-with-accepted-risks` pass; `ready` exits 4.'
    tests:
    - f18_risk::test_an_audit_whose_only_caveat_is_an_accepted_warning_passes_the_middle_gate_only
  - do: Set the level in the config, in `DATAEVAL_REQUIRE`, and by flag; give a level that is not one of the three.
    expect: The config and the environment each gate the run, the flag overrides the config, and an invalid level is refused.
    tests:
    - f18_gate::test_require_can_be_set_in_the_config_and_the_flag_overrides_it
    - f18_gate::test_require_can_be_set_in_the_environment
    - f18_gate::test_a_level_that_is_not_one_of_the_three_is_refused
  - do: Combine `--require` with `--fail-on-warning`.
    expect: Without `--require` a warning exits 3; with a verdict short of the level the exit code is 4.
    tests:
    - f18_gate::test_fail_on_warning_exits_3_and_a_verdict_short_of_require_takes_precedence
  - do: Run with `--require` on a run whose tasks give no verdict, beside an audit, and with a failed audit.
    expect: A run in which no task gives a verdict is refused with exit 1; a task without a verdict is not judged beside one
      that has; a failed task exits 1.
    tests:
    - f18_nov::test_a_run_in_which_no_task_gives_a_verdict_is_refused_before_any_task_starts
    - f18_nov::test_a_task_that_gives_no_verdict_is_not_judged_beside_one_that_does
    - f18_nov::test_a_failed_task_exits_1_before_the_verdict_gate
- id: 19-1
  req: FR-19
  name: Running a Chain of Steps
  type: Core Functionality
  business: An analyst can write a sequence of evaluations, transforms and checks as one workflow and run it on data.
  conditions:
  - DataEval Flow installed
  - Synthetic datasets in memory, and an image-folder project on disk
  steps:
  - do: Define a workflow with `inputs:` and `steps:` and run it as a task.
    expect: The task returns a `ChainResult` of kind `workflow` named for the workflow.
    tests:
    - f19_run::test_a_workflow_with_inputs_and_steps_and_no_type_runs_as_a_task
  - do: Read the step records of the result.
    expect: Every step is recorded in the order written with its kind, type, status and inputs, and a step reads what an earlier
      step made.
    tests:
    - f19_run::test_every_step_runs_in_the_order_written_and_is_recorded
    - f19_run::test_a_step_reads_what_an_earlier_step_made
  - do: Bind two sources to two inputs, and run one workflow from two tasks.
    expect: Sources bind to inputs in order, and one workflow runs on different sources from different tasks.
    tests:
    - f19_run::test_the_sources_of_a_task_bind_to_the_inputs_in_order
    - f19_run::test_one_workflow_runs_on_different_sources_from_different_tasks
  - do: Read the result JSON and the lineage.
    expect: The JSON lists the steps, the findings and the health; a Dataset a step made is written as its size and digest;
      the lineage names each Dataset, its step, its inputs and its size, and is the same on a repeated run.
    tests:
    - f19_run::test_the_result_json_lists_each_step_the_findings_and_the_health
    - f19_run::test_the_lineage_records_each_dataset_with_its_step_inputs_and_size
    - f19_run::test_the_same_run_gives_the_same_lineage_digests
  - do: Read the text report.
    expect: It names the custom workflow, gives a section to each step with no finding, and ends with a table of the steps.
    tests:
    - f19_run::test_the_report_gives_each_step_without_a_finding_a_section_and_a_steps_table
  - do: Run the chain from the command line with an output directory.
    expect: The result JSON holds the steps, the removed items, the lineage, the findings and the health, and the text report
      names the workflow.
    tests:
    - f19_cli::test_a_chain_run_from_the_command_line_writes_its_steps_lineage_and_findings
- id: 19-2
  req: FR-19
  name: Step Catalog
  type: Core Functionality
  business: An analyst can see which steps exist and what each reads, makes and takes as settings.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Call `list_steps()`.
    expect: Every evaluator, transform, combine, check and workflow type is described, in order of kind and name, with ports,
      description, origin and settings schema.
    tests:
    - f19_catpy::test_list_steps_describes_every_registered_step_of_every_kind
    - f19_catpy::test_the_catalog_is_ordered_by_kind_then_name
    - f19_catpy::test_each_entry_gives_its_ports_description_origin_and_settings_schema
  - do: Read the ports of transforms, and which checks judge which evaluators.
    expect: Ports say what a transform reads and makes, list outputs are marked, and a check names the evaluators it judges
      and the reverse.
    tests:
    - f19_catpy::test_a_transform_s_ports_say_what_it_reads_and_makes
    - f19_catpy::test_a_check_names_the_evaluators_it_judges_and_an_evaluator_the_checks_that_judge_it
    - f19_catpy::test_the_catalog_serializes_to_json
  - do: Run `dataeval-flow steps` and `steps --json`.
    expect: Every step is listed with its kind, ports and description; the JSON holds the whole catalog.
    tests:
    - f19_catcli::test_steps_lists_a_line_per_step_with_its_kind_ports_and_description
    - f19_catcli::test_steps_json_prints_the_whole_catalog
  - do: Run `steps remove`, `steps prioritization` and `steps evaluator:prioritization`, and an unknown name.
    expect: A name prints that step's title, ports and schema; a name two kinds share must be written `KIND:NAME`; an unknown
      name is reported.
    tests:
    - f19_catcli::test_steps_with_a_name_prints_that_step_s_ports_title_and_settings_schema
    - f19_catcli::test_a_name_two_kinds_share_must_be_written_as_kind_and_name
    - f19_catcli::test_an_unknown_name_is_reported
- id: 19-3
  req: FR-19
  name: Transforms
  type: Core Functionality
  business: An analyst can derive a Dataset from another in a chain, such as a split, a merge or a cleaned copy.
  conditions:
  - DataEval Flow installed
  - Synthetic classification and object-detection datasets in memory
  steps:
  - do: Run `view`, `merge` and `collect`.
    expect: '`view` applies the DataEval operations, `merge` concatenates in the order named, and `collect` gathers Datasets
      into a list keyed by name.'
    tests:
    - f19_tr::test_view_applies_dataeval_view_operations
    - f19_tr::test_merge_concatenates_datasets_in_the_order_named
    - f19_tr::test_collect_gathers_datasets_into_a_list_keyed_by_name
  - do: Run `split` and `kfold`.
    expect: '`split` makes disjoint train, val and test parts that cover the Dataset and repeat under a seed; `kfold` makes
      a train and a val per fold and one test, and a step reading the list runs per fold.'
    tests:
    - f19_tr::test_split_makes_train_val_and_test_that_do_not_overlap
    - f19_tr::test_split_is_repeatable_under_a_seed
    - f19_tr::test_kfold_makes_one_train_and_one_val_per_fold_and_a_single_test
  - do: Run `select` on a prioritization ranking.
    expect: It keeps the first items of the ranking, in order.
    tests:
    - f19_tr::test_select_keeps_the_top_of_a_prioritization_ranking
  - do: Run `remove` with a duplicates plan and with an outliers plan.
    expect: It drops what the plan names, and the step reports how many it removed and which plan named them.
    tests:
    - f19_tr::test_remove_drops_what_a_duplicates_plan_names_and_reports_what_it_dropped
    - f19_tr::test_remove_drops_the_outliers_an_outliers_plan_names
  - do: Give `remove` a plan computed on another Dataset.
    expect: The config load refuses it.
    tests:
    - f19_tr::test_remove_refuses_a_plan_computed_on_another_dataset_when_the_config_loads
  - do: Run `wrap` with `DetectionCrops` on a detection Dataset.
    expect: Each box becomes an item of its own.
    tests:
    - f19_det::test_wrap_turns_each_detection_into_an_item_of_its_own
  - do: 'Run `conform` onto an ontology that merges two classes, without and with `allow: lossy`.'
    expect: Without it the step fails naming the classes that collapse and its dependents are skipped; with it the labels
      are relabelled and the collapse is recorded.
    tests:
    - f19_det::test_conform_refuses_a_lossy_alignment_until_allow_says_to_accept_it
  - do: Conform, merge, remove duplicates from and export two detection datasets, with an output directory.
    expect: The cleaned Dataset is written under `datasets/<task>.<step>` with a `provenance.json` that records the sources,
      the label-space changes and the digest of what was written.
    tests:
    - f19_det::test_conform_merge_remove_and_export_make_one_cleaned_dataset_on_disk
  - do: Run `export` with no output directory.
    expect: The step is skipped with the reason `the run has no output directory`, not failed.
    tests:
    - f19_det::test_export_with_no_output_directory_is_skipped_not_failed
- id: 19-4
  req: FR-19
  name: Checks, Combines, Groups and Presets as Steps
  type: Core Functionality
  business: An analyst can judge what a chain found against thresholds, and read the findings under headings.
  conditions:
  - DataEval Flow installed
  - Synthetic datasets in memory
  steps:
  - do: Run a chain of evaluators with no check.
    expect: There are no findings and the health is `ok`.
    tests:
    - f19_chk::test_evaluators_alone_judge_nothing
  - do: Add checks to the chain, and set a threshold beside one.
    expect: Each check judges its evaluator's output, a threshold beside the step changes the severity, and a `null` threshold
      makes the finding `info`.
    tests:
    - f19_chk::test_a_check_judges_an_evaluator_s_output_against_its_thresholds
    - f19_chk::test_a_threshold_written_beside_the_step_changes_the_severity
    - f19_chk::test_a_null_threshold_judges_nothing_and_the_finding_is_info
  - do: Read the health and the report of a chain with a warning.
    expect: The health is `warning` with the count, and each finding has a section holding the evidence it judged.
    tests:
    - f19_chk::test_a_chain_s_health_is_warning_where_a_finding_is_a_warning
    - f19_chk::test_the_report_gives_each_finding_a_section_holding_the_evidence_it_judged
  - do: Give a check a threshold it does not take, and an input it does not judge.
    expect: The config load refuses each.
    tests:
    - f19_chk::test_a_threshold_a_check_does_not_take_is_refused_when_the_config_loads
    - f19_cmb::test_a_check_refuses_an_input_of_a_kind_it_does_not_judge
  - do: Run a check over an input that made nothing.
    expect: The check is not skipped; it makes an `info` finding briefed `not assessed`.
    tests:
    - f19_chk::test_a_check_over_an_input_that_made_nothing_says_not_assessed_instead_of_passing
  - do: Run the `outliers-by-class` combine and the `class-outliers` check that reads it.
    expect: The combine makes an output the check judges, and the check names the worst class.
    tests:
    - f19_cmb::test_a_combine_makes_an_output_a_check_reads
  - do: Add `groups:` to the workflow.
    expect: Findings of the named check types sit under the headings with a status line, the rest follow, and a group naming
      a check no step runs is refused. Groups change the report only and give no verdict.
    tests:
    - f19_grp::test_groups_put_findings_under_headings_with_a_status_line
    - f19_grp::test_findings_of_check_types_no_group_names_follow_the_groups
    - f19_grp::test_a_group_naming_a_check_no_step_runs_is_refused
    - f19_grp::test_groups_change_only_the_report_and_give_no_verdict
  - do: Run the `quality` workflow type as a step and read `cleaning.clean`.
    expect: Its steps run as `cleaning/...`, a later step reads the cleaned Dataset, its findings count toward the health,
      and `cleaning` alone and `cleaning.duplicates` are refused.
    tests:
    - f19_preset::test_a_preset_runs_its_whole_chain_under_the_step_s_name
    - f19_preset::test_a_later_step_reads_the_preset_s_declared_output
    - f19_preset::test_the_preset_s_findings_count_toward_the_chain_s_health
    - f19_preset::test_only_a_declared_output_can_be_read_and_always_by_name
- id: 19-5
  req: FR-19
  name: Lists, Pairs and Per-Class Steps
  type: Core Functionality
  business: An analyst can run one step over many sources, over every pair of them, or class by class.
  conditions:
  - DataEval Flow installed
  - Synthetic datasets in memory, including shifted ones
  steps:
  - do: Bind several sources to a list input and run a step that reads one Dataset on it.
    expect: The step runs once per element, keyed by source name.
    tests:
    - f19_lst::test_the_last_input_binds_every_remaining_source_keyed_by_source_name
  - do: Read one element by its key, read a single Dataset beside a list, and collect named elements.
    expect: One element is read alone, the single Dataset is repeated for each element, and `collect` makes a new keyed list.
    tests:
    - f19_lst::test_a_step_can_read_one_element_by_its_key
    - f19_lst::test_a_single_dataset_beside_a_list_is_repeated_for_each_element
    - f19_lst::test_collect_gathers_named_elements_into_a_new_list
  - do: Run a check once per element.
    expect: Each element has its own finding, and the report groups them under the element's key.
    tests:
    - f19_lst::test_a_check_run_once_per_element_makes_findings_grouped_under_the_element_s_key
  - do: Write an address with a key the task does not bind, a fold that does not exist, an unquoted key in flow style, a step
      with several outputs named whole, and a list that is not last.
    expect: Each is refused when the config loads, or fails to parse.
    tests:
    - f19_adr::test_a_key_the_task_does_not_bind_is_refused_when_the_config_loads
    - f19_adr::test_a_fold_outside_the_folds_the_step_makes_is_refused_when_the_config_loads
    - f19_adr::test_an_address_with_a_key_left_unquoted_in_flow_style_fails_to_parse
    - f19_adr::test_a_step_with_several_outputs_must_be_addressed_by_one_of_them
    - f19_adr::test_only_the_last_input_may_be_a_list
    - f19_adr::test_a_task_whose_sources_do_not_fit_the_inputs_is_refused_when_the_config_loads
  - do: 'Run a step with `pairs: true` over three elements and over one.'
    expect: It runs once per unordered pair in list order, and a list of one gives no pair and a record saying so.
    tests:
    - f19_pair::test_pairs_runs_a_step_once_per_unordered_pair_of_a_list_in_list_order
    - f19_pair::test_a_list_of_one_element_gives_no_pair_and_one_record_saying_so
  - do: Bind no source to a list input that has `empty:`, and one that does not.
    expect: With `empty:` the steps over it make one skipped record with the reason and a check reports it as not assessed;
      without it the task needs at least one source; `empty:` on a single input is refused.
    tests:
    - f19_empty::test_a_list_input_with_empty_may_bind_no_source
    - f19_empty::test_a_check_over_an_empty_list_reports_the_reason_as_not_assessed
    - f19_empty::test_a_list_input_without_empty_needs_at_least_one_source
    - f19_empty::test_empty_on_an_input_that_is_not_a_list_is_refused
  - do: 'Run an evaluator step with `by: class`, a check with `by: class`, and a step with class groups.'
    expect: The evaluator runs once per class and keeps every run in one output; the check judges each key and rolls the findings
      into one; a group is keyed by its name.
    tests:
    - f19_byc::test_by_class_runs_the_step_once_per_class_and_keeps_every_run_in_one_output
    - f19_byc::test_a_check_with_by_class_judges_each_key_and_rolls_the_findings_into_one
    - f19_byc::test_groups_key_each_named_group_instead_of_each_class
- id: 19-6
  req: FR-19
  name: Failed and Optional Steps
  type: Edge Case
  business: One failed step does not hide what the rest of the chain found.
  conditions:
  - DataEval Flow installed
  - A chain with a step made to fail
  steps:
  - do: Run a chain with a step that fails.
    expect: The task fails, the step's error is recorded, and the health is `failed` naming the step.
    tests:
    - f19_fail::test_a_failed_step_fails_the_task_and_says_why
  - do: Look at the steps that read the failed step, and those that do not.
    expect: Dependents are skipped with a reason naming the failed step; independent steps still run.
    tests:
    - f19_fail::test_a_step_that_reads_a_failed_step_is_skipped_with_the_reason
    - f19_fail::test_steps_that_do_not_depend_on_the_failure_still_run
  - do: Read the result of the failed task.
    expect: Every step that ran stays in the result, `output` raises, and the failure is in the report and the JSON.
    tests:
    - f19_fail::test_the_steps_that_ran_stay_in_the_result_but_the_output_is_not_available
    - f19_fail::test_the_failure_is_in_the_report_and_the_json
  - do: 'Mark the failing step `optional: true`.'
    expect: Its failure is a skip, the task succeeds, and the steps that read it are still skipped.
    tests:
    - f19_fail::test_an_optional_step_that_fails_is_a_skip_and_the_task_still_succeeds
  - do: Run a pipeline with the failing chain and a second task, and run the chain from the command line.
    expect: The second task still runs; the command exits 1 and writes the steps that ran.
    tests:
    - f19_fail::test_a_task_whose_steps_fail_does_not_stop_the_next_task
    - f19_cli::test_a_chain_with_a_failed_step_exits_1_and_the_steps_that_ran_are_still_written
- id: 19-7
  req: FR-19
  name: Defining a Workflow
  type: Core Functionality
  business: A mistake in a workflow is found when the config loads, and a workflow built in code can be kept in a file.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Load a valid workflow.
    expect: It loads as a custom workflow with its steps.
    tests:
    - f19_load::test_a_workflow_with_inputs_and_steps_loads
  - do: Load workflows with an unknown evaluator, an unknown address, a step that reads a later step, and a setting the step
      does not take.
    expect: Each is refused with an error naming the step.
    tests:
    - f19_load::test_a_step_naming_an_evaluator_the_config_does_not_define_is_refused
    - f19_load::test_a_step_reading_an_address_that_is_no_input_or_earlier_step_is_refused
    - f19_load::test_a_step_reading_a_step_written_below_it_is_refused
    - f19_load::test_a_setting_the_transform_does_not_take_is_refused
    - f19_load::test_settings_of_an_evaluator_step_belong_in_its_evaluators_entry
  - do: Load workflows with two kinds in a step, a repeated step name, and a plan computed on another Dataset.
    expect: Each is refused.
    tests:
    - f19_load::test_a_step_must_name_exactly_one_kind
    - f19_load::test_two_steps_may_not_share_a_name_nor_a_step_take_an_input_s_name
    - f19_load::test_a_step_may_not_read_the_output_of_a_step_computed_on_another_dataset
  - do: Build a `CustomWorkflowConfig` in Python and run it with `run()`.
    expect: It runs on datasets in memory, with the datasets of a mapping bound to the inputs in order, and returns a `ChainResult`.
    tests:
    - f19_cfg::test_run_executes_a_workflow_built_in_python_on_datasets_in_memory
    - f19_cfg::test_run_binds_the_datasets_of_a_mapping_to_the_inputs_in_order
    - f19_cfg::test_building_the_workflow_checks_its_slots_and_step_names
  - do: Call `to_yaml()` and `save()`, onto a new file, an existing one, a file that is not a pipeline config, and a missing
      directory.
    expect: '`to_yaml()` writes a config fragment; `save()` adds the workflow or replaces the entry of its name, keeps the
      file''s other keys and workflows, and refuses a file that is not a pipeline config and a directory that does not exist.'
    tests:
    - f19_cfg::test_to_yaml_writes_the_workflow_as_a_config_fragment
    - f19_cfg::test_save_adds_the_workflow_and_replaces_the_entry_of_the_same_name
    - f19_cfg::test_save_keeps_the_file_s_other_keys_and_workflows
    - f19_cfg::test_save_refuses_a_file_that_is_not_a_pipeline_config_and_a_missing_directory
  - do: Save a workflow with its evaluator entry beside a pipeline file, load the folder and run it.
    expect: The folder loads as one pipeline and the saved workflow runs on the data.
    tests:
    - f19_cfg::test_a_saved_workflow_loads_beside_the_pipeline_and_runs_on_new_data
- id: 20-1
  req: FR-20
  name: Evaluator Catalog
  type: Core Functionality
  business: A user can see which evaluators exist and what parameters each takes.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Call `list_evaluators()` and `get_evaluator()`.
    expect: Every evaluator type is listed with a description; each config declares its type and its result class; an unknown
      type is refused.
    tests:
    - f20_cat::test_list_evaluators_returns_every_type_with_a_description
    - f20_cat::test_get_evaluator_returns_the_class_named_and_refuses_an_unknown_type
    - f20_cat::test_each_config_declares_its_type_and_the_result_class_it_returns
  - do: Run `dataeval-flow evaluators` and `evaluators --json`.
    expect: Every type is listed with its description, what it consumes and how many sources it takes.
    tests:
    - f20_cat::test_evaluators_command_lists_every_type
    - f20_cat::test_evaluators_json_lists_name_description_inputs_and_source_count
  - do: Run `evaluators duplicates` and `evaluators does-not-exist`.
    expect: The first prints the JSON Schema of the parameters, which forbids unknown ones; the second reports the unknown
      type and lists the installed ones.
    tests:
    - f20_cat::test_evaluators_command_with_a_type_prints_its_parameter_schema
    - f20_cat::test_evaluators_command_refuses_an_unknown_type_and_lists_the_installed_ones
- id: 20-2
  req: FR-20
  name: Running Evaluators
  type: Core Functionality
  business: A user can run any one evaluator on a source without writing a workflow.
  conditions:
  - DataEval Flow installed
  - Synthetic datasets in memory, with a flatten extractor where embeddings are read
  steps:
  - do: Run each evaluator type as a task that names it under `evaluator:`.
    expect: Every task succeeds with a result of kind `evaluator`, naming its type, with a non-empty report and an output
      in one of the three JSON shapes.
    tests:
    - f20_run::test_every_evaluator_type_runs_as_a_task
  - do: Run each evaluator type through `run(config, data)`.
    expect: Each returns the result class of its config, with DataEval's own output.
    tests:
    - f20_run::test_every_evaluator_type_runs_through_run_and_returns_its_config_s_result_class
  - do: Run the same evaluator as a task and through `run()`.
    expect: Both give the same determinations.
    tests:
    - f20_run::test_a_task_and_run_give_the_same_determinations
  - do: Read the envelope of a two-source task.
    expect: It records the evaluator entry, the extractor, and the sources in the order named.
    tests:
    - f20_run::test_a_task_records_the_evaluator_entry_and_extractor_it_ran_with
    - f20_run::test_a_task_keeps_the_sources_it_read_in_the_order_it_named_them
  - do: Run an evaluator that fails beside one that succeeds.
    expect: The failed task is a failed result that records the error, `output` raises, and the other task still runs.
    tests:
    - f20_run::test_a_failing_evaluator_task_is_a_failed_result_and_the_other_tasks_still_run
  - do: Run an evaluator on a source with no items.
    expect: The result has no rows and a report, and does not raise.
    tests:
    - f20_det::test_an_empty_source_gives_a_result_with_no_rows
- id: 20-3
  req: FR-20
  name: Evaluator Results
  type: Core Functionality
  business: A user gets DataEval's determinations as they are, with no verdict a workflow should have made.
  conditions:
  - DataEval Flow installed
  - Synthetic datasets with a planted duplicate, a planted outlier and a shift
  steps:
  - do: Run `duplicates`, `outliers`, `label-health`, `content-digest`, `factor-leakage` and `label-alignment` on data whose
      answer is known.
    expect: 'Each reports what the data holds: the planted duplicate group, the planted outlier, the class counts, the dataset''s
      own content digest, the values each source holds, and a lossless remap.'
    tests:
    - f20_det::test_duplicates_finds_the_planted_exact_group
    - f20_det::test_outliers_flags_the_planted_white_image
    - f20_det::test_label_health_counts_each_class
    - f20_det::test_content_digest_equals_the_digest_of_the_dataset
    - f20_det::test_factor_leakage_lists_the_values_each_source_holds
    - f20_det::test_label_alignment_reports_a_lossless_remap_onto_a_matching_ontology
  - do: Run a drift detector on a shifted source and on an unshifted one.
    expect: It reports drift for the first and none for the second.
    tests:
    - f20_det::test_a_drift_detector_tells_a_shifted_source_from_an_unshifted_one
  - do: Read `result.output`.
    expect: It is the object DataEval returned.
    tests:
    - f20_det::test_the_result_holds_dataeval_s_own_output
  - do: Read the JSON of several evaluator results.
    expect: 'Each has `kind: evaluator` and `metadata` and `output`, with no `health` and no `findings`.'
    tests:
    - f20_env::test_an_evaluator_result_carries_no_health_and_no_findings
  - do: Read the envelope and export the result.
    expect: The envelope names the evaluator, the DataEval version and call, the execution time and the resolved config; the
      exported file holds the same.
    tests:
    - f20_env::test_the_envelope_names_the_evaluator_dataeval_and_the_resolved_config
    - f20_env::test_export_writes_the_result_as_json_with_kind_evaluator
  - do: Read the output of `coverage` and `prioritization`, and of `label-health`.
    expect: Attributes the evaluator names as `output_extras` are written under `extras`; an evaluator that names none writes
      no `extras`.
    tests:
    - f20_env::test_output_extras_are_written_beside_data_where_the_evaluator_names_them
    - f20_env::test_an_evaluator_without_extras_writes_no_extras_key
  - do: Run an evaluator task from the command line with `--fail-on-warning`, on data with a duplicate.
    expect: The exit code is 0, and the result JSON has kind `evaluator` and no health.
    tests:
    - f20_cli::test_an_evaluator_task_writes_a_result_with_no_health_and_never_fails_on_warning
- id: 20-4
  req: FR-20
  name: Evaluator Task Validation
  type: Edge Case
  business: A task that cannot run is refused when the config loads, before any data is read.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Name both a workflow and an evaluator in a task, and neither.
    expect: Each is refused.
    tests:
    - f20_val::test_a_task_naming_both_a_workflow_and_an_evaluator_is_refused
    - f20_val::test_a_task_naming_neither_is_refused
  - do: Name an evaluator that `evaluators:` does not define.
    expect: The load is refused and names the evaluator.
    tests:
    - f20_val::test_a_task_naming_an_evaluator_the_config_does_not_define_is_refused
  - do: Name the wrong number of sources, and leave out a needed extractor.
    expect: Each is refused.
    tests:
    - f20_val::test_a_task_with_the_wrong_number_of_sources_is_refused_at_load
    - f20_val::test_a_task_without_the_extractor_its_evaluator_needs_is_refused_at_load
  - do: Write a misspelled parameter, a value DataEval refuses, and a valid parameter.
    expect: The first two fail the load; the valid one is kept and recorded in the resolved config.
    tests:
    - f20_val::test_an_unknown_parameter_is_refused_not_ignored
    - f20_val::test_a_value_dataeval_refuses_is_refused_when_the_config_loads
    - f20_val::test_a_valid_parameter_is_kept_and_recorded
- id: 21-1
  req: FR-21
  name: Service Interface and Request Validation
  type: Core Functionality
  business: An operator can tell whether the service is healthy, a client can discover what it offers, and a bad request is
    refused with the field that is wrong.
  conditions:
  - DataEval Flow installed with the `service` extra
  - A data root holding a small COCO dataset and a pipeline of two quick tasks over it
  - The service app driven in process through the ASGI test client
  steps:
  - do: Call `/healthz`, `/livez` and `/readyz` on a running service.
    expect: 'Each answers 200 with `{"status": "ok"}`.'
    tests:
    - f21_probes::test_every_probe_answers_200_ok_while_the_service_runs_work
  - do: Stop the queue consumer, then call the three probes.
    expect: Each answers 503 with the reason `queue-stopped`.
    tests:
    - f21_probes::test_a_stopped_queue_fails_every_probe_and_names_the_reason
  - do: Make the run store unusable, then call the three probes.
    expect: '`/readyz` and `/healthz` answer 503 with `store-unavailable`; `/livez` still answers 200.'
    tests:
    - f21_probes::test_an_unusable_run_store_fails_readiness_and_health_but_not_liveness
  - do: Fetch `/openapi.json`.
    expect: It lists the probes, the capabilities and schema routes, and every run, item and selection route, and each operation
      has a unique id.
    tests:
    - f21_iface::test_openapi_json_describes_every_route
    - f21_iface::test_every_operation_has_a_unique_id
  - do: Fetch `/v1/capabilities` and `/v1/schema`.
    expect: Capabilities give the API, Flow and DataEval versions, one active run, the feature versions, the page limit of
      100 and the step catalog. The schema equals `PipelineConfig.model_json_schema()`.
    tests:
    - f21_iface::test_capabilities_give_versions_features_limits_and_every_step
    - f21_iface::test_schema_is_the_json_schema_of_a_pipeline
  - do: Post a valid pipeline to `/v1/validate`, with and without a `tasks` list.
    expect: The response gives the resolved tasks in order and the pipeline snapshot with defaults filled in, and queues nothing.
    tests:
    - f21_valid::test_a_valid_request_is_resolved_without_queueing_anything
    - f21_valid::test_a_named_task_is_resolved_in_the_order_given
  - do: Post requests naming an unknown task, disabling every task, dropping `json` from `result.formats`, requiring a verdict
      no task gives, adding an unknown field, and using a workflow type that does not exist.
    expect: Each is a 422 whose `detail` entries carry `type`, `loc` and `msg`, and `loc` names the field, such as `["body",
      "tasks"]` or `["body", "pipeline", "result", "formats"]`.
    tests:
    - f21_valid::test_a_task_the_pipeline_does_not_define_is_refused_at_body_tasks
    - f21_valid::test_a_pipeline_whose_every_task_is_disabled_is_refused
    - f21_valid::test_results_without_json_are_refused_at_the_formats_field
    - f21_valid::test_a_required_verdict_no_task_gives_is_refused_at_the_require_field
    - f21_valid::test_a_field_the_request_does_not_define_is_refused_by_name
    - f21_valid::test_a_workflow_type_that_does_not_exist_is_refused
  - do: Post a refused request to `/v1/runs`.
    expect: It is a 422 and the run list stays empty.
    tests:
    - f21_valid::test_submitting_a_refused_request_queues_nothing
- id: 21-2
  req: FR-21
  name: Queued Runs, Results, Cancellation and History
  type: Integration
  business: A client queues pipelines, follows them while they run, stops one it no longer wants, and finds the runs again
    after the service restarts.
  conditions:
  - DataEval Flow installed with the `service` extra
  - A data root holding a small COCO dataset and a pipeline of two quick tasks over it
  - Real batch processes for the pipeline runs; stand-in commands for runs that must stay alive, wait or ignore signals
  steps:
  - do: Post a pipeline to `/v1/runs`, wait for it, then read its record, results and artifacts.
    expect: The post answers 202 with a queued record. The run ends `succeeded` with exit code 0 and ordered timestamps, its
      results hold both tasks, and its directory under `<output>/runs/<id>/` holds the snapshot, request, logs, `result.json`
      and the content-digest manifest.
    tests:
    - f21_real::test_a_submitted_pipeline_is_queued_run_and_leaves_its_files_with_the_run
  - do: Post the pipeline with a `tasks` list naming one task.
    expect: Only that task runs and appears in the results.
    tests:
    - f21_real::test_only_the_tasks_named_in_the_request_run
  - do: Post a pipeline whose dataset path does not exist.
    expect: The run ends `failed` with a non-zero exit code, a reason naming it, and a log.
    tests:
    - f21_real::test_a_run_that_fails_is_recorded_as_failed_with_its_exit_code_and_a_reason
  - do: Queue three runs whose process waits for a gate file, then open the gate.
    expect: Only the first runs while the others stay queued; they then run one after another, oldest first, each starting
      after the previous one finished.
    tests:
    - f21_exec::test_runs_start_one_at_a_time_oldest_first
  - do: Run processes that exit with 0, 3, 4 and 1.
    expect: 0, 3 and 4 end `succeeded`; 1 ends `failed`; the exit code is recorded.
    tests:
    - f21_exec::test_the_exit_code_decides_the_final_status
  - do: Run a process killed by SIGKILL and a command that does not exist.
    expect: Both end `failed`, with the reasons "killed by signal 9" and "could not start".
    tests:
    - f21_exec::test_a_run_killed_by_a_signal_or_never_started_is_failed_with_a_reason
  - do: Set `DATAEVAL_REQUIRE` in the service's environment and run a process that lists its `DATAEVAL_*` variables.
    expect: The process sees none.
    tests:
    - f21_exec::test_a_service_setting_in_the_environment_never_reaches_a_run
  - do: Start a second queue consumer on the output directory of a running service.
    expect: It is refused with "Another service is running the queue".
    tests:
    - f21_exec::test_only_one_service_may_run_the_queue_of_an_output_directory
  - do: Read `/results` of a running run before and after a task's result file is written.
    expect: It is a 409 first, then returns the finished task's result while the run is still `running`.
    tests:
    - f21_res::test_a_running_run_shows_the_tasks_it_has_finished
  - do: Run the batch command on a two-task pipeline and read `result.json` after each task finishes.
    expect: It holds the first task alone, then both.
    tests:
    - f21_res::test_the_batch_command_rewrites_result_json_to_hold_each_task_as_it_finishes
  - do: Run with `result.per_task` and read `/results`.
    expect: The per-task files are merged into one object keyed by task.
    tests:
    - f21_res::test_per_task_result_files_are_merged_into_one_object
  - do: Write a console log larger than 64 KiB and read `/logs`.
    expect: Exactly the last 64 KiB come back, ending with the latest line.
    tests:
    - f21_res::test_logs_return_the_last_64_kib_of_the_console_output
  - do: Request an artifact by a path that leaves the run directory, by a missing name and by a real name.
    expect: The first two are 404; the third is served.
    tests:
    - f21_res::test_an_artifact_outside_the_run_s_directory_is_not_found
  - do: Call each run route, and cancel, for a run id that does not exist.
    expect: Every one is a 404.
    tests:
    - f21_res::test_an_unknown_run_is_not_found_on_every_run_route
  - do: Cancel a queued run behind a running one.
    expect: It is `cancelled` at once, with no start time.
    tests:
    - f21_cancel::test_a_queued_run_is_cancelled_without_ever_starting
  - do: Cancel the running run while another is queued.
    expect: The cancel answers 202, the run ends `cancelled` with a finish time, and the queued run then starts.
    tests:
    - f21_cancel::test_a_running_run_is_stopped_and_the_next_queued_run_starts
  - do: Cancel a run whose process ignores SIGTERM.
    expect: It goes to `cancelling` and then to `cancelled` once the process is killed.
    tests:
    - f21_cancel::test_a_run_that_ignores_the_stop_signal_is_killed
  - do: Cancel a run that has already been cancelled.
    expect: The answer is 409 "already finished" and the record is unchanged.
    tests:
    - f21_cancel::test_cancelling_a_finished_run_is_refused_with_409
  - do: Finish three runs, list `/v1/runs`, then start a new service on the same output directory and list again.
    expect: Both lists hold the three runs newest first, with the same statuses and snapshots.
    tests:
    - f21_hist::test_history_lists_every_run_newest_first_and_a_restarted_service_reads_it_back
  - do: Stop the service while one run is running and another is queued, then start it again.
    expect: The running run is `interrupted` with "The service stopped mid-run" and cannot be cancelled; the queued run runs
      to `succeeded`.
    tests:
    - f21_hist::test_stopping_the_service_interrupts_the_running_run_and_keeps_the_queued_ones
  - do: Start a service on an output directory whose store holds a run still marked `running`.
    expect: The run is marked `interrupted`.
    tests:
    - f21_hist::test_a_run_lost_to_a_crash_is_marked_interrupted_when_the_service_starts_again
  - do: Update the record of a run that has failed.
    expect: The record is unchanged.
    tests:
    - f21_hist::test_a_finished_record_never_changes
- id: 21-3
  req: FR-21
  name: Evidence Served From a Run
  type: Integration
  business: A reviewer can open the images, boxes and flagged rows behind a finding, and is told when the data has changed
    since the run read it.
  conditions:
  - DataEval Flow installed with the `service` extra
  - Two finished runs through a real service over a 12-image COCO detection dataset, one with a `content-digest` task and
    one without
  - A private copy of the data and output for each test, so a test can edit the data
  steps:
  - do: Read item 11 of the source.
    expect: It is `verified`, with its size, `xyxy` box, label and class, metadata and image URL.
    tests:
    - f21_items::test_an_item_is_served_with_its_boxes_labels_and_metadata
  - do: Read the items in pages of five.
    expect: The pages total 12 and visit each index once in order.
    tests:
    - f21_items::test_pages_visit_every_item_once_in_the_order_the_run_read_them
  - do: Ask for a page of 101 items, an unknown source and an index past the end.
    expect: The page is a 422; the source and the index are 404.
    tests:
    - f21_items::test_a_page_larger_than_the_limit_is_refused
    - f21_items::test_an_unknown_source_or_index_is_not_found
  - do: Edit one image, edit one image's metadata, and delete another image's file, then read those items.
    expect: They report `input_changed`, `input_changed` and `input_unavailable` with a reason; the item next to an edited
      one is still `verified`.
    tests:
    - f21_manifest::test_an_edited_image_is_reported_changed_and_its_neighbours_stay_verified
    - f21_manifest::test_edited_metadata_is_reported_changed
    - f21_manifest::test_a_removed_image_file_is_reported_unavailable_with_a_reason
  - do: Read items of the run that had no `content-digest` task.
    expect: The page and the item report `evidence_unavailable`, with a reason and no items.
    tests:
    - f21_manifest::test_a_run_without_a_content_digest_task_has_no_evidence_to_serve
  - do: Restart the service twice and read an item.
    expect: The item is still `verified`.
    tests:
    - f21_manifest::test_items_are_found_again_after_the_service_restarts
  - do: Fetch an item's image, with `target` and with `max_side`.
    expect: The image is a PNG with the source's own pixels; the target gives the box with its margin (7 by 6); the shrunk
      image fits 24 pixels across.
    tests:
    - f21_images::test_an_image_is_served_as_a_png_of_the_item
    - f21_images::test_a_box_can_be_cropped_with_a_margin
    - f21_images::test_an_image_can_be_shrunk_to_fit_a_side
  - do: Ask for a box the item does not hold, and for the image of a changed item.
    expect: The box is a 404; the changed item's image is a 409 that carries `input_changed`.
    tests:
    - f21_images::test_a_box_the_item_does_not_hold_is_not_found
    - f21_images::test_the_image_of_a_changed_item_is_refused_with_its_status
  - do: Select each bin of a profile field in turn.
    expect: Each selection holds as many rows as its histogram bin counts, and the bins together hold every item.
    tests:
    - f21_sel::test_each_bin_selects_what_its_histogram_counts_and_together_they_hold_every_item
  - do: Select a range with a minimum and a maximum.
    expect: The minimum is included and the maximum excluded.
    tests:
    - f21_sel::test_a_range_includes_its_minimum_and_excludes_its_maximum_by_default
  - do: Page through a selection and repeat the request, also after a restart.
    expect: The pages hold each member once, naming source, item and value; the same request gives the same id.
    tests:
    - f21_sel::test_pages_hold_every_member_once_and_name_the_source_item_and_value
    - f21_sel::test_the_same_request_gives_the_same_id_before_and_after_a_restart
  - do: Select the flagged rows of an outliers task.
    expect: The selection holds every row, and each member carries its metric, value, bound and direction.
    tests:
    - f21_sel::test_flagged_outliers_are_selected_with_their_metric_and_bound
  - do: Fetch the view of an image selection and load it with the run's datasets.
    expect: The new source loads with as many items as the selection holds.
    tests:
    - f21_sel::test_an_image_selection_becomes_a_source_a_later_pipeline_can_load
  - do: Select with an unknown field, a bin that does not exist, an unknown task and rows from a profile.
    expect: Each is a 422 whose `loc` names the field of the request.
    tests:
    - f21_sel::test_a_selection_the_run_cannot_answer_is_refused_with_where_in_the_request
  - do: Read an unknown selection and select from an unknown run.
    expect: Both are 404.
    tests:
    - f21_sel::test_an_unknown_selection_or_run_is_not_found
- id: 21-4
  req: FR-21
  name: Serve Command
  type: Core Functionality
  business: An operator starts the service from the command line, configures it with options or variables, and is told before
    it serves if the setup is wrong.
  conditions:
  - DataEval Flow installed with the `service` extra
  - An empty data root and an output directory
  steps:
  - do: Run `dataeval-flow serve --help`.
    expect: The help documents the five options, their `DATAEVAL_*` variables and the probe and interface endpoints.
    tests:
    - f21_serve::test_help_documents_its_options_environment_variables_and_endpoints
  - do: Run `serve` with no `--output`, and with a data root that does not exist.
    expect: Each exits 1, naming `--output` and "Data root not found".
    tests:
    - f21_serve::test_serving_without_an_output_directory_is_refused
    - f21_serve::test_serving_with_a_data_root_that_does_not_exist_is_refused
  - do: Set `DATAEVAL_SERVICE_HOST`, `DATAEVAL_SERVICE_PORT` and `DATAEVAL_OUTPUT`, then run `serve --port 8123`.
    expect: The service is started with the port from the option and the host and output from the variables.
    tests:
    - f21_serve::test_a_command_line_option_overrides_its_environment_variable
  - do: Start `serve` as a process and call `/healthz`, `/livez`, `/readyz`, `/openapi.json` and `/v1/capabilities` over HTTP.
    expect: The probes answer 200 `ok` and the interface and capabilities are served.
    tests:
    - f21_http::test_a_started_service_answers_its_probes_and_publishes_its_interface
  - do: Start a second `serve` on the output directory of the first.
    expect: It exits 3 and says another service is running the queue.
    tests:
    - f21_http::test_a_second_service_on_the_same_output_directory_exits_3
  - do: Send SIGTERM to the running service.
    expect: It shuts down gracefully ("Application shutdown complete").
    tests:
    - f21_http::test_sigterm_shuts_the_service_down_gracefully
- id: 22-1
  req: FR-22
  name: Dataset Digest and Manifest
  type: Core Functionality
  business: A team can prove whether the data it holds is the data a run read, and see which items differ when it is not.
  conditions:
  - DataEval Flow installed
  - In-memory classification datasets of six distinct images with unique metadata ids
  steps:
  - do: Compute `dataset_digest` of a dataset.
    expect: It has 64-character content and metadata digests, six items and scheme 1.
    tests:
    - f22_digest::test_digest_holds_both_hashes_the_item_count_and_the_scheme
  - do: Compute it twice, and for the same items in reverse order.
    expect: The digests are equal.
    tests:
    - f22_digest::test_digest_is_repeatable_and_ignores_item_order
  - do: Change one pixel, flip a label, remove an item, and repeat an item.
    expect: The content digest changes each time; the metadata digest changes with a pixel edit, a removal and a repeat.
    tests:
    - f22_digest::test_editing_one_pixel_changes_both_digests
    - f22_digest::test_editing_a_label_changes_the_content_digest
    - f22_digest::test_removing_or_repeating_an_item_changes_both_digests
  - do: Rename a class, edit an item's metadata, and swap the metadata of two items.
    expect: Renaming changes only the content digest; both metadata changes alter only the metadata digest.
    tests:
    - f22_digest::test_renaming_a_class_changes_the_content_digest_only
    - f22_digest::test_editing_metadata_changes_the_metadata_digest_only
    - f22_digest::test_moving_metadata_between_items_changes_the_metadata_digest_only
  - do: Digest metadata given as NumPy values and as the equal Python values.
    expect: The digests are equal.
    tests:
    - f22_digest::test_equal_metadata_in_numpy_and_python_forms_digests_alike
  - do: Digest detection targets that differ in score, and in label.
    expect: A different score gives the same digest; a different label gives another.
    tests:
    - f22_digest::test_detection_digest_covers_boxes_and_labels_but_not_scores
  - do: Digest metadata holding an arbitrary object, and an empty dataset.
    expect: The object raises `TypeError` ("no stable form"); the empty dataset digests with zero items and its class names
      still count.
    tests:
    - f22_digest::test_a_value_with_no_stable_form_is_refused
    - f22_digest::test_an_empty_dataset_digests_and_its_class_names_still_count
  - do: Build a manifest with `dataset_manifest`.
    expect: It has one entry per item with its index, `id` and position, the same digest as `dataset_digest`, and the class
      names.
    tests:
    - f22_manifest::test_manifest_has_one_entry_per_item_and_the_digest_dataset_digest_gives
  - do: Save a manifest and load it, then load one rewritten with scheme 99.
    expect: The first reads back equal; the second raises a `ValueError` naming the scheme.
    tests:
    - f22_manifest::test_manifest_reads_back_as_written
    - f22_manifest::test_manifest_of_another_digest_scheme_is_refused
  - do: Compare a manifest with itself, with a dataset with one edited item, with one item removed and one added, and with
      renamed classes.
    expect: Equal data gives an empty diff; the others give `changed=(3,)`, `missing=(5,)`, `added=(99,)` and `classes=True`.
    tests:
    - f22_manifest::test_the_same_items_compare_equal
    - f22_manifest::test_an_edited_item_is_named_as_changed_by_its_id
    - f22_manifest::test_a_dropped_item_is_named_as_missing_and_an_extra_one_as_added
    - f22_manifest::test_renamed_classes_are_reported
  - do: Compare datasets whose items carry no ids.
    expect: The differing item is named by index, as missing and as added.
    tests:
    - f22_manifest::test_items_without_unique_ids_are_named_by_index
- id: 22-2
  req: FR-22
  name: Content Digest Task and Verify
  type: Integration
  business: A run records what data it read, and anyone can later check a copy of the data against that record.
  conditions:
  - DataEval Flow installed
  - A six-image COCO dataset and a pipeline with one `content-digest` task over it, run once with an output directory
  steps:
  - do: Run the `content-digest` evaluator on an in-memory dataset.
    expect: The result succeeds and its digests equal those of `dataset_digest`.
    tests:
    - f22_eval::test_evaluator_gives_the_digests_dataset_digest_gives
  - do: Run the pipeline and read `result.json` and `result.txt`.
    expect: The task's digests equal those of the loaded dataset (six items) and the text report shows the item count and
      both digests.
    tests:
    - f22_eval::test_a_pipeline_task_records_the_digests_of_its_source_in_its_result
    - f22_eval::test_the_text_report_shows_the_item_count_and_digests
  - do: Load `results/manifests/digest/content-digest.json`.
    expect: Its digest equals the dataset's and the one in the result, it names the source `data`, and it holds six entries
      with index, id, position and two 64-character hashes.
    tests:
    - f22_written::test_the_task_writes_a_manifest_named_for_it
    - f22_written::test_the_manifest_names_its_source_and_each_item_s_id_and_hashes
    - f22_written::test_the_manifest_digest_equals_the_digest_in_the_result
  - do: Run a pipeline with two `content-digest` tasks over different datasets.
    expect: Each task has its own manifest.
    tests:
    - f22_written::test_each_content_digest_task_has_its_own_manifest
  - do: Run the pipeline with no output directory.
    expect: The digest is printed, and no file is written.
    tests:
    - f22_written::test_a_run_without_an_output_directory_prints_the_digest_and_writes_no_manifest
  - do: Run `dataeval-flow verify` on the unchanged data.
    expect: It exits 0 and reports that the source holds the 6 items.
    tests:
    - f22_verify::test_unchanged_data_matches_its_manifest
  - do: Verify a copy of the data after inverting one image, removing one image, adding one image, and renaming a class.
    expect: 'Each exits 1 with MISMATCH and names "Changed: 1 (4)", "Missing: 1 (5)", "Added: 1 (9)" and "The class names
      differ." respectively.'
    tests:
    - f22_verify::test_an_edited_image_is_named_as_changed
    - f22_verify::test_a_removed_item_is_named_as_missing
    - f22_verify::test_an_added_item_is_named_as_added
    - f22_verify::test_renamed_classes_are_reported
  - do: Verify with a manifest that does not exist and with a source the config does not define.
    expect: Each exits 1 with an error and no traceback.
    tests:
    - f22_verify::test_a_manifest_that_cannot_be_read_is_an_error
    - f22_verify::test_a_source_the_config_does_not_define_is_an_error
- id: 22-3
  req: FR-22
  name: Dataset Export
  type: Integration
  business: A conformed dataset leaves the tool in a standard format, with a record that ties it to the run that made it.
  conditions:
  - DataEval Flow installed
  - A six-image COCO detection dataset and a pipeline exporting it in each of the four formats
  steps:
  - do: Run the pipeline with an output directory.
    expect: Each format is written under `datasets/<name>/` with its layout (COCO annotations file, YOLO `data.yaml`, Hugging
      Face `metadata.jsonl`, VisDrone split root) and six images.
    tests:
    - f22_fmt::test_each_format_is_written_under_datasets_with_its_layout
  - do: Load the COCO, YOLO and Hugging Face exports with `load_dataset`.
    expect: Each holds six items.
    tests:
    - f22_fmt::test_a_written_dataset_loads_back_with_every_item
  - do: Run a pipeline that has exports and no tasks, and one run without an output directory.
    expect: The first still writes its export; the second writes nothing.
    tests:
    - f22_fmt::test_a_pipeline_with_exports_and_no_tasks_still_writes_them
    - f22_fmt::test_a_run_with_no_output_directory_writes_no_export
  - do: Read each export's `provenance.json`.
    expect: It holds one write, with the tool and version, the time, the source and the operand's dataset.
    tests:
    - f22_prov::test_every_format_gets_a_provenance_record_of_one_write
  - do: Compare the recorded digest of the COCO, YOLO and Hugging Face exports with `dataset_digest` of the export loaded
      back.
    expect: The content and metadata digests and the six items match.
    tests:
    - f22_prov::test_the_recorded_digest_is_what_a_reader_loading_the_export_computes
  - do: Read the VisDrone export's record.
    expect: The digest is null and the reason is "Flow can't read visdrone back".
    tests:
    - f22_prov::test_a_format_flow_cannot_read_back_records_no_digest_and_says_why
  - do: Read the operand entry of an export of a dataset that declares `provenance:`, and the COCO annotation file's `info`
      block.
    expect: The operand carries the facts as written; the `info` block names the source.
    tests:
    - f22_prov::test_each_operand_carries_its_dataset_s_provenance_facts
    - f22_prov::test_coco_also_embeds_the_record_in_its_own_info_block
  - do: Run the same export again into its occupied destination.
    expect: The run exits non-zero with "already exists and is not empty" and the destination is unchanged.
    tests:
    - f22_modes::test_an_occupied_destination_is_refused_and_left_as_it_was
  - do: Run it again with `mode` set to `replace`, with a stale file in the destination, and with `mode` set to `append`.
    expect: Replace removes the stale file and records one write. Append records two writes, and the last digest equals the
      digest of the destination loaded back.
    tests:
    - f22_modes::test_replace_clears_the_destination_and_records_one_write
    - f22_modes::test_append_writes_into_the_destination_and_records_both_writes
  - do: Export a classification source and an object-detection source in one run.
    expect: The classification export fails with its name in the log and the run exits non-zero, and the other export is written.
    tests:
    - f22_modes::test_a_failed_export_does_not_cost_the_run_its_other_exports
  - do: Build `ExportConfig` with defaults, with names that are not one directory segment, and with an unknown format and
      mode.
    expect: Defaults are `coco` and `error`; the names and the unknown values raise a `ValidationError`.
    tests:
    - f22_cfg::test_defaults_are_coco_and_refusing_an_occupied_destination
    - f22_cfg::test_a_name_that_is_not_one_directory_segment_is_refused
    - f22_cfg::test_an_unknown_format_or_mode_is_refused_at_load
- id: 22-4
  req: FR-22
  name: Dataset Provenance Facts
  type: Core Functionality
  business: Facts about a dataset that no tool can measure, such as its owner and licence, travel with every result.
  conditions:
  - DataEval Flow installed
  - A COCO dataset entry that declares `provenance:`
  steps:
  - do: Build a dataset entry with text, number and boolean facts, and one without `provenance:`.
    expect: The facts are kept as given; the second entry has none.
    tests:
    - f22_facts::test_a_dataset_entry_takes_names_mapped_to_text_numbers_and_booleans
    - f22_facts::test_provenance_is_optional
  - do: Give a nested value.
    expect: The entry is refused with a `ValidationError` naming `provenance`.
    tests:
    - f22_facts::test_a_nested_value_is_refused
  - do: Load YAML in which a fact is a date.
    expect: The date is kept as ISO 8601 text.
    tests:
    - f22_facts::test_a_yaml_date_is_kept_as_iso_text
  - do: Run a pipeline over the dataset and read the result's resolved configuration.
    expect: The source's dataset configuration holds the facts as written.
    tests:
    - f22_facts::test_a_result_records_the_facts_as_written_in_its_resolved_config
  - do: Compare the dataset cache key with and without `provenance:`.
    expect: The keys are equal.
    tests:
    - f22_facts::test_provenance_is_no_part_of_the_dataset_s_cache_key
- id: 31-1
  req: NFR-1
  name: Platform Compatibility
  type: Core Functionality
  business: DataEval Flow installs and runs on every supported Python version, installer, and hardware configuration.
  conditions:
  - CI pipeline results for Python 3.11 through 3.14
  - A host with CUDA hidden
  steps:
  - do: Run the version checks on the current Python version.
    expect: The version is inside `Requires-Python` and the package imports.
    tests:
    - n1_pyver::test_running_on_supported_version
    - n1_pyver::test_import_succeeds_on_current_version
  - do: Compare the supported versions in `pyproject.toml`, the installed metadata, the trove classifiers, the CI matrices,
      `environment.yml`, and the container variants.
    expect: They name the same four versions.
    tests:
    - n1_pyver::test_requires_python_admits_exactly_the_supported_versions
    - n1_pyver::test_the_trove_classifiers_name_the_supported_versions
    - n1_pyver::test_the_ci_test_and_verify_matrix_covers_every_supported_version
    - n1_pyver::test_the_conda_environment_and_container_use_a_supported_python
  - do: Review the `test` and `verify` CI jobs across the Python matrix.
    expect: The unit and verification suites pass on every supported version.
    tests:
    - 'CI: test'
    - 'CI: verify'
  - do: Review the `install:pip`, `install:conda`, and `install:lock` CI jobs.
    expect: Installs with pip and conda succeed and the lock file resolves for uv.
    tests:
    - 'CI: install:pip'
    - 'CI: install:conda'
    - 'CI: install:lock'
  - do: Run a pipeline with a PyTorch extractor and no `device` setting, with CUDA hidden, then ask for a GPU.
    expect: The pipeline runs on the CPU and records `cpu` as its device, and the request for a GPU is refused with a message.
    tests:
    - n1_cuda::test_workflow_runs_on_cpu_when_cuda_is_hidden
- id: 32-1
  req: NFR-2
  name: Package Distribution
  type: Core Functionality
  business: The released wheel has the right contents and metadata.
  conditions:
  - The build configuration and an installed copy of the package
  steps:
  - do: Read the build configuration.
    expect: The build uses `hatchling`, the version comes from the repository tags, and the wheel and the source distribution
      include only the package source.
    tests:
    - n2_build::test_the_build_follows_pep_517_and_518
    - n2_build::test_the_wheel_and_sdist_include_only_the_package_source
    - n2_build::test_the_version_comes_from_the_repository_tags_and_is_not_declared_by_hand
  - do: Inspect the installed package contents.
    expect: The `py.typed` marker is present and no `tests/` or `verification/` files are included.
    tests:
    - n2_meta::test_py_typed_marker_present
    - n2_meta::test_no_test_files_in_installed_package
    - n2_meta::test_no_test_or_verification_file_is_recorded_for_the_distribution
  - do: Read the version and metadata.
    expect: The version is valid PEP 440 and equals `__version__`; name, `Requires-Python`, the MIT license, and the project
      links are set.
    tests:
    - n2_meta::test_version_is_valid_pep440
    - n2_meta::test_the_package_reports_the_version_the_metadata_records
    - n2_meta::test_package_name
    - n2_meta::test_requires_python
    - n2_meta::test_license_set
    - n2_meta::test_the_metadata_names_the_readme_and_project_urls
  - do: Review the `install:pip` and `install:lock` CI jobs and the `release:check-pypi` job of a tagged pipeline.
    expect: The package installs under pip, the lock file resolves for uv, and the tag's package appears on PyPI.
    tests:
    - 'CI: install:pip'
    - 'CI: install:lock'
    - 'CI: release:check-pypi'
- id: 33-1
  req: NFR-3
  name: Type Safety
  type: Core Functionality
  business: DataEval Flow ships complete type information that downstream projects can check.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Check for the `py.typed` marker.
    expect: The marker exists.
    tests:
    - n3_types::test_py_typed_marker_present
  - do: Read `__all__` of the package and of every public module, and import every name in it.
    expect: Each `__all__` is defined without repeated names and every name imports.
    tests:
    - n3_types::test_top_level_all_defined
    - n3_api::test_top_level_all_exports
    - n3_api::test_all_exports_are_importable
    - n3_api::test_every_name_a_public_module_lists_in_all_imports_from_it
    - n3_api::test_run_tasks_run_and_load_config_present
  - do: Import each extension-point base class from the path the documentation names.
    expect: Each is exported there.
    tests:
    - n3_api::test_each_extension_point_is_exported_where_it_is_documented
  - do: Call `run` with an evaluator configuration, and test a dataset against the MAITE dataset protocol.
    expect: '`run` returns the result class of its configuration, and the protocol can be tested at run time.'
    tests:
    - n3_types::test_run_returns_the_result_class_of_the_config_it_was_given
    - n3_types::test_maite_dataset_protocol_is_runtime_checkable
  - do: Review the `type-check` CI job.
    expect: '`pyright` passes with zero errors on `src/` and `tests/`.'
    tests:
    - 'CI: type-check'
- id: 34-1
  req: NFR-4
  name: Reproducibility and Logging
  type: Core Functionality
  business: A seeded configuration gives repeatable results, and DataEval Flow logs through the standard framework.
  conditions:
  - DataEval Flow installed
  - A pipeline whose source view shuffles the images with the pipeline seed
  steps:
  - do: Run the same config twice, then a changed config.
    expect: The first two runs match and the changed config differs.
    tests:
    - n4_repro::test_same_config_produces_identical_output
    - n4_repro::test_different_config_produces_different_output
  - do: Run the same config with the same seed twice, and with other seeds.
    expect: The same seed gives identical output, and the seed is what changes which images are kept.
    tests:
    - n4_seed::test_same_seed_reproduces_stochastic_output
    - n4_repro::test_a_different_seed_changes_which_images_are_kept
  - do: Check how the seed is applied and recorded.
    expect: The seed is applied to DataEval, `deterministic` switches PyTorch to deterministic algorithms, the seed is recorded
      in the envelope, and an unseeded run records none.
    tests:
    - n4_seed::test_seed_defaults_to_none
    - n4_seed::test_seed_is_applied_to_dataeval
    - n4_seed::test_deterministic_forces_pytorch_deterministic_algorithms
    - n4_seed::test_seed_recorded_in_result_envelope
    - n4_seed::test_unseeded_run_records_no_seed
  - do: Run the same task alone and after another task.
    expect: The seed is applied once per task and the result does not depend on which tasks ran before it.
    tests:
    - n4_seed::test_seed_is_applied_per_task_independent_of_task_order
  - do: Check the module loggers and the root logger.
    expect: Module loggers are standard loggers named `dataeval_flow.*`, importing the package adds no root handler, and `setup_logging`
      adds one handler once.
    tests:
    - n4_log::test_logging_module_exports_setup
    - n4_log::test_module_logger_is_logging_logger
    - n4_log::test_importing_the_package_attaches_no_root_handler
    - n4_log::test_setup_logging_attaches_root_handler
  - do: Run the CLI with each `--log-format`, with `DATAEVAL_LOG_FORMAT`, and with an output directory.
    expect: Records carry the UTC timestamp and level in the selected format, the option beats the variable, and `result.log`
      holds timestamped records including DEBUG.
    tests:
    - n4_log::test_console_records_carry_utc_timestamp_and_level_for_each_log_format
    - n4_log::test_the_log_format_comes_from_the_environment_and_the_option_beats_it
    - n4_log::test_a_run_writes_a_debug_log_with_utc_timestamps_beside_its_results
- id: 35-1
  req: NFR-5
  name: Performance and Scale
  type: Performance
  business: Memory use follows the size of the stored results, cached reruns reuse earlier work, and reference pipelines are
    checked against their time budgets for regressions.
  conditions:
  - A 10,000-image synthetic dataset
  - Reference hardware for the pipeline runner
  - Budgets set from development-machine measurements (see the requirement's notes)
  steps:
  - do: Run the `quality` preset at two dataset sizes and on larger images, and record peak memory.
    expect: Peak memory grows with the stored statistics (reference about 8 KB per 32x32 image) and, for 224x224 images, stays
      below the size of the raw pixels, because datasets are read lazily.
    tests:
    - n5_scale::test_peak_memory_follows_stored_results_not_dataset_size
  - do: Run a pipeline twice with a cache directory.
    expect: The second run reuses the cached artifacts and is faster (reference about 17 times at 1,000 images).
    tests:
    - n5_scale::test_warm_cache_rerun_reuses_artifacts_and_is_faster
  - do: Run a pipeline with `max_processes` set in the config, by flag, and by environment variable, and with none set; run
      it in the container.
    expect: Each setting reaches DataEval's `set_max_processes` for every task and appears in `resolved_config`, the flag
      beats the variable and the config field, and with none set DataEval's default stands.
    tests:
    - n5_maxp::test_config_field_reaches_dataeval_for_every_task_and_is_recorded
    - n5_maxp::test_no_setting_leaves_dataeval_default
    - n5_maxp::test_flag_and_variable_reach_dataeval_for_every_task_and_are_recorded
    - n5_maxp::test_flag_overrides_the_config_field
    - f16_cpu::test_honors_the_environment_variables_and_a_relocated_data_root
  - do: Run `quality` on 224x224 images (200 in the automated check) at 1 process and at 4 processes.
    expect: Both times are recorded. The development-machine ratio at 4 processes was 0.43 of the single-process time; the
      result is reported, not gated, because the benefit varies by platform.
    tests:
    - n5_scale::test_quality_time_at_one_and_four_processes_is_recorded
  - do: Time the `quality` preset, with and without cluster-based outlier detection, on the 10,000-image dataset.
    expect: 'Each completes within its budget: 60 s and 90 s, about eight times the development-machine measurements of 7.7
      s and 10.6 s.'
    tests:
    - n5_scale::test_reference_pipeline_completes_within_budget
- id: 36-1
  req: NFR-6
  name: Error Handling
  type: Edge Case
  business: Bad input and failing tasks produce clear errors and an exit code that scripts can detect.
  conditions:
  - DataEval Flow installed
  - A project with a task that fails while it runs
  steps:
  - do: Run the CLI with a missing config, a data root with no config, a missing data directory, and invalid configs.
    expect: Each prints a clear error that names the problem and exits with code 1.
    tests:
    - n6_input::test_missing_config_reports_an_error_and_exits_nonzero
    - n6_input::test_a_data_root_with_no_config_reports_an_error_and_exits_nonzero
    - n6_input::test_missing_data_directory_reports_an_error_and_exits_nonzero
    - n6_input::test_invalid_config_reports_an_error_and_exits_nonzero
    - n6_input::test_a_task_naming_an_undefined_workflow_is_refused_before_anything_runs
  - do: Run the CLI with a malformed environment variable and with an unknown task name.
    expect: The variable is named, and the unknown task is reported with the defined ones.
    tests:
    - n6_input::test_a_malformed_environment_variable_is_reported_by_name
    - n6_input::test_naming_a_task_the_config_does_not_define_is_reported_with_the_known_ones
  - do: Run a pipeline in which one task fails while two others succeed, and one in which all succeed.
    expect: The failure is in that task's result with its failed step, the other tasks run, and the exit code is 1; when all
      succeed it is 0.
    tests:
    - n6_fail::test_failing_task_sets_nonzero_exit_after_remaining_tasks_run
    - n6_fail::test_the_failure_is_in_the_returned_result_and_the_other_tasks_still_ran
    - n6_fail::test_a_run_whose_tasks_all_succeed_exits_zero
  - do: Request an unknown workflow, evaluator, or step name, and use an unsupported option.
    expect: An error names the unknown name and the installed ones, and an unsupported option exits with code 2 and names
      the option.
    tests:
    - n6_names::test_an_unknown_workflow_or_evaluator_name_is_reported_with_the_installed_ones
    - n6_names::test_an_unknown_step_name_is_reported
    - n6_names::test_get_workflow_unknown_raises
    - n6_names::test_a_config_naming_a_workflow_type_that_does_not_exist_is_refused_naming_it
    - n6_names::test_an_unsupported_option_exits_two_and_names_it
- id: 37-1
  req: NFR-7
  name: Container Security Pipeline
  type: Integration
  business: The pipeline scans each image before publishing it, signs it, and attaches a software bill of materials.
  conditions:
  - The pipeline definition in `.gitlab-ci.yml` and the pipeline results of a release
  steps:
  - do: Read the order of the `push:docker` job, and review the `push:docker`, `validate:docker`, and `container_scanning`
      CI jobs.
    expect: The image is scanned and the job fails on HIGH or CRITICAL findings before the image is pushed under its published
      tag, the JSON and table reports are kept, and the registry scan is a gate.
    tests:
    - n7_order::test_the_image_is_scanned_before_it_is_pushed_under_its_published_tag
    - n7_order::test_the_scan_gate_fails_on_high_and_critical_findings_and_the_report_is_kept
    - n7_order::test_the_scan_runs_at_the_pinned_trivy_version
    - 'CI: push:docker'
    - 'CI: container_scanning'
  - do: Read the signing steps and the committed key.
    expect: The image is signed and given a CycloneDX attestation after it is pushed, the pipeline verifies both with `docker/cosign.pub`,
      and the private key is never copied into an image.
    tests:
    - n7_order::test_the_pushed_image_is_signed_and_gets_a_cyclonedx_attestation_afterwards
    - n7_order::test_the_pipeline_verifies_the_signature_and_attestation_with_the_committed_key
    - n7_image::test_the_public_key_is_committed
    - n7_image::test_the_private_key_is_never_copied_into_an_image
    - 'CI: verify:docker'
  - do: Read the Dockerfiles' last stage.
    expect: Each copies the scan reports and SBOM to `/usr/share/dataeval-flow/security/`.
    tests:
    - n7_image::test_the_published_stage_adds_the_scan_reports_and_sbom_at_the_documented_path
  - do: Review the `release:sbom` CI job.
    expect: The CycloneDX SBOM is downloaded from the registry attestation and kept with no expiry.
    tests:
    - n7_order::test_a_release_republishes_the_sbom_as_a_permanent_artifact
    - 'CI: release:sbom'
- id: 37-2
  req: NFR-7
  name: Published Image Provenance
  type: Integration
  business: A published image verifies against the public key and carries its scan reports and SBOM.
  conditions:
  - A published release image (named by `DATAEVAL_FLOW_TEST_IMAGE_PUBLISHED`; these tests skip without it, and `cosign` is
    needed for the signature)
  steps:
  - do: Verify the image signature with `cosign` and the key at `docker/cosign.pub`.
    expect: The signature verifies.
    tests:
    - n7_sec::test_signature_verifies_against_the_committed_public_key
    - 'CI: verify:docker'
  - do: List `/usr/share/dataeval-flow/security/` in the image and read the reports.
    expect: The scan reports and `sbom.cdx.json` are present; the SBOM is CycloneDX and the scan report names the image it
      describes.
    tests:
    - n7_sec::test_scan_reports_and_sbom_are_inside_the_image
