# Verification registry for DataEval Flow (JATIC Program Standards v1.2.0 labeling).
#
# Source of truth for the requirements, test cases, and VCRM that CI publishes to the meta repo
# (see verification/generate_metarepo.py). Everything under <metarepo.path>/requirements,
# test-cases, and vcrm.md is generated from this file.
#
# A test case is a list of steps. Each step has `do` (an instruction), `expect` (the result),
# and `tests`, its evidence:
#   <alias>::<test>   a pytest node (aliases below expand to file and class)
#   CI: <job>         a pipeline job whose result is the evidence
#   NEW: <what>       a test that is planned and not yet written; the step reports as pending
#
# Test case ids are test-case-<requirement number>-<k>; NFR-n cases use 20+n.

metarepo:
  project_id: 409
  path: DataEval-Flow
product: DataEval Flow
distribution: dataeval-flow
aliases:
  pip: verification/functional/install/test_pip_install.py::TestPipInstall
  cli: verification/functional/cli/test_cli_entrypoints.py::TestCLIEntrypoints
  cfg: verification/functional/config/test_config_load.py::TestConfigLoading
  dset: verification/functional/dataset/test_dataset_configs.py::TestDatasetConfigs
  ext: verification/functional/extractors/test_extractor_configs.py::TestExtractorConfigs
  pre: verification/functional/pipeline/test_preprocessing_selection.py::TestPreprocessingView
  orch: verification/functional/orchestration/test_run_tasks.py::TestOrchestration
  clean: verification/functional/workflows/test_cleaning.py::TestDataCleaningWorkflow
  analysis: verification/functional/workflows/test_analysis.py::TestDataAnalysisWorkflow
  cov: verification/functional/workflows/test_coverage.py::TestDataCoverageWorkflow
  drift: verification/functional/workflows/test_drift.py::TestDriftMonitoringWorkflow
  ood: verification/functional/workflows/test_ood.py::TestOODWorkflow
  split: verification/functional/workflows/test_splitting.py::TestDataSplittingWorkflow
  prio: verification/functional/workflows/test_prioritization.py::TestDataPrioritizationWorkflow
  sweep: verification/functional/workflows/test_parameter_sweep.py::TestParameterSweepWorkflow
  rep: verification/functional/reporting/test_text_report.py::TestReporting
  env: verification/functional/metadata/test_metadata_envelope.py::TestResultMetadataEnvelope
  cache: verification/functional/cache/test_cache.py::TestCache
  docker: verification/functional/docker/test_dockerfile_present.py::TestDockerfiles
  maite: verification/functional/contracts/test_maite_entrypoints.py
  api: verification/functional/contracts/test_public_api.py::TestPublicAPI
  pyver: verification/nonfunctional/compatibility/test_python_versions.py::TestPythonVersions
  vmeta: verification/nonfunctional/packaging/test_version_metadata.py::TestVersionMetadata
  types: verification/nonfunctional/test_type_safety.py::TestTypeSafety
  repro: verification/nonfunctional/test_config_reproducibility.py::TestConfigReproducibility
  seed: verification/nonfunctional/test_seed_reproducibility.py::TestSeedConfiguration
  log: verification/nonfunctional/test_logging.py::TestLogging
  dsetload: verification/functional/dataset/test_dataset_configs.py::TestLoadDataset
  optx: verification/functional/install/test_pip_install.py::TestOptionalExtras
  clirun: verification/functional/cli/test_cli_headless.py::TestHeadlessCLI
  cpuimg: verification/functional/docker/test_container_runtime.py::TestCpuImage
  cudaimg: verification/functional/docker/test_container_runtime.py::TestCudaImage
  sec: verification/functional/docker/test_container_runtime.py::TestPublishedImageSecurity
  cuda: verification/nonfunctional/compatibility/test_cuda_fallback.py::TestCudaFallback
  maxp: verification/nonfunctional/performance/test_max_processes.py::TestMaxProcesses
  scale: verification/nonfunctional/performance/test_scale.py::TestScale
requirements:
- id: FR-1
  name: Installation & Optional Extras
  description: A user shall be able to install DataEval Flow and run the `dataeval-flow` command, and each optional
    extra shall add its capability without conflicting with the others.
  criteria:
  - '`pip install dataeval-flow` installs the package and puts the `dataeval-flow` console script on `PATH`; `python
    -m dataeval_flow` works in every install, including the container, where the script is not installed.'
  - Every optional extra (`cpu`, `cu126`, `cu130`, `onnx`, `onnx-cu126`, `onnx-cu130`, `opencv`, `app`, `ontology`)
    installs without conflicts; the mutually exclusive CUDA/CPU and ONNX groups are declared as such.
  - With an extra installed, the capability it enables imports and works.
- id: FR-2
  name: Configuration Loading
  description: DataEval Flow shall load, validate, and merge pipeline configuration from YAML and JSON into a typed
    `PipelineConfig`.
  criteria:
  - '`load_config(path)` parses a YAML or JSON file, and `load_config_folder(path)` merges every YAML and JSON file
    at the folder root.'
  - Invalid configuration raises a `pydantic.ValidationError` that points to the offending field.
  - '`export_params_schema()` returns the JSON schema of `PipelineConfig`.'
  - Dataset and workflow paths in a config resolve relative to the data root supplied at run time.
- id: FR-3
  name: Dataset Loading
  description: DataEval Flow shall load datasets from common structured formats and from user-defined factories,
    and return a MAITE-compatible dataset.
  criteria:
  - Image-folder, Hugging Face, COCO, and YOLO datasets load from their configs, and a `DatasetProtocolConfig` wraps
    a dataset object that a user factory built.
  - '`load_dataset()` returns an object that satisfies `dataeval.protocols.AnnotatedDataset`.'
- id: FR-4
  name: Feature Extractor Configuration
  description: DataEval Flow shall build each supported feature extractor from a validated config.
  criteria:
  - Flatten, Torch, ONNX, bag-of-visual-words, and uncertainty extractor configs each construct their extractor.
  - The extractor configs are exported from `dataeval_flow`, and an extractor built from a config produces embeddings.
- id: FR-5
  name: Preprocessing & Dataset Views
  description: DataEval Flow shall apply configured preprocessing transforms and dataset view operations to each
    source in a reproducible order.
  criteria:
  - '`PreprocessorConfig` applies an ordered list of `{target, params}` transforms.'
  - '`ViewConfig` stacks `ViewOperation` entries in order; a `Limit` operation reduces the dataset to the requested
    size.'
  - The same config and seed give the same pipeline result.
- id: FR-6
  name: Workflow Orchestration
  description: DataEval Flow shall discover the registered workflows and run the configured tasks in order against
    a shared context.
  criteria:
  - '`list_workflows()` returns the eight registered workflows (`data-analysis`, `data-cleaning`, `data-coverage`,
    `data-prioritization`, `data-splitting`, `drift-monitoring`, `ood-detection`, `parameter-sweep`) by name and
    description.'
  - '`get_workflow(name)` returns an object that satisfies `WorkflowProtocol` and raises `ValueError` for an unknown
    name.'
  - '`run_tasks(config, data_dir)` runs the selected, enabled tasks and returns one `WorkflowResult` per task.'
  - A failing task is reported in its result and does not stop the remaining tasks.
- id: FR-7
  name: Data Cleaning & Analysis
  description: DataEval Flow shall assess a single source for duplicates, outliers, bias, and quality with the `data-cleaning`
    and `data-analysis` workflows.
  criteria:
  - '`data-cleaning` returns `duplicates` and `outliers` findings for a source.'
  - '`data-analysis` runs a configurable set of bias, quality, and distribution analyses over one or more sources
    and exposes each analysis result.'
  - If an analysis raises, the `data-analysis` task fails with the error recorded in `result.errors`, and later
    tasks still run.
- id: FR-8
  name: Data Coverage
  description: DataEval Flow shall assess how fully a dataset covers its intended scope, by label space and by embedding
    space, with the `data-coverage` workflow.
  criteria:
  - Label distribution and metadata distribution analyses run on every invocation; metadata gap analysis runs when
    enabled and per-sample metadata is present.
  - Embedding coverage and dimensional completeness run when an extractor is configured, and are recorded as skipped
    when one is not.
  - A declared ontology (inline mapping or RDF file) defines the label space; without one, a flat ontology is built
    from the dataset's `index2label`. An ontology failure is recorded as a skip reason and does not stop the run.
  - Configured thresholds raise findings to `warning`; the ontology thresholds apply only to a declared ontology.
- id: FR-9
  name: Drift & Out-of-Distribution Monitoring
  description: DataEval Flow shall compare a target source against a reference source for drift and out-of-distribution
    samples with the `drift-monitoring` and `ood-detection` workflows.
  criteria:
  - '`drift-monitoring` takes `reference` and `target` sources and a configured detector, and reports the drift
    verdict and per-feature findings.'
  - '`ood-detection` fits a detector on the reference and returns an `instance_score` and a boolean `is_ood` mask,
    each the length of the target.'
  - A target that differs clearly from the reference is flagged by both workflows when the detector's distance metric
    can separate the two. For example, `ood-detection` with the default cosine distance cannot tell dark noise from
    bright noise, so such data needs the `euclidean` metric.
- id: FR-10
  name: Data Splitting & Prioritization
  description: DataEval Flow shall partition a source into named splits and rank its samples with the `data-splitting`
    and `data-prioritization` workflows.
  criteria:
  - '`data-splitting` returns one named index list per split. Splitting has no random component, so the same configuration
    gives identical splits; changing the test fraction, validation fraction, fold count, or stratification changes
    them.'
  - '`data-prioritization` returns a ranked index list as long as the source, using the configured scoring policy.'
  - An unsupported policy raises a `pydantic.ValidationError`.
- id: FR-11
  name: Parameter Sweep
  description: DataEval Flow shall run an inner workflow over a grid of parameter combinations and aggregate the
    results with the `parameter-sweep` workflow.
  criteria:
  - The workflow takes a parameter grid and returns one inner result per combination, aggregated into one `WorkflowResult`.
  - An error in one combination fails the `parameter-sweep` task and is recorded in its result; later tasks still
    run.
- id: FR-12
  name: Reporting & Export
  description: DataEval Flow shall give every `WorkflowResult` a readable report, a machine-readable export, and
    health values a script can gate on.
  criteria:
  - '`report()` returns a multi-line text report and `report(detailed=False)` returns a shorter summary.'
  - '`export(path, fmt)` writes JSON or YAML and returns the path; `export(None, fmt)` returns the serialized string.'
  - '`to_dict()` contains `metadata`, `health`, and the workflow `data`.'
  - '`health`, `warning_count`, and `findings` are available programmatically.'
- id: FR-13
  name: Result Metadata Envelope
  description: DataEval Flow shall attach a metadata envelope to every `WorkflowResult` that records the tool, configuration,
    datasets, health, and timing of the run (IR-3-S-12).
  criteria:
  - '`metadata` carries a schema `version`, a timezone-aware UTC `timestamp`, `tool` (`dataeval-flow`), `tool_version`
    (`dataeval_flow.__version__`), and a non-negative `execution_time_s`.'
  - '`metadata.resolved_config` holds the full effective configuration, including the seed, and `metadata.dataset_id`
    names the resolved source or sources.'
  - The envelope includes a `health` block with `status`, `warnings`, and `findings`.
  origin: IR-3-S-12
  origin_link: https://jatic.pages.jatic.net/internal-docs/standards/product/software/interoperability/#ir-3-model-and-data-interoperability
- id: FR-14
  name: Caching
  description: DataEval Flow shall cache expensive intermediate results under a content hash so repeated runs reuse
    earlier work.
  criteria:
  - A user-supplied cache root is created on first use and reused afterward.
  - Cache keys are stable for the same content, and entries are isolated per source.
  - A cache hit returns the stored payload unchanged; a miss returns `None` and leaves the cache intact.
- id: FR-15
  name: Command-Line Interface
  description: DataEval Flow shall run pipelines headlessly from the command line, configured by flags or environment
    variables, with discovery and help subcommands.
  criteria:
  - '`python -m dataeval_flow` runs the headless pipeline with `--config`, `--data`, `--output`, `--cache`, `--task`,
    `--max-processes`, `--fail-on-warning`, `--log-format`, and `--version`.'
  - Each operational option has a `DATAEVAL_*` environment variable, and a command-line argument takes precedence
    over it.
  - '`--fail-on-warning` makes a run that produces warnings exit non-zero.'
  - '`workflows`, `encoding`, `config`, and `app` subcommands each respond to `--help` with exit code 0; `workflows`
    lists the registered workflows.'
- id: FR-16
  name: Container Execution
  description: DataEval Flow shall run the headless pipeline from CPU and CUDA container images against bind-mounted
    data, cache, and output directories (IR-2, CS-1, CS-2).
  criteria:
  - The CPU, `cu126`, and `cu130` Dockerfiles are generated from one template and variants file, build OCI images
    for `linux/amd64`, and run as a non-root user.
  - Mounting data at `/dataeval`, output at `/output`, and optionally a cache at `/cache` is enough to run; an unmounted
    data or output directory is reported, and an unmounted cache falls back to in-memory.
  - The container honors the `DATAEVAL_*` environment variables, and `--help` or a run with no data prints a usage
    banner covering arguments, variables, mounts, and secret handling.
  - No secrets are read from the environment or stored in the image.
  - A CUDA image started without GPU access exits with code 1 and a message that names `--gpus all` and the `cpu`
    variant.
- id: FR-17
  name: MAITE Interoperability
  description: DataEval Flow shall interoperate with MAITE through declared entry points (IR-1).
  criteria:
  - The MAITE entry points the package declares each resolve to an importable target.
  - The entry-point targets satisfy the MAITE protocols under static verification.
- id: NFR-1
  name: Platform Compatibility
  description: DataEval Flow shall behave consistently on every supported Python version, installer, and hardware
    configuration.
  criteria:
  - Installs and passes the verification suite on Python 3.10, 3.11, 3.12, 3.13, and 3.14 (`requires-python >=3.10,<3.15`),
    with no version-gated public symbols.
  - Installs from PyPI with pip and uv, from source with pip, uv, and poetry, and into a conda environment from
    `environment.yml`.
  - Runs with and without CUDA, using the CPU when CUDA is absent.
- id: NFR-2
  name: Packaging & Distribution
  description: DataEval Flow shall be published as a Python package that follows PEP 517, 518, and 561.
  criteria:
  - The wheel installs cleanly under pip and uv and contains no `tests/` or `verification/` files.
  - The `py.typed` marker is installed with the package.
  - '`__version__` is a valid PEP 440 version, and `Name`, `Requires-Python`, and `License` (MIT) are set in the
    metadata.'
- id: NFR-3
  name: Type Safety
  description: DataEval Flow shall ship complete type information and typed protocols for its public interfaces.
  criteria:
  - '`pyright src/dataeval_flow` passes with zero errors.'
  - '`dataeval_flow.__all__` lists every public symbol, and each listed name imports.'
  - '`WorkflowProtocol` is `runtime_checkable`.'
- id: NFR-4
  name: Configuration, Reproducibility & Logging
  description: DataEval Flow shall produce the same outputs for the same configuration and seed, and shall log through
    the standard `logging` framework.
  criteria:
  - '`PipelineConfig.seed` is applied to every stochastic component through DataEval''s seed configuration, once
    per task, so a task''s result does not depend on which tasks ran before it; `deterministic` can force PyTorch
    deterministic algorithms.'
  - The same configuration and seed give identical results, apart from the ordering of tied entries in the bias
    summary's `top_values` for factors whose values are all unique (for example `id`). A different configuration
    gives different results.
  - The seed is recorded in the result envelope; an unseeded run records none.
  - Module loggers are standard `logging.Logger` objects named `dataeval_flow.*`, importing the package attaches
    no root handler, and the headless CLI installs a stream handler.
  - Console records carry an ISO-8601 UTC timestamp and level, selectable with `--log-format` or `DATAEVAL_LOG_FORMAT`
    (IR-2.2-S-1, IR-2.2-S-2).
- id: NFR-5
  name: Performance & Scale
  description: DataEval Flow shall read datasets lazily, keep its memory use predictable, reuse cached work, and
    track the time of reference pipelines for regressions.
  criteria:
  - Peak memory grows with the size of the stored embeddings and statistics (about 13 KB per 32x32 image for `data-cleaning`
    and 22 KB for `data-analysis` in reference measurements), not with the size of the images, because datasets
    are read lazily.
  - A repeat run with a warm cache reuses cached artifacts instead of recomputing them, and is typically much faster
    (about 15 times in reference measurements on 10,000 images).
  - The number of worker processes is configurable through `PipelineConfig.max_processes`, `--max-processes`, and
    `DATAEVAL_MAX_PROCESSES`. It is applied through DataEval's `set_max_processes` once per task, is recorded in
    `resolved_config`, and is respected inside the container. The default is a single process.
  - Raising it may shorten workloads on large images and may slow workloads on small images, where the cost of starting
    extra processes can outweigh the gain. In reference measurements, `data-analysis` and `data-cleaning` on 224x224
    images were faster with more processes, and `data-cleaning` on 32x32 images was slower; the figures are recorded
    with the test evidence.
  - The effect depends on the workflow, image size, CPU architecture, and platform. The measurements were taken
    on CPU on one development machine, so DataEval Flow makes no performance promise for other environments and
    does not recommend a process count; users should measure their own pipeline.
  - Reference pipelines (`data-cleaning` and `data-analysis` on a 10,000-image dataset) are timed on the pipeline
    runner, and a run that takes more than twice the recorded v0.2.4 baseline on that runner fails verification.
    The budget guards against regressions and is not a performance guarantee.
  notes:
  - Measured with `dataeval-flow==0.2.4` (process-count runs on the `max_processes` branch based on 0.2.4) on synthetic
    ImageFolder datasets, 10 classes.
  - 'Cold run and warm cache at 10,000 images of 32x32: `data-cleaning` 6.1 s and 0.4 s, `data-analysis` 11.8 s
    and 0.8 s. At 40,000 images: `data-cleaning` 25.0 s and 1.2 s, `data-analysis` 69.8 s and 4.1 s. Peak memory
    was 617 MB and 764 MB at 10,000 images, and 994 MB and 1.4 GB at 40,000.'
  - 'Process count, 10,000 images at 32x32 (`data-cleaning` / `data-analysis`): 1 process 5.4 s / 12.4 s, 2 processes
    6.2 s / 9.7 s, 4 processes 6.5 s / 7.0 s, 8 processes 6.4 s / 7.2 s.'
  - 'Process count, 4,000 images at 224x224 (`data-cleaning` / `data-analysis`): default 18.6 s / 109.8 s, 2 processes
    9.3 s / 76.8 s, 4 processes 9.1 s / 49.6 s, 8 processes 9.6 s / 80.0 s.'
  - 'Test environment: Windows 11 Pro (build 26300) host running WSL2 (kernel 6.18.40.1-microsoft-standard-WSL2,
    Ubuntu 24.04), AMD Ryzen 9 9950X3D (x86_64, 16 cores, 32 threads), 62 GB of memory visible to WSL2, ext4 virtual
    disk, CPU only (no GPU used). Python 3.12.12, PyTorch 2.14.1 (CPU), dataeval 1.1.4. Other development workloads
    were running on the machine during the measurements.'
  - 'Limitations: a small number of synthetic workloads on one machine, a single run per cell, so run-to-run variance
    is unknown (repeat runs of the same default configuration differed by up to about 20%), and no measurements
    on other hardware, operating systems, containers, or CI runners. Treat the figures as illustrative, not as expected
    performance.'
- id: NFR-6
  name: Robustness
  description: DataEval Flow shall report bad input and failing tasks clearly, and fail in a way a calling script
    can detect.
  criteria:
  - A missing config, a missing data directory, or an invalid config produces a clear error and a non-zero exit
    code.
  - A failing task is recorded in its result, the remaining tasks still run, and the run's exit code reflects the
    failure.
  - An unknown workflow name or unsupported option raises an error that names it.
- id: NFR-7
  name: Container Security & Provenance
  description: DataEval Flow shall publish container images that are scanned, signed, and shipped with a software
    bill of materials (CS-2, CS-3, DSOR-5).
  criteria:
  - The pipeline builds and scans each image before any registry write and fails when it finds HIGH or CRITICAL
    vulnerabilities (CS-2-H-2). Findings of Medium severity and above are recorded with the image.
  - Each image is signed with `cosign` and verifies against the public key at `docker/cosign.pub`.
  - Each image contains its Trivy scan reports and CycloneDX SBOM under `/usr/share/dataeval-flow/security/`, and
    the SBOM is attached to the registry as an attestation.
test_cases:
- id: 1-1
  req: FR-1
  name: Install and Extras
  type: Core Functionality
  business: A user can install DataEval Flow, run it from the command line, and add optional extras without conflicts.
  conditions:
  - A clean virtual environment with `pip install dataeval-flow`
  - A second environment with the `onnx` and `opencv` extras installed
  steps:
  - do: Import `dataeval_flow` and read `__version__`.
    expect: The package imports and `__version__` is set.
    tests:
    - pip::test_import_dataeval_flow
    - pip::test_version_is_set
  - do: Import the core modules.
    expect: All core modules import.
    tests:
    - pip::test_core_modules_importable
  - do: Run `dataeval-flow --version` and `python -m dataeval_flow --version`.
    expect: Both entry points run and report the installed build.
    tests:
    - cli::test_console_script_on_path
    - cli::test_version_reports_the_installed_build
  - do: In the extras environment, import each optional module.
    expect: Each optional module imports when its extra is installed.
    tests:
    - optx::test_optional_module_importable_if_installed
  - do: Review the `installpip`, `installpoetry`, and `installconda` CI jobs.
    expect: All extras install without dependency conflicts.
    tests:
    - 'CI: installpip'
    - 'CI: installpoetry'
    - 'CI: installconda'
- id: 2-1
  req: FR-2
  name: Configuration Loading
  type: Core Functionality
  business: A pipeline configuration loads from YAML, JSON, or a folder of fragments, and a bad configuration is
    rejected with a clear error.
  conditions:
  - DataEval Flow installed
  - Sample YAML and JSON configs, a folder of config fragments, and an invalid config
  steps:
  - do: Load a YAML file and a JSON file with `load_config`.
    expect: Each produces a `PipelineConfig`.
    tests:
    - cfg::test_load_yaml_single_file
    - cfg::test_load_json_single_file
  - do: Load a folder of fragments with `load_config_folder`.
    expect: The fragments merge into one `PipelineConfig`.
    tests:
    - cfg::test_load_config_folder_merges_files
  - do: Load the invalid config.
    expect: A `ValidationError` points to the offending field.
    tests:
    - cfg::test_invalid_config_raises_validation_error
  - do: Call `export_params_schema()`.
    expect: A JSON schema of `PipelineConfig` is returned.
    tests:
    - cfg::test_export_params_schema_describes_pipeline_config
  - do: Load a config with relative dataset paths and a data root.
    expect: The paths resolve against the data root.
    tests:
    - cfg::test_relative_dataset_paths_resolve_against_data_root
    - cfg::test_dataset_paths_must_stay_relative_to_the_data_root
- id: 3-1
  req: FR-3
  name: Dataset Loading
  type: Core Functionality
  business: Datasets in each supported format load as MAITE-compatible datasets.
  conditions:
  - DataEval Flow installed
  - Small image-folder, COCO, and YOLO datasets, and a user dataset factory
  steps:
  - do: Load the image-folder dataset with `load_dataset`.
    expect: The result satisfies `AnnotatedDataset` with the expected length.
    tests:
    - dsetload::test_load_dataset_image_folder
  - do: Load the COCO and YOLO datasets.
    expect: Images and annotations load with the expected length.
    tests:
    - dsetload::test_load_dataset_coco
    - dsetload::test_load_dataset_yolo
  - do: Build a dataset with a user factory and pass it through a `DatasetProtocolConfig`.
    expect: The factory is called and its dataset is returned unchanged.
    tests:
    - dsetload::test_protocol_config_factory_dataset_is_returned
  - do: Round-trip each dataset config (image folder, Hugging Face, COCO, YOLO, protocol) through serialization.
    expect: Each config reproduces itself.
    tests:
    - dset::test_image_folder_config_roundtrip
    - dset::test_huggingface_config_roundtrip
    - dset::test_coco_config_roundtrip
    - dset::test_yolo_config_roundtrip
    - dset::test_protocol_config_roundtrip
- id: 4-1
  req: FR-4
  name: Extractor Configuration
  type: Core Functionality
  business: Every supported feature extractor can be built from a config and used to produce embeddings.
  conditions:
  - DataEval Flow installed with the `onnx` and `opencv` extras
  steps:
  - do: Construct the Flatten, Torch, ONNX, bag-of-visual-words, and uncertainty extractors from their configs.
    expect: Each config constructs its extractor.
    tests:
    - ext::test_flatten_extractor_config_constructs
    - ext::test_torch_extractor_config_constructs
    - ext::test_onnx_extractor_config_constructs
    - ext::test_bovw_extractor_config_constructs
    - ext::test_uncertainty_extractor_config_constructs
  - do: Read the extractor configs from `dataeval_flow.__all__`.
    expect: Every extractor config is exported.
    tests:
    - ext::test_all_extractor_configs_exported
  - do: Run a Flatten extractor built from its config over a small dataset.
    expect: One embedding row per sample is returned.
    tests:
    - ext::test_flatten_extractor_from_config_embeds_every_sample
- id: 5-1
  req: FR-5
  name: Preprocessing and Views
  type: Core Functionality
  business: Preprocessing transforms and view operations apply in order and give the same result for the same config
    and seed.
  conditions:
  - DataEval Flow installed
  - A small image dataset
  steps:
  - do: Build a `PreprocessorConfig` with an ordered list of transforms.
    expect: The config accepts the transforms in order.
    tests:
    - pre::test_preprocessor_config_accepts_transforms
  - do: Build `ViewOperation` entries and stack them in a `ViewConfig`.
    expect: The operations construct and stack in order.
    tests:
    - pre::test_view_operation_constructs
    - pre::test_view_config_stacks_operations
  - do: Apply a `Limit` operation.
    expect: The dataset length equals the limit.
    tests:
    - pre::test_view_limit_reduces_dataset_length
  - do: Run the same config and seed twice.
    expect: Both runs give the same result.
    tests:
    - pre::test_seeded_shuffle_view_pipeline_is_deterministic
- id: 6-1
  req: FR-6
  name: Workflow Orchestration
  type: Core Functionality
  business: The registered workflows can be discovered and a configured set of tasks runs to completion even when
    one fails.
  conditions:
  - DataEval Flow installed
  - A pipeline config with several tasks, one of them set to fail
  steps:
  - do: Call `list_workflows()`.
    expect: The eight registered workflows are returned by name.
    tests:
    - orch::test_list_workflows_returns_seven
  - do: Call `get_workflow` with a known name and an unknown name.
    expect: A `WorkflowProtocol` object is returned for the known name, and `ValueError` for the unknown one.
    tests:
    - orch::test_get_workflow_returns_protocol
    - orch::test_get_workflow_unknown_raises
  - do: Call `run_tasks` on the config.
    expect: One `WorkflowResult` is returned per enabled task.
    tests:
    - orch::test_run_tasks_returns_results
  - do: Run a config where one task fails.
    expect: The failure is recorded in that result and the remaining tasks still run.
    tests:
    - orch::test_failing_task_is_recorded_and_remaining_tasks_run
- id: 7-1
  req: FR-7
  name: Cleaning and Analysis Workflows
  type: Core Functionality
  business: A single source can be checked for duplicates, outliers, bias, and quality.
  conditions:
  - DataEval Flow installed
  - A synthetic image-folder source with a planted duplicate and an outlier
  steps:
  - do: Run the `data-cleaning` workflow.
    expect: The result has `duplicates` and `outliers` findings and a non-empty report.
    tests:
    - clean::test_cleaning_workflow_runs
    - clean::test_planted_duplicate_and_outlier_are_found
  - do: Run the `data-analysis` workflow with bias and quality analyses.
    expect: The result exposes each analysis result and a non-empty report.
    tests:
    - analysis::test_analysis_workflow_runs
  - do: Run `data-analysis` with one sub-analysis made to fail.
    expect: The failure appears in `result.errors`, the task is marked unsuccessful, and the remaining tasks still
      run.
    tests:
    - analysis::test_failing_sub_analysis_is_recorded_in_errors
- id: 8-1
  req: FR-8
  name: Coverage Workflow
  type: Core Functionality
  business: A dataset can be assessed for how completely it covers its label space and embedding space.
  conditions:
  - DataEval Flow installed with the `ontology` extra
  - A source with per-sample metadata, and an ontology file
  steps:
  - do: Run `data-coverage` with an extractor configured.
    expect: Label, metadata, embedding, and dimensional analyses run and the report is non-empty.
    tests:
    - cov::test_coverage_workflow_runs
  - do: Run `data-coverage` with no extractor.
    expect: Embedding analyses are recorded as skipped and the run succeeds.
    tests:
    - cov::test_coverage_runs_without_extractor
  - do: Run `data-coverage` with a declared ontology.
    expect: The ontology defines the label space and ontology thresholds apply.
    tests:
    - cov::test_coverage_with_ontology
  - do: Run `data-coverage` with an unreadable ontology.
    expect: A skip reason is recorded and the run succeeds.
    tests:
    - cov::test_unreadable_ontology_is_recorded_as_a_skip_reason
  - do: Set a coverage threshold that the data fails.
    expect: A finding with `warning` severity is raised.
    tests:
    - cov::test_threshold_breach_raises_a_warning_finding
- id: 9-1
  req: FR-9
  name: Drift and OOD Workflows
  type: Core Functionality
  business: A target source can be compared with a reference source for drift and out-of-distribution samples.
  conditions:
  - DataEval Flow installed
  - A reference source and a clearly different target source
  steps:
  - do: Run `drift-monitoring` with the reference and target sources and a K-neighbors detector.
    expect: A drift verdict and per-feature findings are reported, and the report is non-empty.
    tests:
    - drift::test_drift_workflow_runs
  - do: Run `drift-monitoring` with a target drawn from the reference.
    expect: No drift is reported.
    tests:
    - drift::test_same_distribution_target_is_not_flagged_as_drift
  - do: Run `ood-detection` with the same sources.
    expect: '`instance_score` and `is_ood` are returned, each the length of the target.'
    tests:
    - ood::test_ood_workflow_runs
  - do: Check the `is_ood` mask for the clearly different target.
    expect: The different samples are flagged.
    tests:
    - ood::test_clearly_different_target_is_flagged_out_of_distribution
- id: 10-1
  req: FR-10
  name: Splitting and Prioritization
  type: Core Functionality
  business: A source can be split reproducibly into named splits and ranked by a scoring policy.
  conditions:
  - DataEval Flow installed
  - A synthetic image-folder source
  steps:
  - do: Run `data-splitting` with a seed.
    expect: One index list is returned per named split.
    tests:
    - split::test_splitting_workflow_runs
  - do: Run `data-splitting` twice with the same seed and once with a different test fraction.
    expect: The same seed gives identical splits and a different test fraction gives different splits.
    tests:
    - split::test_same_seed_gives_identical_splits_and_other_settings_give_different_ones
  - do: Run `data-prioritization` with a scoring policy.
    expect: A ranked index list as long as the source is returned, with a non-empty report.
    tests:
    - prio::test_prioritization_workflow_runs
  - do: Run `data-prioritization` with an unsupported policy.
    expect: A `ValidationError` is raised.
    tests:
    - prio::test_unsupported_policy_raises_validation_error
- id: 11-1
  req: FR-11
  name: Parameter Sweep
  type: Core Functionality
  business: An inner workflow can be run across a grid of parameters and the results collected.
  conditions:
  - DataEval Flow installed
  - A parameter grid of at least four combinations
  steps:
  - do: Run `parameter-sweep` over the grid.
    expect: One inner result per combination is returned, aggregated into one `WorkflowResult`.
    tests:
    - sweep::test_parameter_sweep_runs
    - sweep::test_sweep_returns_one_inner_result_per_combination
  - do: Run the sweep with one combination made to fail.
    expect: The error is reported in the task's `errors`, the sweep task is marked unsuccessful, and the remaining
      tasks still run.
    tests:
    - sweep::test_failing_combination_is_reported_and_later_tasks_still_run
- id: 12-1
  req: FR-12
  name: Reporting and Export
  type: Core Functionality
  business: Every result can be read as text, exported for tools, and gated on by scripts.
  conditions:
  - DataEval Flow installed
  - A `WorkflowResult` from a completed run
  steps:
  - do: Call `report()` and `report(detailed=False)`.
    expect: A non-empty multi-line report is returned, and the summary is shorter.
    tests:
    - rep::test_report_returns_nonempty_string
    - rep::test_summary_report_is_shorter_than_detailed
  - do: Export to JSON and YAML files and to memory.
    expect: Files are written and the path returned; with `None` the serialized string is returned.
    tests:
    - rep::test_export_json_writes_file
    - rep::test_export_yaml_writes_file
    - rep::test_export_without_a_path_returns_the_serialized_string
  - do: Call `to_dict()`.
    expect: The dict contains `metadata`, `health`, and `data`.
    tests:
    - rep::test_to_dict_includes_metadata_and_data
  - do: Read `health`, `warning_count`, and `findings`.
    expect: Each is available and consistent with the report.
    tests:
    - rep::test_health_warning_count_and_findings_support_gating
- id: 13-1
  req: FR-13
  name: Result Metadata Envelope
  type: Integration
  business: Every result carries the metadata the JATIC ecosystem expects.
  conditions:
  - DataEval Flow installed
  - A `WorkflowResult` from a seeded run
  steps:
  - do: Read the envelope `version`, `tool`, and `tool_version`.
    expect: The version is set, the tool is `dataeval-flow`, and `tool_version` matches the package version.
    tests:
    - env::test_version_field_set
    - env::test_tool_identifier
    - env::test_tool_version_matches_package
  - do: Read `timestamp` and `execution_time_s`.
    expect: The timestamp is timezone-aware and the time is non-negative.
    tests:
    - env::test_timestamp_is_timezone_aware
    - env::test_execution_time_nonnegative
  - do: Read `resolved_config` and `dataset_id`.
    expect: The config is a non-empty dict holding the seed, and `dataset_id` names the sources.
    tests:
    - env::test_resolved_config_is_dict_and_nonempty
    - env::test_dataset_id_names_the_sources_and_resolved_config_holds_the_seed
    - env::test_multi_source_dataset_id_lists_every_source
  - do: Read the `health` block.
    expect: '`status`, `warnings`, and `findings` are present.'
    tests:
    - env::test_envelope_carries_a_health_block
- id: 14-1
  req: FR-14
  name: Caching
  type: Core Functionality
  business: Repeated runs reuse cached results without mixing up sources or corrupting the cache.
  conditions:
  - DataEval Flow installed
  - An empty cache directory
  steps:
  - do: Store a payload in the cache and read it back.
    expect: The same payload is returned.
    tests:
    - cache::test_dataset_cache_roundtrip
  - do: Build the cache key for the same content from two instances.
    expect: The keys are equal.
    tests:
    - cache::test_cache_key_stable_across_instances
  - do: Read a key that was never stored.
    expect: '`None` is returned and the cache is unchanged.'
    tests:
    - cache::test_cache_miss_returns_none
  - do: Cache the same content for two different sources.
    expect: The entries are separate.
    tests:
    - cache::test_cache_entries_are_isolated_per_source
- id: 15-1
  req: FR-15
  name: Command-Line Interface
  type: Core Functionality
  business: A pipeline can be run unattended from the command line using flags or environment variables.
  conditions:
  - DataEval Flow installed
  - A config file and a small synthetic dataset
  steps:
  - do: Run `--help` for the module and each subcommand (`app`, `config`, `workflows`).
    expect: Each exits 0 and prints its usage.
    tests:
    - cli::test_module_help_exits_zero
    - cli::test_app_help_exits_zero
    - cli::test_config_help_exits_zero
    - cli::test_workflows_help_exits_zero
  - do: Run `workflows --json`.
    expect: The registered workflows are listed.
    tests:
    - cli::test_workflows_lists_the_registered_types
  - do: Run the headless pipeline end to end with flags.
    expect: Result files are written to the output directory and the exit code is 0.
    tests:
    - clirun::test_headless_run_with_flags_writes_results
  - do: Run it again with the same options set as `DATAEVAL_*` variables, and with a conflicting flag.
    expect: The variables configure the run and the flag takes precedence.
    tests:
    - clirun::test_environment_variables_configure_the_run_and_flags_win
  - do: Run a pipeline that produces a warning with `--fail-on-warning`.
    expect: The exit code is non-zero.
    tests:
    - clirun::test_fail_on_warning_exits_nonzero_on_warnings
- id: 16-1
  req: FR-16
  name: Container Execution
  type: Integration
  business: The published images run the pipeline against mounted directories as a non-root user.
  conditions:
  - The built CPU image, and a CUDA image
  - A host directory with a config and data, and an empty output directory
  steps:
  - do: Check that the CPU, `cu126`, and `cu130` Dockerfiles exist, start with `FROM`, and end with a non-root `USER`.
    expect: All three Dockerfiles pass the checks.
    tests:
    - docker::test_dockerfile_exists
    - docker::test_dockerfile_starts_with_from
    - docker::test_dockerfile_has_nonroot_user
  - do: Run the CPU image with the data and output directories mounted.
    expect: The pipeline runs as a non-root user and writes results to `/output`.
    tests:
    - cpuimg::test_pipeline_runs_against_mounted_directories_as_non_root
    - 'CI: verifydocker'
  - do: Run the image with no data mounted, and with `--help`.
    expect: A usage banner is printed that covers arguments, variables, mounts, and secrets.
    tests:
    - cpuimg::test_prints_usage_when_nothing_is_mounted_or_help_is_requested
  - do: Run the image with the cache unmounted.
    expect: The run succeeds using an in-memory cache.
    tests:
    - cpuimg::test_falls_back_to_in_memory_cache_when_cache_is_not_mounted
  - do: Run a CUDA image without `--gpus all`.
    expect: It exits with code 1 and a message that names the flag and the `cpu` variant.
    tests:
    - cudaimg::test_exits_with_one_and_names_the_gpu_flag_and_cpu_variant_without_gpu_access
- id: 17-1
  req: FR-17
  name: MAITE Entry Points
  type: Integration
  business: MAITE can discover DataEval Flow through its declared entry points.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Read the MAITE entry points declared by the installed package.
    expect: The expected entry points are declared.
    tests:
    - maite::test_declares_maite_entrypoints
  - do: Import each entry-point target.
    expect: Every target imports.
    tests:
    - maite::test_entrypoint_target_importable
  - do: Run static verification of the protocol entry points.
    expect: The targets satisfy the MAITE protocols.
    tests:
    - maite::test_protocol_entrypoints_statically_verify
- id: 21-1
  req: NFR-1
  name: Platform Compatibility
  type: Core Functionality
  business: DataEval Flow installs and runs on every supported Python version, installer, and hardware configuration.
  conditions:
  - CI pipeline results for Python 3.10 through 3.14
  steps:
  - do: Run the version checks on the current Python version.
    expect: The version is supported and the package imports.
    tests:
    - pyver::test_running_on_supported_version
    - pyver::test_import_succeeds_on_current_version
  - do: Review the `test` and `verify` CI jobs across the Python matrix.
    expect: The unit and verification suites pass on every supported version.
    tests:
    - 'CI: test'
    - 'CI: verify'
  - do: Review the `installpip`, `installpoetry`, and `installconda` CI jobs.
    expect: Installs from pip, uv, poetry, and conda resolve without conflicts.
    tests:
    - 'CI: installpip'
    - 'CI: installpoetry'
    - 'CI: installconda'
  - do: Run a workflow with CUDA hidden.
    expect: The workflow runs on CPU without error.
    tests:
    - cuda::test_workflow_runs_on_cpu_when_cuda_is_hidden
- id: 22-1
  req: NFR-2
  name: Package Distribution
  type: Core Functionality
  business: The released wheel has the right contents and metadata.
  conditions:
  - A built wheel and its installed copy
  steps:
  - do: Inspect the installed package contents.
    expect: The `py.typed` marker is present and no `tests/` or `verification/` files are included.
    tests:
    - vmeta::test_py_typed_marker_present
    - vmeta::test_no_test_files_in_installed_package
  - do: Read the version and metadata.
    expect: The version is valid PEP 440, and name, `Requires-Python`, and MIT license are set.
    tests:
    - vmeta::test_version_is_valid_pep440
    - vmeta::test_package_name
    - vmeta::test_requires_python
    - vmeta::test_license_set
  - do: Check the published release on PyPI.
    expect: The release version is available.
    tests:
    - 'NEW: published-release check (PyPI) in the release pipeline'
- id: 23-1
  req: NFR-3
  name: Type Safety
  type: Core Functionality
  business: DataEval Flow ships complete type information that downstream projects can check.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Check for the `py.typed` marker.
    expect: The marker exists.
    tests:
    - types::test_py_typed_marker_present
  - do: Read `__all__` and import every name in it.
    expect: '`__all__` is defined and every name imports.'
    tests:
    - types::test_top_level_all_defined
    - api::test_top_level_all_exports
    - api::test_all_exports_are_importable
    - api::test_run_tasks_and_load_config_present
  - do: Check `WorkflowProtocol` at run time.
    expect: It is `runtime_checkable`.
    tests:
    - types::test_workflow_protocol_runtime_checkable
  - do: Review the `type-check` CI job.
    expect: '`pyright` passes with zero errors on `src/dataeval_flow`.'
    tests:
    - 'CI: type-check'
- id: 24-1
  req: NFR-4
  name: Reproducibility and Logging
  type: Core Functionality
  business: A seeded configuration gives repeatable results, and DataEval Flow logs through the standard framework.
  conditions:
  - DataEval Flow installed
  - A pipeline config with a stochastic workflow
  steps:
  - do: Run the same config twice, then a changed config.
    expect: The first two runs match and the changed config differs.
    tests:
    - repro::test_same_config_produces_identical_output
    - repro::test_different_config_produces_different_output
  - do: Run a stochastic workflow with the same seed twice.
    expect: The outputs are identical.
    tests:
    - seed::test_same_seed_reproduces_stochastic_output
  - do: Check how the seed is applied and recorded.
    expect: The seed is applied to DataEval, recorded in the envelope, and absent when the run is unseeded.
    tests:
    - seed::test_seed_defaults_to_none
    - seed::test_seed_is_applied_to_dataeval
    - seed::test_seed_recorded_in_result_envelope
    - seed::test_unseeded_run_records_no_seed
  - do: Run the same task alone and after other tasks.
    expect: The result does not depend on which tasks ran before it.
    tests:
    - seed::test_seed_is_applied_per_task_independent_of_task_order
  - do: Check the module loggers and root logger.
    expect: Module loggers are standard loggers, and importing the package adds no root handler.
    tests:
    - log::test_logging_module_exports_setup
    - log::test_module_logger_is_logging_logger
    - log::test_importing_the_package_attaches_no_root_handler
  - do: Run the CLI with each `--log-format`.
    expect: Records carry the UTC timestamp and level in the selected format.
    tests:
    - log::test_setup_logging_attaches_root_handler
    - log::test_console_records_carry_utc_timestamp_and_level_for_each_log_format
- id: 25-1
  req: NFR-5
  name: Performance and Scale
  type: Performance
  business: Memory use follows the size of the stored results, cached reruns reuse earlier work, and reference pipelines
    are checked against their recorded time budgets for regressions.
  conditions:
  - A 10,000-image synthetic dataset
  - Reference hardware for the pipeline runner
  - Budgets recorded from the v0.2.4 baseline
  steps:
  - do: Run `data-cleaning` at two dataset sizes and record peak memory.
    expect: Peak memory grows roughly in proportion to the stored results (baseline 13 to 22 KB per image) and stays
      below the size of the raw pixels for 224x224 images, because datasets are read lazily.
    tests:
    - scale::test_peak_memory_follows_stored_results_not_dataset_size
  - do: Run a pipeline twice with a cache directory.
    expect: The second run reuses the cached artifacts and is faster (baseline about 15 times at 10,000 images).
    tests:
    - scale::test_warm_cache_rerun_reuses_artifacts_and_is_faster
  - do: Run a pipeline with `max_processes` set in the config, by flag, and by environment variable.
    expect: Each setting reaches DataEval's `set_max_processes` for every task and appears in `resolved_config`.
    tests:
    - maxp::test_config_field_reaches_dataeval_for_every_task_and_is_recorded
    - maxp::test_flag_and_variable_reach_dataeval_for_every_task_and_are_recorded
    - maxp::test_flag_overrides_the_config_field
  - do: Run `data-analysis` on 224x224 images (200 in the automated check, 4,000 in the reference measurements)
      at 1 process and at 4 processes.
    expect: Both times are recorded. The development-machine baseline was 0.45 times the single-process time at
      4 processes; the result is reported, not gated, because the benefit varies by platform.
    tests:
    - scale::test_data_analysis_time_at_one_and_four_processes_is_recorded
  - do: Time `data-cleaning` and `data-analysis` on the dataset.
    expect: Each completes within its budget. The CI-runner baselines are 24.3 s and 50.4 s (6.1 s and 11.8 s
      on the development machine), so the budgets are 50 s and 100 s.
    tests:
    - scale::test_reference_pipeline_completes_within_budget
- id: 26-1
  req: NFR-6
  name: Error Handling
  type: Edge Case
  business: Bad input and failing tasks produce clear errors and an exit code that scripts can detect.
  conditions:
  - DataEval Flow installed
  steps:
  - do: Run the CLI with a missing config, a missing data directory, and an invalid config.
    expect: Each prints a clear error and exits non-zero.
    tests:
    - cfg::test_invalid_config_raises_validation_error
    - clirun::test_missing_config_reports_an_error_and_exits_nonzero
    - clirun::test_missing_data_directory_reports_an_error_and_exits_nonzero
    - clirun::test_invalid_config_reports_an_error_and_exits_nonzero
  - do: Run a pipeline in which one task fails.
    expect: The failure is in that task's result, the other tasks run, and the exit code is non-zero.
    tests:
    - clirun::test_failing_task_sets_nonzero_exit_after_remaining_tasks_run
  - do: Request an unknown workflow name.
    expect: An error names the workflow.
    tests:
    - orch::test_get_workflow_unknown_raises
- id: 27-1
  req: NFR-7
  name: Container Security
  type: Integration
  business: Published images are scanned, signed, and shipped with a software bill of materials.
  conditions:
  - A published release image and its pipeline results
  steps:
  - do: Review the `validatedocker` and `container_scanning` CI jobs.
