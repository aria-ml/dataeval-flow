    - 'CI: container_scanning'
  - do: Verify the image signature with `cosign` and the key at `docker/cosign.pub`.
    expect: The signature verifies.
    tests:
    - sec::test_signature_verifies_against_the_committed_public_key
  - do: List `/usr/share/dataeval-flow/security/` in the image.
    expect: The scan reports and `sbom.cdx.json` are present.
    tests:
    - sec::test_scan_reports_and_sbom_are_inside_the_image
  - do: Review the `sbom` and `releasesbom` CI jobs.
    expect: The CycloneDX SBOM is attached to the registry as an attestation.
    tests:
    - 'CI: sbom'
    - 'CI: releasesbom'
