# =============================================================================
# Pipeline Configuration
# =============================================================================
# Schema: PipelineConfig (see src/dataeval_flow/config/_models.py)
# Place in your data directory (or use --config CLI option)
#
# yaml-language-server: $schema=params.schema.json
# =============================================================================
#
# Configuration follows a define-once, reference-by-name pattern:
#
#   datasets:      → named dataset definitions
#   views:         → named view (dataset operation) pipelines
#   sources:       → dataset + optional view bundles, or a merge of other sources
#   preprocessors: → named preprocessing pipelines
#   extractors:    → model + optional preprocessor + batch_size bundles
#   workflows:     → named workflow instances (type + params)
#   tasks:         → lightweight composition by name
#   exports:       → sources written out as datasets on disk
#
# Sources and extractors are composition layers that bundle related
# components. Tasks reference these by name — keeping tasks lightweight
# and configs centralized.

# -----------------------------------------------------------------------------
# REPRODUCIBILITY (optional)
# -----------------------------------------------------------------------------
# Pins every stochastic component of the run — clustering, random splits,
# shuffled views, sampling — through DataEval's seed configuration. Applied
# before each task, and recorded in the result envelope's resolved config.
# Leave unset if the run does not need to be bit-reproducible.
#
# seed: 42
# deterministic: false    # force PyTorch deterministic algorithms (slower)

# -----------------------------------------------------------------------------
# LOGGING (optional)
# -----------------------------------------------------------------------------
# logging:
#   app_level: DEBUG      # dataeval_flow loggers (DEBUG|INFO|WARNING|ERROR)
#   lib_level: WARNING    # third-party: torch, datasets, PIL (DEBUG|INFO|WARNING|ERROR)

# -----------------------------------------------------------------------------
# RESULT (optional)
# -----------------------------------------------------------------------------
# result:
#   name: result          # the files' name: result.json, result.txt, result.html
#   formats: [json, text, html]   # which files --output writes: json, text, html, junit (.xml), markdown (.md)
#   detail: full          # full | summary: how much of each report the text and HTML files hold
#   per_task: false       # true: one set of files per task, <name>-<task>.<ext>
#   fail_on: failure      # what exits non-zero: failure (1), warning (3 on health warnings), never
#   width: 80             # the text report's width, at least 40; --report-width overrides it
#   max_images: 200       # thumbnails each task's result embeds, shared evenly between its findings; 0: none, -1: all
#   max_rows: 500         # rows a table of items (flagged images, duplicate groups, …) lists; -1: every row
#   preview_rows: 10      # rows of such a table the text report and TUI show; -1: every row

# -----------------------------------------------------------------------------
# DATASETS
# -----------------------------------------------------------------------------
# Named dataset definitions. Sources reference these by name.
#
# datasets:
#   - name: my-dataset
#     format: huggingface        # huggingface | image_folder | coco | yolo
#     path: my-dataset             # relative to data root (/dataeval)
#     split: train               # HuggingFace only
#
#   - name: raw-photos
#     format: image_folder
#     path: raw-photos            # relative to data root
#     recursive: false
#
#   - name: classified-photos
#     format: image_folder
#     path: classified-photos     # relative to data root
#     infer_labels: true
#
#   - name: coco-train
#     format: coco
#     path: coco                  # relative to data root
#     annotations_file: annotations/instances_train.json   # also selects the split
#     images_dir: train2017
#
#   - name: yolo-train
#     format: yolo
#     path: yolo                  # dataset root: data.yaml + image/label trees
#     split: train                # train | val | test; omit to load every split
#     yaml_file: data.yaml        # optional: config outside the root's default name
#     ann_dir: labels             # optional: labels kept outside labels/
#
#   - name: m3fd
#     format: coco
#     path: m3fd
#     value_range: [0, 255]
#     # Named groups of bands, measured separately as `<group>_<statistic>` columns.
#     # A fact about the sensor, so every workflow reading this dataset sees the same one.
#     channel_groups: {rgb: [0, 1, 2], ir: 3}

# -----------------------------------------------------------------------------
# PREPROCESSING (optional)
# -----------------------------------------------------------------------------
# Named preprocessor definitions. Extractors reference these by name.
# Steps are pass-through to torchvision.transforms.v2.
# See: https://pytorch.org/vision/stable/transforms.html
#
# preprocessors:
#   - name: resnet50_preprocessor
#     steps:
#       - step: Resize
#         params:
#           size: [256, 256]
#           antialias: true
#       - step: CenterCrop
#         params:
#           size: [224, 224]
#       - step: ToDtype
#         params:
#           dtype: float32
#           scale: true
#       - step: Normalize
#         params:
#           mean: [0.485, 0.456, 0.406]
#           std: [0.229, 0.224, 0.225]

# -----------------------------------------------------------------------------
# VIEWS (optional)
# -----------------------------------------------------------------------------
# Named view pipelines (dataset operations). Sources reference these by name.
#
# views:
#   - name: training_subset
#     operations:
#       - type: Limit
#         params:
#           size: 10000
#
#   # One conform view per dataset being merged. The `class_remap` differs per
#   # dataset; the `target` must not.
#   - name: conform_mine
#     operations:
#       - type: Relabel
#         params:
#           class_remap: { car: Vehicle, truck: Vehicle }
#           target: [Person, Vehicle]
#
#   - name: conform_other
#     operations:
#       - type: Relabel
#         params:
#           class_remap: { pedestrian: Person, van: Vehicle }
#           target: [Person, Vehicle]

# -----------------------------------------------------------------------------
# SOURCES — Dataset or merge, + optional view
# -----------------------------------------------------------------------------
# Named source bundles. Tasks reference these by name.
#
# sources:
#   - name: my_dataset_full
#     dataset: my-dataset
#
#   - name: my_dataset_subset
#     dataset: my-dataset
#     view: training_subset
#
#   - name: my_dataset_conformed
#     dataset: my-dataset
#     view: conform_mine
#
#   - name: coco_train_conformed
#     dataset: coco-train
#     view: conform_other
#
#   # A source names either `dataset` or `merge`, never both. A merge names at
#   # least two sources and concatenates them in the order given. Give every
#   # operand a view whose `Relabel` passes the identical `target`, or their
#   # integer labels denote different classes and the merge is refused. Each
#   # datum's id becomes "<position>:<id>".
#   - name: merged_dataset
#     merge: [my_dataset_conformed, coco_train_conformed]
#     view: training_subset            # optional, applied after the merge

# -----------------------------------------------------------------------------
# EXTRACTORS — Model + optional preprocessor + batch_size
# -----------------------------------------------------------------------------
# Named extractor bundles. Tasks reference these by name.
#
# extractors:
#   - name: resnet_extractor
#     model: onnx
#     model_path: "./resnet50-v2-7.onnx"
#     output_name: "resnetv24_flatten0_reshape0"
#     preprocessor: resnet50_preprocessor
#     batch_size: 64
#
#   - name: flat_extractor
#     model: flatten
#
#   - name: bovw_extractor
#     model: bovw
#     vocab_size: 2048                 # 256–4096
#     batch_size: 32
#
#   - name: torch_extractor
#     model: torch
#     model_path: "./model.pt"
#     layer_name: "avgpool"            # layer for forward-hook extraction
#     use_output: true                 # capture layer output (True) or input (False)
#
#   - name: uncertainty_extractor
#     model: uncertainty
#     model_path: detector.onnx
#     metadata_path: detector.json   # DataEval's model metadata: task, input size, class count
#     preds_type: sigmoid            # logits, probs or sigmoid
#     confidence: 0.25               # a detector only: keep boxes whose top score is at least this

# -----------------------------------------------------------------------------
# ONTOLOGIES — Named label spaces, referenced by workflows
# -----------------------------------------------------------------------------
# Declare concepts here to extend the artifact without editing it. Give each
# one the dataset's own spelling under `synonyms`: alignment matches on labels
# and synonyms, and a concept without that spelling will not match the class.
#
# ontologies:
#   - name: vehicles
#     source: config/label_ontology.jsonld
#     concepts:
#       - id: http://example.org/cv#FreightCar
#         label: Freight Car
#         synonyms: [freight_car, freight car]
#         parents: [http://example.org/cv#LandVehicle]
#         definition: A railway car designed to carry freight.

# -----------------------------------------------------------------------------
# STATS — Named policies: what is measured, over which views, and who reads it
# -----------------------------------------------------------------------------
# Define a policy once and reference it by name so workflows meant to be
# compared measure the same things.
#
# stats:
#   - name: multispectral
#     # Read as a complete statement: a view with no entry is not measured.
#     measure:
#       - {bands: ~,   families: [dimension, visual, hash]}
#       - {bands: rgb, families: [visual]}
#       - {bands: ir,  families: [visual, pixel]}
#     # Measure every pixel the boxes do not cover, as `background_*` columns.
#     background: true
#     # Views whose columns flag an outlier. Defaults to the whole image alone, so adding
#     # a band group does not move a cleaning result until you name it here.
#     outliers_from: [~]
#     # Views whose columns become metadata factors. Same default, same reason.
#     factors_from: [~, rgb, ir]

# -----------------------------------------------------------------------------
# WORKFLOWS — Named workflow instances (type + params)
# -----------------------------------------------------------------------------
# Each workflow instance binds a workflow type to specific parameters.
# Tasks reference these instances by name.
#
# workflows:
#   - name: standard_clean
#     type: quality
#     outliers:
#       flags: [dimension, pixel, visual]
#       outlier_threshold: adaptive
#
#   - name: strict_clean
#     type: quality
#     outliers:
#       flags: [dimension, pixel, visual]
#       outlier_threshold: [zscore, 2.0]
#     checks:
#       image-duplicates: {exact: 0.0, near: 1.0}
#       image-outliers: {warning: 1.0}
#
#   - name: basic_drift
#     type: shift                     # each test source is tested on its own against the first, the reference
#     detectors:                      # drift evaluator entries: drift-univariate | drift-mmd | drift-kneighbors |
#       - type: drift-univariate      #   drift-domain-classifier; an entry's `name` (default: its type) names its step
#         method: ks                  # ks | cvm | mwu | anderson | bws
#         p_val: 0.05
#         correction: bonferroni      # bonferroni | fdr
#         chunking:                   # optional temporal drift analysis
#           chunk_size: 500           # or chunk_count; the reference needs >= 3 chunks
#           incomplete: keep          # keep | drop | append the reference's short final chunk
#     classwise: {drift-univariate: class}   # detectors to also run per key, unchunked: class or predicted
#     checks:
#       drift: {warn_on_drift: true, chunk_percent: 10.0, consecutive_chunks: 3}
#
#   - name: clean
#     type: quality
#     stats: multispectral
#     outliers:
#       flags: [visual]
#       outlier_threshold: modzscore

# -----------------------------------------------------------------------------
# EVALUATORS — Named evaluator instances (type + params)
# -----------------------------------------------------------------------------
# Each evaluator instance binds an evaluator type to specific parameters, run on its
# own with no health verdict. Tasks reference these by `evaluator:` instead of
# `workflow:`. See docs/source/reference/evaluators.md for every type and parameter.
#
# evaluators:
#   - name: dupes
#     type: duplicates
#     flags: [hash_basic, hash_d4]
#
#   - name: balance
#     type: balance          # reads metadata; a task naming an extractor is refused
#     class_imbalance_threshold: 0.2

# -----------------------------------------------------------------------------
# TASKS — Lightweight composition by name
# -----------------------------------------------------------------------------
# Each task references a workflow instance, sources, and optional extractor.
#
# tasks:
#   - name: clean_train
#     workflow: standard_clean
#     sources: my_dataset_full
#     enabled: true                    # set false to skip this task (default: true)
#
#   - name: clean_strict
#     workflow: strict_clean
#     sources: my_dataset_full
#     extractor: resnet_extractor
#
#   - name: find_dupes
#     evaluator: dupes
#     sources: my_dataset_full

# -----------------------------------------------------------------------------
# EXPORTS — Write a source out as a dataset (optional)
# -----------------------------------------------------------------------------
# Each export names a source, not a task, so it is written whether or not a
# task reads that source. Written to output/datasets/<name>/, beside
# output/results/, with a provenance.json sidecar recording every write.
# Declare the ontology here as well: an export names no workflow, so it
# inherits none, and one written without it carries label-space digests the
# run's envelope does not.
#
# exports:
#   - name: conformed_dataset
#     source: merged_dataset
#     format: coco                     # coco | yolo | huggingface_vision | visdrone
#     mode: error                      # error (refuse a non-empty destination) | replace | append
#     ontology: vehicles               # name under `ontologies:`, or a path
